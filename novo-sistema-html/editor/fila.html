<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/png" href="/assets/img/icon.png">
<link rel="apple-touch-icon" href="/assets/img/icon-app.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A2540">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fila do Editor — Ventus</title>
<script src="/assets/js/config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.tile { background-image: linear-gradient(135deg, #1E3A8A, #7C3AED); }
.tile.t2 { background-image: linear-gradient(135deg, #16A34A, #1E3A8A); }
.tile.t3 { background-image: linear-gradient(135deg, #F59E0B, #DC2626); }
.tile.t4 { background-image: linear-gradient(135deg, #0EA5E9, #1E3A8A); }
.tile.t5 { background-image: linear-gradient(135deg, #EC4899, #7C3AED); }
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-brand"><div class="sidebar-brand-mark" style="background:transparent;"><img src="/assets/img/icon-branco.png" alt="Ventus" style="width:100%;height:100%;object-fit:contain;display:block;"></div><div><div>Ventus</div><div style="font-size:11px;font-weight:400;opacity:.6;">Editor</div></div></div>
  <a href="#" id="nav-fila" class="sidebar-link active" onclick="event.preventDefault();setEditorView('fila')"><i data-lucide="palette"></i>Fila de edição</a>
  <a href="#" id="nav-finalizadas" class="sidebar-link" onclick="event.preventDefault();setEditorView('finalizadas')"><i data-lucide="check-circle"></i>Finalizadas</a>
  <a href="#" id="nav-produtividade" class="sidebar-link" onclick="event.preventDefault();setEditorView('produtividade')"><i data-lucide="bar-chart-2"></i>Minha produtividade</a>
  <div class="sidebar-footer"><div class="avatar" id="prestadorAvatar">ED</div><div style="flex:1;"><div style="font-size:13px;font-weight:600;" id="prestadorNome">Editor</div><div style="font-size:11px;opacity:.6;" id="prestadorFuncao">Editor freelancer</div></div><a href="../index.html" style="color:rgba(255,255,255,.6);"><i data-lucide="home" class="w-4 h-4"></i></a></div>
</aside>

<div class="app-shell">
  <header class="topbar">
    <div style="flex:1;"></div>
    <div class="flex gap-2 items-center">
      <span class="badge badge-info">SLA: 3 a 5 dias</span>
      <button class="btn btn-secondary btn-sm" onclick="carregarFila()"><i data-lucide="refresh-cw" class="w-4 h-4"></i> Recarregar</button>
    </div>
  </header>

  <main class="app-content">
    <div class="text-sm" style="color:var(--gray-500);">Editor / <span id="crumb-view">Fila de edição</span></div>
    <h1 class="text-2xl font-bold mt-1 mb-6" style="color:var(--gray-900);" id="view-title">Fila de edição</h1>

    <!-- Contadores por etapa (a partir de resumo) -->
    <div id="kpis" class="grid grid-cols-4 gap-4 mb-6"></div>

    <!-- Visão "Minha produtividade" -->
    <div id="produtividade" style="display:none;"></div>

    <!-- Erro amigável de carregamento -->
    <div id="filaErro" class="card mt-2" style="display:none;border-color:var(--danger);">
      <div class="card-body" style="padding:18px;display:flex;align-items:center;gap:12px;">
        <div class="kpi-icon" style="background:#FEE2E2;color:#991B1B;flex:none;"><i data-lucide="wifi-off" class="w-5 h-5"></i></div>
        <div style="flex:1;">
          <strong style="color:var(--gray-900);">Não foi possível carregar a fila</strong>
          <div class="text-sm" style="color:var(--gray-500);" id="filaErroMsg">Verifique sua conexão e tente novamente.</div>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="carregarFila()"><i data-lucide="refresh-cw" class="w-4 h-4"></i> Tentar de novo</button>
      </div>
    </div>

    <!-- Colunas kanban por status -->
    <div id="kanban" class="grid gap-4" style="grid-template-columns:repeat(4,1fr);align-items:start;"></div>
  </main>
</div>
<script>
lucide.createIcons();

// ---- Identificação do prestador via ?p=<id> ----
(function identificarPrestador(){
  var pid = new URLSearchParams(location.search).get('p');
  if(!pid) return; // sem ?p mantém rótulo genérico ("Editor")
  function iniciais(nome){
    var partes = String(nome||'').trim().split(/\s+/).filter(Boolean);
    if(!partes.length) return 'ED';
    return (partes[0][0] + (partes.length>1 ? partes[partes.length-1][0] : '')).toUpperCase();
  }
  function aplicar(p){
    if(!p || !p.nome) return;
    var elNome = document.getElementById('prestadorNome');
    var elFunc = document.getElementById('prestadorFuncao');
    var elAv   = document.getElementById('prestadorAvatar');
    if(elNome) elNome.textContent = p.nome;
    if(elFunc) elFunc.textContent = p.funcao || 'Editor';
    if(elAv)   elAv.textContent = iniciais(p.nome);
  }
  // tenta rota direta; se falhar, busca lista e filtra pelo id
  fetch(apiUrl('/api/cadastro/prestador/' + encodeURIComponent(pid)))
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(aplicar)
    .catch(function(){
      fetch(apiUrl('/api/cadastro/prestador'))
        .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
        .then(function(d){
          var lista = (d && d.itens) || [];
          aplicar(lista.find(function(x){ return String(x.id) === String(pid); }));
        })
        .catch(function(){ /* silencioso: mantém rótulo genérico */ });
    });
})();

// ---- Estado ----
var STATUS_ORDER = ["aberta", "em_andamento", "concluida", "entregue"];
var statusLabels = {}; // preenchido por /api/os/opcoes (fallback abaixo)
var tiposLabels = {};
var STATUS_FALLBACK = [["aberta","Aberta"],["em_andamento","Em andamento"],["concluida","Concluída"],["entregue","Entregue"]];

// Ícone/cor de cada etapa (visual, sem depender da API)
var STATUS_META = {
  aberta:       { icon:"clock",        bg:"#FEF3C7", fg:"#92400E" },
  em_andamento: { icon:"palette",      bg:"#FCE7F3", fg:"#9D174D" },
  concluida:    { icon:"check",        bg:"#DCFCE7", fg:"#166534" },
  entregue:     { icon:"package-check",bg:"#DBEAFE", fg:"#1E40AF" }
};

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function labelStatus(st){ return statusLabels[st] || st; }
function labelTipo(t){ return tiposLabels[t] || (t||""); }

function prioridadeBadge(p){
  var v = (p||"").toLowerCase();
  if (v.indexOf("urg") >= 0) return '<span class="badge badge-danger">Urgente</span>';
  if (v.indexOf("alta") >= 0) return '<span class="badge badge-danger">Alta</span>';
  if (v.indexOf("baixa") >= 0) return '<span class="badge">Baixa</span>';
  if (v) return '<span class="badge">' + esc(p) + '</span>';
  return "";
}

function fmtPrazo(iso){
  if (!iso) return null;
  var d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  var hoje = new Date(); hoje.setHours(0,0,0,0);
  var alvo = new Date(d); alvo.setHours(0,0,0,0);
  var dias = Math.round((alvo - hoje) / 86400000);
  if (dias < 0) return "Atrasado " + Math.abs(dias) + "d";
  if (dias === 0) return "Vence hoje";
  if (dias === 1) return "Vence amanhã";
  return "Vence em " + dias + "d";
}

function proxStatus(st){ var i = STATUS_ORDER.indexOf(st); return (i>=0 && i<STATUS_ORDER.length-1) ? STATUS_ORDER[i+1] : null; }
function antStatus(st){ var i = STATUS_ORDER.indexOf(st); return i>0 ? STATUS_ORDER[i-1] : null; }

// ---- Fetch ----
function carregarOpcoes(){
  return fetch(apiUrl('/api/os/opcoes'))
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(op){
      var st = (op && op.status && op.status.length) ? op.status : STATUS_FALLBACK;
      statusLabels = {}; st.forEach(function(p){ statusLabels[p[0]] = p[1]; });
      tiposLabels = {}; (op && op.tipos || []).forEach(function(p){ tiposLabels[p[0]] = p[1]; });
    })
    .catch(function(){
      // Fallback: rótulos padrão do contrato
      statusLabels = {}; STATUS_FALLBACK.forEach(function(p){ statusLabels[p[0]] = p[1]; });
    });
}

function carregarFila(){
  document.getElementById('filaErro').style.display = 'none';
  var kanban = document.getElementById('kanban');
  kanban.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--gray-500);"><i data-lucide="loader" class="w-5 h-5"></i> Carregando fila…</div>';
  lucide.createIcons();

  return fetch(apiUrl('/api/os'))
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(data){
      render(data.itens || [], data.resumo || {});
    })
    .catch(function(err){
      kanban.innerHTML = '';
      var box = document.getElementById('filaErro');
      box.style.display = '';
      document.getElementById('filaErroMsg').textContent = 'Não foi possível falar com o servidor (' + (err && err.message || 'erro') + ').';
      document.getElementById('kpis').innerHTML = '';
      lucide.createIcons();
    });
}

// ---- Render ----
function renderKpis(resumo){
  var el = document.getElementById('kpis');
  el.innerHTML = STATUS_ORDER.map(function(st){
    var m = STATUS_META[st] || { icon:"folder", bg:"#F3F4F6", fg:"#374151" };
    var n = resumo[st] != null ? resumo[st] : 0;
    return '<div class="kpi">' +
      '<div class="kpi-icon" style="background:'+m.bg+';color:'+m.fg+';"><i data-lucide="'+m.icon+'" class="w-5 h-5"></i></div>' +
      '<div class="kpi-label">'+esc(labelStatus(st))+'</div>' +
      '<div class="kpi-value">'+n+'</div>' +
      '<div class="kpi-trend" style="color:var(--gray-500);">'+(n===1?'1 ordem':n+' ordens')+'</div>' +
    '</div>';
  }).join('');
  lucide.createIcons();
}

// Fotos que o fotógrafo enviou vêm como URLs no texto da observação — vira grade de miniaturas.
function fotosDoTexto(txt){
  if(!txt) return [];
  var urls = String(txt).match(/https?:\/\/[^\s"'<>]+/gi) || [];
  return urls.filter(function(u){ return /\.(jpe?g|png|webp|gif)(\?|$)/i.test(u); });
}
function textoSemUrls(txt){
  return String(txt||'').replace(/\d+\.\s*/g,'').replace(/https?:\/\/[^\s"'<>]+/gi,'').replace(/\n{2,}/g,'\n').trim();
}
function galeriaMiniaturas(urls){
  if(!urls.length) return '';
  return '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;">' +
    urls.slice(0,9).map(function(u){
      return '<a href="'+esc(u)+'" target="_blank" rel="noopener" title="Abrir foto" style="display:block;width:56px;height:56px;border-radius:8px;overflow:hidden;border:1px solid var(--gray-200);"><img src="'+esc(u)+'" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block;"></a>';
    }).join('') +
    (urls.length>9?'<span style="align-self:center;font-size:11px;color:var(--gray-500);">+'+(urls.length-9)+' fotos</span>':'') +
  '</div>';
}

function cardOS(os){
  var linhas = [];
  if (os.turma && os.turma.nome) linhas.push('<span><i data-lucide="graduation-cap" class="inline w-3 h-3"></i> '+esc(os.turma.nome)+'</span>');
  else if (os.aluno && os.aluno.nome) linhas.push('<span><i data-lucide="user" class="inline w-3 h-3"></i> '+esc(os.aluno.nome)+'</span>');
  if (os.tipo) linhas.push('<span><i data-lucide="tag" class="inline w-3 h-3"></i> '+esc(labelTipo(os.tipo))+'</span>');
  if (os.responsavel) linhas.push('<span><i data-lucide="user-check" class="inline w-3 h-3"></i> '+esc(os.responsavel)+'</span>');
  var prazo = fmtPrazo(os.prazo);
  if (prazo) linhas.push('<span><i data-lucide="calendar" class="inline w-3 h-3"></i> '+esc(prazo)+'</span>');
  if (os.dias_na_etapa != null) linhas.push('<span><i data-lucide="clock" class="inline w-3 h-3"></i> '+esc(os.dias_na_etapa)+'d nesta etapa</span>');

  var prox = proxStatus(os.status);
  var ant = antStatus(os.status);
  var acoes = '';
  if (ant) acoes += '<button class="btn btn-secondary btn-sm" title="Voltar para '+esc(labelStatus(ant))+'" onclick="moverOS(\''+esc(os.id)+'\',\''+ant+'\',this)"><i data-lucide="arrow-left" class="w-4 h-4"></i></button>';
  if (prox) acoes += '<button class="btn btn-primary btn-sm" style="flex:1;justify-content:center;" onclick="moverOS(\''+esc(os.id)+'\',\''+prox+'\',this)"><i data-lucide="arrow-right" class="w-4 h-4"></i> '+esc(labelStatus(prox))+'</button>';
  if (!prox && !ant) acoes = '<span class="text-sm" style="color:var(--gray-500);">Sem próxima etapa</span>';

  return '<div class="card" style="margin-bottom:12px;">' +
    '<div class="card-body" style="padding:14px;">' +
      '<div class="flex justify-between items-start" style="gap:8px;">' +
        '<strong style="font-size:14px;color:var(--gray-900);">'+esc(os.titulo||'Ordem de serviço')+'</strong>' +
        (prioridadeBadge(os.prioridade)) +
      '</div>' +
      '<div class="flex flex-col gap-1 mt-2" style="font-size:12px;color:var(--gray-600);">'+linhas.join('')+'</div>' +
      (function(){ var fs=fotosDoTexto(os.observacoes); var t=fs.length?textoSemUrls(os.observacoes):String(os.observacoes||'').trim();
        return (t?'<div class="text-sm mt-2" style="color:var(--gray-500);white-space:pre-wrap;">'+esc(t)+'</div>':'') + galeriaMiniaturas(fs); })() +
      '<div class="flex gap-2 mt-3">'+acoes+'</div>' +
    '</div>' +
  '</div>';
}

// Guarda os dados carregados e roteia entre as 3 visões da sidebar
var EDITOR_VIEW = 'fila', ITENS_ALL = [], RESUMO_ALL = {};
var STATUS_FINAL = ['concluida', 'entregue'];

function render(itens, resumo){
  ITENS_ALL = itens || [];
  RESUMO_ALL = resumo || {};
  renderView();
}

function setEditorView(v){
  EDITOR_VIEW = v;
  ['fila','finalizadas','produtividade'].forEach(function(x){
    var el = document.getElementById('nav-'+x); if(el) el.classList.toggle('active', x===v);
  });
  renderView();
}

function renderView(){
  var titulos = { fila:'Fila de edição', finalizadas:'Finalizadas', produtividade:'Minha produtividade' };
  var t = titulos[EDITOR_VIEW] || 'Fila de edição';
  document.getElementById('view-title').textContent = t;
  document.getElementById('crumb-view').textContent = t;
  var kanban = document.getElementById('kanban');
  var prod = document.getElementById('produtividade');
  var kpis = document.getElementById('kpis');

  if (EDITOR_VIEW === 'produtividade'){
    kanban.style.display = 'none'; kpis.style.display = 'none'; prod.style.display = '';
    renderProdutividade(); return;
  }
  prod.style.display = 'none'; kanban.style.display = '';
  if (EDITOR_VIEW === 'finalizadas'){ kpis.style.display = 'none'; renderFinalizadas(); return; }
  kpis.style.display = ''; renderKpis(RESUMO_ALL); renderFila();
}

// Vazio padrão (mensagem configurável)
function vazioMsg(icon, titulo, sub){
  return '<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--gray-500);">' +
    '<i data-lucide="'+icon+'" style="width:48px;height:48px;opacity:.4;"></i>' +
    '<div style="margin-top:12px;font-weight:600;color:var(--gray-700);">'+esc(titulo)+'</div>' +
    (sub?'<div class="text-sm">'+esc(sub)+'</div>':'') +
  '</div>';
}

// Visão FILA — kanban por status (todas as ordens)
function renderFila(){
  var kanban = document.getElementById('kanban');
  kanban.style.gridTemplateColumns = 'repeat(4,1fr)';
  if (!ITENS_ALL.length){ kanban.innerHTML = vazioMsg('inbox','Nenhuma ordem de serviço na fila','Quando novas ordens chegarem, elas aparecem aqui.'); lucide.createIcons(); return; }
  var porStatus = {};
  STATUS_ORDER.forEach(function(st){ porStatus[st] = []; });
  ITENS_ALL.forEach(function(os){ (porStatus[os.status] || (porStatus[os.status]=[])).push(os); });
  kanban.innerHTML = STATUS_ORDER.map(function(st){
    var lista = porStatus[st] || [];
    var cards = lista.length ? lista.map(cardOS).join('') : '<div class="text-sm" style="color:var(--gray-400);padding:8px 2px;">Vazio</div>';
    return '<div>' +
      '<div class="flex justify-between items-center mb-3" style="padding:0 2px;">' +
        '<strong style="font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--gray-700);">'+esc(labelStatus(st))+'</strong>' +
        '<span class="badge">'+lista.length+'</span>' +
      '</div>' + cards +
    '</div>';
  }).join('');
  lucide.createIcons();
}

// Visão FINALIZADAS — ordens concluídas/entregues em grade
function renderFinalizadas(){
  var kanban = document.getElementById('kanban');
  kanban.style.gridTemplateColumns = 'repeat(3,minmax(0,1fr))';
  var finais = ITENS_ALL.filter(function(os){ return STATUS_FINAL.indexOf(os.status) >= 0; });
  if (!finais.length){ kanban.innerHTML = vazioMsg('check-circle','Nenhuma ordem finalizada ainda','Quando você concluir ou entregar ordens, elas aparecem aqui.'); lucide.createIcons(); return; }
  kanban.innerHTML = finais.map(cardOS).join('');
  lucide.createIcons();
}

// Visão MINHA PRODUTIVIDADE — números do editor
function renderProdutividade(){
  var prod = document.getElementById('produtividade');
  var total = ITENS_ALL.length;
  var cont = {}; STATUS_ORDER.forEach(function(st){ cont[st] = 0; });
  ITENS_ALL.forEach(function(os){ if(cont[os.status]!=null) cont[os.status]++; });
  var finalizadas = (cont.concluida||0) + (cont.entregue||0);
  var andamento = (cont.aberta||0) + (cont.em_andamento||0);
  var taxa = total ? Math.round(finalizadas*100/total) : 0;

  var kpiCards = [
    { label:'Total de ordens', valor: total, icon:'layers', bg:'#EEF2FF', fg:'#3730A3' },
    { label:'Finalizadas', valor: finalizadas, icon:'check-circle', bg:'#DCFCE7', fg:'#166534' },
    { label:'Em andamento', valor: andamento, icon:'palette', bg:'#FEF3C7', fg:'#92400E' },
    { label:'Taxa de conclusão', valor: taxa+'%', icon:'trending-up', bg:'#DBEAFE', fg:'#1E40AF' }
  ].map(function(k){
    return '<div class="kpi">' +
      '<div class="kpi-icon" style="background:'+k.bg+';color:'+k.fg+';"><i data-lucide="'+k.icon+'" class="w-5 h-5"></i></div>' +
      '<div class="kpi-label">'+k.label+'</div>' +
      '<div class="kpi-value">'+k.valor+'</div>' +
    '</div>';
  }).join('');

  var barra = STATUS_ORDER.map(function(st){
    var n = cont[st]||0; var pct = total ? Math.round(n*100/total) : 0;
    var m = STATUS_META[st] || {};
    return '<div style="margin-bottom:12px;">' +
      '<div class="flex justify-between" style="font-size:13px;color:var(--gray-700);margin-bottom:4px;"><span>'+esc(labelStatus(st))+'</span><span>'+n+' ('+pct+'%)</span></div>' +
      '<div style="height:10px;background:var(--gray-100);border-radius:999px;overflow:hidden;"><div style="height:100%;width:'+pct+'%;background:'+(m.fg||'#6366F1')+';"></div></div>' +
    '</div>';
  }).join('');

  prod.innerHTML =
    '<div class="grid grid-cols-4 gap-4 mb-6">'+kpiCards+'</div>' +
    '<div class="card"><div class="card-body" style="padding:20px;">' +
      '<strong style="display:block;margin-bottom:16px;color:var(--gray-900);">Ordens por etapa</strong>' + barra +
    '</div></div>';
  lucide.createIcons();
}

// ---- Ações ----
function moverOS(id, novoStatus, btn){
  if (btn){ btn.disabled = true; btn.style.opacity = '.6'; }
  fetch(apiUrl('/api/os/'+encodeURIComponent(id)+'/status'), {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: novoStatus })
  })
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(){ carregarFila(); })
  .catch(function(err){
    if (btn){ btn.disabled = false; btn.style.opacity = ''; }
    alert('Não foi possível mover a ordem de serviço (' + (err && err.message || 'erro') + ').');
  });
}

// ---- Boot ----
carregarOpcoes().then(carregarFila);
</script>

</body>
</html>
