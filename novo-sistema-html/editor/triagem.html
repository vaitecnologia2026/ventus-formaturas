<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triagem de fotos — Ventus</title>
<script src="/assets/js/config.js"></script>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,Inter,sans-serif;background:#F1F5F9;color:#0F172A;margin:0;}
  header{background:#0F172A;color:#fff;padding:16px 22px;display:flex;align-items:center;gap:12px;}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px;}
  .bar{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:14px;display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:16px;}
  input{font-size:13px;padding:8px 11px;border:1px solid #CBD5E1;border-radius:9px;}
  .btn{font-size:13px;font-weight:600;padding:8px 13px;border-radius:9px;border:1px solid #E2E8F0;background:#fff;cursor:pointer;text-decoration:none;color:#0F172A;display:inline-flex;align-items:center;gap:6px;}
  .btn-azul{background:#2563EB;color:#fff;border-color:#2563EB;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .tile{background:#fff;border:1px solid #E2E8F0;border-radius:11px;overflow:hidden;position:relative;}
  .tile img{width:100%;height:150px;object-fit:cover;display:block;background:#E2E8F0;}
  .tile .x{position:absolute;top:6px;right:6px;background:rgba(220,38,38,.92);color:#fff;border:none;border-radius:8px;width:30px;height:30px;font-size:16px;cursor:pointer;}
  .tile .meta{font-size:11px;color:#64748B;padding:5px 8px;display:flex;justify-content:space-between;}
</style>
</head>
<body>
<header>
  <a href="subgalerias.html" style="color:rgba(255,255,255,.7);text-decoration:none;">←</a>
  <div style="flex:1;"><div style="font-weight:800;font-size:17px;">Triagem de fotos</div>
  <div style="font-size:12px;opacity:.65;">Remova as fotos ruins antes de publicar</div></div>
</header>
<div class="wrap">
  <div class="bar">
    <div><label style="font-size:11px;font-weight:700;color:#64748B;display:block;margin-bottom:3px;">Álbum / evento (slug)</label>
      <input id="alb" placeholder="ex.: administracao-teste-2-bruno-sena" style="width:320px;"></div>
    <button class="btn btn-azul" onclick="carregar()">Carregar fotos</button>
    <div style="flex:1;"></div>
    <span id="info" style="font-size:12px;color:#64748B;"></span>
  </div>
  <div id="grid" class="grid"></div>
  <p id="vazio" style="display:none;text-align:center;color:#94A3B8;padding:40px;">Informe o álbum e clique em Carregar.</p>
</div>
<script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let ALB='';
// pré-preenche pelo ?alb=
const pa=new URLSearchParams(location.search).get('alb'); if(pa){ document.getElementById('alb').value=pa; }

async function carregar(){
  ALB=document.getElementById('alb').value.trim();
  if(!ALB){ return; }
  const g=document.getElementById('grid'); const info=document.getElementById('info');
  g.innerHTML=''; info.textContent='Carregando…';
  let d;
  try{ d=await (await fetch(apiUrl('/api/albuns/'+encodeURIComponent(ALB)))).json(); }
  catch(e){ info.textContent='Álbum não encontrado.'; return; }
  const fotos=d.fotos||[];
  document.getElementById('vazio').style.display=fotos.length?'none':'block';
  info.textContent=fotos.length+' foto(s) · '+esc(d.nome||ALB);
  g.innerHTML=fotos.map(f=>`
    <div class="tile" id="t-${esc(f.arquivo)}">
      <button class="x" title="Excluir foto ruim" onclick="excluir('${esc(f.arquivo)}')">×</button>
      <img loading="lazy" src="${apiUrl(f.url)}" alt="${esc(f.arquivo)}">
      <div class="meta"><span>${esc(f.arquivo)}</span><span>${f.rostos||0}👤</span></div>
    </div>`).join('');
}
async function excluir(arq){
  if(!confirm('Remover esta foto da galeria? (não dá pra desfazer)')) return;
  const r=await fetch(apiUrl('/api/albuns/'+encodeURIComponent(ALB)+'/fotos/'+encodeURIComponent(arq)+'/excluir'),{method:'POST'});
  if(r.ok){ const el=document.getElementById('t-'+arq); if(el) el.remove(); }
  else { alert('Falha ao excluir.'); }
}
if(pa) carregar();
</script>
</body>
</html>
