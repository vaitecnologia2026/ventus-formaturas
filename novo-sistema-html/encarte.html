<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/assets/img/icon.png">
<meta name="theme-color" content="#0A2540">
<title>Meu Encarte — Ventus</title>
<script src="/assets/js/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --azul:#2563EB; --azul-esc:#1E3A8A; --ink:#0F172A; --cinza:#64748B; --linha:#E2E8F0; --bg:#F1F5F9; }
  *{box-sizing:border-box;} body{margin:0;font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--ink);}
  .top{background:linear-gradient(135deg,var(--azul-esc),var(--azul));color:#fff;padding:26px 20px;text-align:center;}
  .top img{height:30px;display:block;margin:0 auto 10px;}
  .top .marca{font-size:13px;opacity:.85;}
  .wrap{max-width:560px;margin:-30px auto 40px;padding:0 16px;}
  .card{background:#fff;border:1px solid var(--linha);border-radius:20px;box-shadow:0 12px 40px -18px rgba(15,23,42,.25);padding:28px 26px;}
  h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px;}
  .sub{color:var(--cinza);font-size:14px;margin:0 0 22px;}
  label{display:block;font-size:13px;font-weight:600;color:#334155;margin:0 0 6px;}
  .fld{margin-bottom:16px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;} @media(max-width:440px){.grid2{grid-template-columns:1fr;}}
  input,textarea,select{width:100%;padding:12px 14px;border:1px solid var(--linha);border-radius:12px;font-size:15px;font-family:inherit;outline:none;transition:.15s;background:#fff;color:var(--ink);}
  input:focus,textarea:focus,select:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
  textarea{min-height:96px;resize:vertical;}
  .btn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--azul);color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:.15s;margin-top:6px;}
  .btn:hover{background:var(--azul-esc);}
  .btn:disabled{opacity:.6;cursor:default;}
  .btn-ghost{width:auto;padding:9px 14px;font-size:13px;font-weight:600;margin:0;background:#EFF6FF;color:var(--azul);border:1px solid #BFDBFE;border-radius:10px;display:inline-flex;align-items:center;gap:7px;}
  .btn-ghost:hover{background:#DBEAFE;}
  .btn-ghost:disabled{opacity:.6;cursor:default;}
  .ok{text-align:center;padding:20px 0;}
  .ok .ic{width:72px;height:72px;border-radius:50%;background:#DCFCE7;color:#16A34A;display:grid;place-items:center;margin:0 auto 14px;}
  .ok .ic svg{width:38px;height:38px;}
  .muted{color:var(--cinza);font-size:13px;text-align:center;margin-top:14px;}
  .erro{color:#B91C1C;font-size:13px;font-weight:600;margin:0 0 12px;display:none;}
  .info{background:#F8FAFC;border:1px solid var(--linha);border-radius:14px;padding:16px 18px;margin-bottom:20px;}
  .info .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--linha);}
  .info .row:last-child{border-bottom:none;}
  .info .k{font-size:12px;font-weight:600;color:var(--cinza);text-transform:uppercase;letter-spacing:.03em;}
  .info .v{font-size:14px;font-weight:700;color:var(--ink);text-align:right;}
  .msgrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 6px;flex-wrap:wrap;}
  .spin{width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;display:inline-block;animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="top">
  <img src="/assets/img/logo-branca.png" alt="Ventus Formaturas" onerror="this.style.display='none'">
  <div class="marca">Meu Encarte</div>
</div>
<div class="wrap"><div class="card" id="card"><p class="muted">Carregando…</p></div></div>

<script>
const card = document.getElementById('card');
const esc = s => String(s??'').replace(/"/g,'&quot;');
const escHtml = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const soDigitos = s => String(s??'').replace(/\D/g,'');

// aviso inline elegante (sem alert nativo); usa vtAlert se existir
function aviso(msg){
  if(window.vtAlert){ try{ window.vtAlert(msg); return; }catch(e){} }
  const el = document.getElementById('erro');
  if(el){ el.textContent = msg; el.style.display='block'; }
}
function limparAviso(){ const el=document.getElementById('erro'); if(el) el.style.display='none'; }

const token = new URLSearchParams(location.search).get('t');
if(token) abrirPorToken(token);
else passo1();

// ------------------------------ PASSO 1: TURMA + CPF ------------------------------
async function passo1(){
  card.innerHTML = `
    <h1>Meu Encarte 📸</h1>
    <p class="sub">Selecione sua turma e informe seu CPF para preencher os dados do encarte.</p>
    <p class="erro" id="erro"></p>
    <div class="fld"><label>Turma</label>
      <select id="p1-turma"><option value="">Carregando turmas…</option></select>
    </div>
    <div class="fld"><label>CPF</label>
      <input id="p1-cpf" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" autocomplete="off">
    </div>
    <button class="btn" id="p1-continuar">Continuar</button>`;

  const inCpf = document.getElementById('p1-cpf');
  inCpf.addEventListener('input', () => { inCpf.value = mascaraCpf(inCpf.value); });

  document.getElementById('p1-continuar').onclick = continuar;

  // carrega turmas
  try{
    const r = await fetch(apiUrl('/api/turma-formatura'));
    const d = await r.json();
    const sel = document.getElementById('p1-turma');
    const itens = (d.itens||[]);
    if(!itens.length){ sel.innerHTML = '<option value="">Nenhuma turma disponível</option>'; return; }
    sel.innerHTML = '<option value="">Selecione sua turma…</option>' +
      itens.map(t => `<option value="${t.id}">${escHtml(t.nome)}</option>`).join('');
  }catch(e){
    document.getElementById('p1-turma').innerHTML = '<option value="">Erro ao carregar turmas</option>';
    aviso('Não foi possível carregar as turmas. Tente recarregar a página.');
  }
}

function mascaraCpf(v){
  v = soDigitos(v).slice(0,11);
  if(v.length>9) return v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
  if(v.length>6) return v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
  if(v.length>3) return v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
  return v;
}

async function continuar(){
  limparAviso();
  const turmaId = document.getElementById('p1-turma').value;
  const cpf = soDigitos(document.getElementById('p1-cpf').value);
  if(!turmaId){ aviso('Selecione sua turma.'); return; }
  if(cpf.length !== 11){ aviso('Digite um CPF válido (11 dígitos).'); return; }

  const btn = document.getElementById('p1-continuar');
  btn.textContent = 'Buscando…'; btn.disabled = true;
  try{
    const r = await fetch(apiUrl('/api/encarte/por-cpf?turma_id='+encodeURIComponent(turmaId)+'&cpf='+encodeURIComponent(cpf)));
    if(r.status === 404){ aviso('CPF não encontrado nesta turma. Confira os dados ou fale com a comissão.'); return; }
    if(!r.ok){ aviso('Não foi possível buscar seus dados. Tente novamente.'); return; }
    const d = await r.json();
    passo2(d);
  }catch(e){
    aviso('Erro de conexão. Tente novamente.');
  }finally{
    btn.textContent = 'Continuar'; btn.disabled = false;
  }
}

// abre direto no passo 2 quando vem ?t=token (link antigo)
async function abrirPorToken(tk){
  try{
    const r = await fetch(apiUrl('/api/encarte/'+tk));
    if(!r.ok){ card.innerHTML='<h1>Link inválido</h1><p class="sub">Este link não é válido. Peça um novo à comissão ou entre pela turma + CPF.</p>'; return; }
    const d = await r.json();
    d.token = d.token || tk;
    passo2(d);
  }catch(e){
    card.innerHTML='<h1>Erro</h1><p class="sub">Não foi possível carregar. Tente recarregar a página.</p>';
  }
}

// ------------------------------ PASSO 2: DADOS DO ENCARTE ------------------------------
function passo2(d){
  const a = d.aluno || {};
  const tk = d.token;
  const primeiro = (a.nome||'').split(' ')[0];
  card.innerHTML = `
    <h1>Olá, ${escHtml(primeiro)}! 📸</h1>
    <p class="sub">Confira seus dados e preencha as informações do seu encarte.</p>
    <p class="erro" id="erro"></p>
    <div class="info">
      <div class="row"><span class="k">Aluno</span><span class="v">${escHtml(a.nome)||'—'}</span></div>
      <div class="row"><span class="k">Faculdade</span><span class="v">${escHtml(d.turma?.instituicao)||'—'}</span></div>
      <div class="row"><span class="k">Turma</span><span class="v">${escHtml(d.turma?.nome)||'—'}</span></div>
    </div>
    ${a.data_encarte?`<p class="muted" style="margin-top:-8px;margin-bottom:16px;">Encarte já preenchido em ${a.data_encarte.split('-').reverse().join('/')}. Você pode atualizar abaixo.</p>`:''}
    <div class="fld"><label>Foto escolhida</label><input id="e-nomefot" value="${esc(a.nome_fotografia)}" placeholder="Nº ou nome da foto escolhida p/ o encarte"></div>
    <div class="grid2">
      <div class="fld"><label>Nome da mãe</label><input id="e-mae" value="${esc(a.nome_mae)}"></div>
      <div class="fld"><label>Nome do pai</label><input id="e-pai" value="${esc(a.nome_pai)}"></div>
    </div>
    <div class="fld">
      <div class="msgrow">
        <label style="margin:0;">Mensagem / dedicatória</label>
        <button type="button" class="btn-ghost" id="e-ia">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
          Melhorar texto com IA
        </button>
      </div>
      <textarea id="e-msg" maxlength="2000" placeholder="Uma mensagem que vai no seu encarte…">${escHtml(a.mensagem)}</textarea>
      <div id="e-msg-c" style="font-size:12px;color:#94a3b8;text-align:right;margin-top:4px;">${(a.mensagem||'').length}/2000</div>
    </div>
    <button class="btn" id="e-salvar">Salvar informação</button>
    ${token?'':'<button class="btn" id="e-voltar" style="background:#EFF6FF;color:#2563EB;margin-top:8px;">Voltar</button>'}
    <p class="muted">Você pode voltar e editar quando quiser.</p>`;

  const ta = document.getElementById('e-msg');
  const cont = document.getElementById('e-msg-c');
  ta.addEventListener('input', () => { cont.textContent = ta.value.length + '/2000'; });

  document.getElementById('e-ia').onclick = melhorarComIA;
  document.getElementById('e-salvar').onclick = () => salvar(tk);
  const volt = document.getElementById('e-voltar');
  if(volt) volt.onclick = passo1;
}

async function melhorarComIA(){
  limparAviso();
  const ta = document.getElementById('e-msg');
  const cont = document.getElementById('e-msg-c');
  const btn = document.getElementById('e-ia');
  const texto = ta.value.trim();
  if(!texto){ aviso('Escreva uma mensagem antes de melhorar com IA.'); return; }
  const original = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Melhorando…';
  try{
    const r = await fetch(apiUrl('/api/encarte/corrigir'),{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({texto})
    });
    if(!r.ok) throw new Error('falha');
    const d = await r.json();
    if(d.texto_corrigido){
      ta.value = d.texto_corrigido;
      cont.textContent = ta.value.length + '/2000';
    }
  }catch(e){
    aviso('Não foi possível melhorar o texto agora. Tente de novo.');
  }finally{
    btn.disabled = false; btn.innerHTML = original;
  }
}

async function salvar(tk){
  limparAviso();
  const body = {
    nome_fotografia: document.getElementById('e-nomefot').value,
    nome_mae: document.getElementById('e-mae').value,
    nome_pai: document.getElementById('e-pai').value,
    mensagem: document.getElementById('e-msg').value.slice(0,2000),
  };
  const btn = document.getElementById('e-salvar');
  btn.textContent='Salvando…'; btn.disabled=true;
  try{
    const r = await fetch(apiUrl('/api/encarte/'+tk),{
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
    });
    if(!r.ok) throw new Error('falha');
    sucesso();
  }catch(e){
    aviso('Erro ao salvar. Tente de novo.');
    btn.textContent='Salvar informação'; btn.disabled=false;
  }
}

function sucesso(){
  card.innerHTML = `<div class="ok">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h1>Encarte salvo!</h1>
    <p class="sub">Prontinho. A Ventus já recebeu os dados do seu encarte.</p>
  </div>`;
}
</script>
</body>
</html>
