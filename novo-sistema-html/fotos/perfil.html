<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/png" href="/assets/img/icon.png">
<link rel="apple-touch-icon" href="/assets/img/icon-app.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A2540">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minhas fotos — Ventus Fotos</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../assets/js/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="fotos.css">
</head>
<body style="background:var(--gray-50);">

<header class="ft-nav">
  <a href="index.html" class="ft-logo"><img class="ft-logo-img" src="/assets/img/logo.png" alt="Ventus Formaturas"></a>
  <nav class="ft-nav-links"><a href="index.html">Álbuns</a><a href="selfie.html">Buscar por selfie</a></nav>
  <div class="ft-nav-actions">
    <a href="resultados.html" class="ft-cart" title="Carrinho"><i data-lucide="shopping-cart"></i><span class="ft-cart-badge" data-cart-count hidden>0</span></a>
    <button class="ft-btn ft-btn-ghost" id="btn-sair"><i data-lucide="log-out"></i> Sair</button>
  </div>
</header>

<div class="vt-page">
  <div class="vt-turma-hero">
    <div style="display:flex;align-items:center;gap:16px;">
      <div class="ft-selfie-thumb-fallback" style="width:56px;height:56px;"><i data-lucide="user-round"></i></div>
      <div>
        <h1 style="margin:0;font-size:24px;" id="ola">Olá</h1>
        <p style="margin:2px 0 0;color:var(--gray-500);font-size:14px;" id="sub">suas fotos compradas</p>
      </div>
    </div>
    <a href="index.html" class="ft-btn ft-btn-secondary"><i data-lucide="search"></i> Encontrar mais fotos</a>
  </div>

  <div id="conteudo"><p class="vt-empty"><span class="ft-spinner ft-spinner-lg"></span></p></div>

  <!-- Excluir conta (exigência da App Store) -->
  <div id="conta-danger" style="margin-top:28px;border:1px solid #FCA5A5;background:#FEF2F2;border-radius:16px;padding:18px 20px;">
    <h2 style="margin:0 0 4px;font-size:16px;color:#991B1B;display:flex;align-items:center;gap:7px;"><i data-lucide="alert-triangle" style="width:17px;height:17px;"></i> Excluir minha conta</h2>
    <p style="margin:0 0 12px;color:#7F1D1D;font-size:13.5px;line-height:1.5;">Remove permanentemente sua conta e seus dados pessoais deste aplicativo. Esta ação não pode ser desfeita.</p>
    <button class="ft-btn" id="btn-excluir-conta" style="background:#DC2626;color:#fff;"><i data-lucide="trash-2"></i> Excluir minha conta</button>
    <div id="excluir-confirm" hidden style="margin-top:14px;padding:14px;border-radius:12px;background:#fff;border:1px solid #FCA5A5;">
      <p style="margin:0 0 12px;color:#111;font-size:14px;font-weight:600;">Tem certeza? Sua conta e seus dados serão apagados permanentemente.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="ft-btn" id="btn-excluir-sim" style="background:#DC2626;color:#fff;">Sim, excluir minha conta</button>
        <button class="ft-btn ft-btn-secondary" id="btn-excluir-nao">Cancelar</button>
      </div>
    </div>
  </div>
</div>

<script src="app-cliente.js"></script>
<script>
lucide.createIcons();

if (!Ventus.Auth.logado()) location.href = 'login.html?next=perfil.html';
document.getElementById('btn-sair').addEventListener('click', () => { Ventus.Auth.sair(); location.href = 'index.html'; });

const u = Ventus.Auth.user() || {};
document.getElementById('ola').textContent = 'Olá, ' + (u.nome || '').split(' ')[0];

fetch(apiUrl('/api/minhas-compras'), { headers: Ventus.Auth.headers() })
  .then(r => r.ok ? r.json() : Promise.reject(r))
  .then(({ fotos }) => {
    const box = document.getElementById('conteudo');
    if (!fotos.length) {
      box.innerHTML = `<div class="vt-empty">
        <i data-lucide="image-off" style="width:40px;height:40px;color:var(--gray-300);"></i>
        <p style="margin-top:12px;">Você ainda não comprou nenhuma foto.</p>
        <a href="index.html" class="ft-btn ft-btn-primary" style="margin-top:8px;"><i data-lucide="search"></i> Procurar minhas fotos</a>
      </div>`;
      lucide.createIcons(); return;
    }
    document.getElementById('sub').textContent = `${fotos.length} foto(s) compradas`;
    box.innerHTML = '<div class="ft-photo-grid">' + fotos.map(f => `
      <div class="ft-photo">
        <div class="ft-photo-img real"><img src="${apiUrl(f.url)}" alt="${f.arquivo}" loading="lazy"><span class="ft-match" style="background:var(--success);">comprada</span></div>
        <div class="ft-photo-bar">
          <div><strong>${f.album_nome}</strong><span>${f.arquivo}</span></div>
          <a class="ft-photo-add" href="${apiUrl('/api/minha-foto?foto=' + encodeURIComponent(f.foto_id))}" data-baixar><i data-lucide="download"></i></a>
        </div>
      </div>`).join('') + '</div>';
    lucide.createIcons();
  })
  .catch(() => { location.href = 'login.html?next=perfil.html'; });

// Excluir minha conta — confirmação em 2 passos + DELETE autenticado (App Store 5.1.1(v))
const _delBtn = document.getElementById('btn-excluir-conta');
const _delBox = document.getElementById('excluir-confirm');
_delBtn.addEventListener('click', () => { _delBox.hidden = false; _delBtn.hidden = true; });
document.getElementById('btn-excluir-nao').addEventListener('click', () => { _delBox.hidden = true; _delBtn.hidden = false; });
document.getElementById('btn-excluir-sim').addEventListener('click', async (e) => {
  const b = e.currentTarget; b.disabled = true; b.textContent = 'Excluindo…';
  try {
    const r = await fetch(apiUrl('/api/eu'), { method: 'DELETE', headers: Ventus.Auth.headers() });
    if (!r.ok) throw new Error();
    Ventus.Auth.sair();
    alert('Sua conta foi excluída.');
    location.href = 'index.html';
  } catch (_) {
    b.disabled = false; b.textContent = 'Sim, excluir minha conta';
    alert('Não foi possível excluir a conta agora. Tente novamente.');
  }
});

// download autenticado (fetch com Bearer -> blob), já que <a href> não manda header
document.getElementById('conteudo').addEventListener('click', async (e) => {
  const a = e.target.closest('[data-baixar]');
  if (!a) return;
  e.preventDefault();
  const r = await fetch(a.getAttribute('href'), { headers: Ventus.Auth.headers() });
  if (!r.ok) { alert('Não foi possível baixar.'); return; }
  const blob = await r.blob();
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = (r.headers.get('Content-Disposition') || '').match(/filename="?([^"]+)"?/)?.[1] || 'foto.jpg';
  link.click(); URL.revokeObjectURL(url);
});
</script>
</body>
</html>
