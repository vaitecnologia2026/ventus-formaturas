<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/png" href="/assets/img/icon.png">
<link rel="apple-touch-icon" href="/assets/img/icon-app.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A2540">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento — Ventus</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body style="background: var(--gray-100); padding-bottom:80px;">

<div class="phone-frame">
  <div class="mobile-header">
    <a href="inicio.html" style="color:white;text-decoration:none;"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
    <strong style="font-size:16px;">Pagamento</strong>
    <i data-lucide="more-vertical" class="w-5 h-5"></i>
  </div>

  <!-- Saldo -->
  <div style="background:linear-gradient(135deg,#1E3A8A,#2563EB);color:white;padding:24px 20px;">
    <div style="font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:.06em;" id="sal-titulo">Meu plano</div>
    <div style="font-size:28px;font-weight:800;margin-top:6px;letter-spacing:-0.02em;" id="sal-total">R$ —</div>
    <div style="font-size:13px;opacity:.85;margin-top:2px;" id="sal-sub">—</div>
    <div style="height:6px;background:rgba(255,255,255,.2);border-radius:3px;margin-top:14px;overflow:hidden;">
      <div id="sal-bar" style="width:0%;height:100%;background:white;"></div>
    </div>
    <div class="flex justify-between mt-2" style="font-size:11px;opacity:.85;"><span id="sal-pago">Pago: R$ —</span><span id="sal-restam">Restam: R$ —</span></div>
  </div>

  <!-- Estado (erro / carregando) -->
  <div id="estado-msg" style="display:none;padding:24px 20px 0;">
    <div style="background:white;border:1px solid var(--gray-200);border-radius:14px;padding:20px;text-align:center;">
      <div style="width:44px;height:44px;border-radius:12px;background:#FEF3C7;color:#92400E;display:grid;place-items:center;margin:0 auto 12px;"><i data-lucide="info"></i></div>
      <strong style="display:block;color:var(--gray-900);margin-bottom:4px;" id="estado-titulo">Não foi possível carregar</strong>
      <div style="font-size:13px;color:var(--gray-600);" id="estado-texto">Acesse pelo seu link ou pela página de login.</div>
    </div>
  </div>

  <!-- Lista de parcelas -->
  <div id="bloco-parcelas" style="padding:24px 20px 0;display:none;">
    <strong style="font-size:16px;color:var(--gray-900);display:block;margin-bottom:12px;">Todas as parcelas</strong>

    <div id="lista-parcelas" style="background:white;border-radius:14px;border:1px solid var(--gray-200);overflow:hidden;"></div>

    <div style="margin-top:20px;padding:14px;background:#DBEAFE;border-radius:12px;font-size:13px;color:#1E40AF;display:flex;gap:10px;">
      <i data-lucide="info" class="w-4 h-4" style="flex-shrink:0;margin-top:2px;"></i>
      <div><strong>Quitar antecipado?</strong> Solicite desconto à comissão e gere uma nova cobrança consolidada.</div>
    </div>
  </div>
</div>

<!-- Modal Pix -->
<div id="pix-modal" style="display:none;position:fixed;inset:0;background:rgba(15,37,64,.55);z-index:50;align-items:flex-end;justify-content:center;">
  <div style="background:white;width:100%;max-width:460px;border-radius:20px 20px 0 0;padding:24px 20px 28px;">
    <div class="flex justify-between items-center mb-3">
      <strong style="font-size:16px;color:var(--gray-900);">Pagar com Pix</strong>
      <button onclick="fecharPix()" style="background:none;border:none;cursor:pointer;color:var(--gray-500);"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div id="pix-qr" style="text-align:center;margin-bottom:14px;"></div>
    <div style="font-size:12px;color:var(--gray-500);margin-bottom:6px;">Pix copia e cola</div>
    <textarea id="pix-code" readonly style="width:100%;height:74px;font-size:12px;border:1px solid var(--gray-300);border-radius:10px;padding:10px;font-family:monospace;color:var(--gray-700);"></textarea>
    <button onclick="copiarPix()" style="width:100%;margin-top:10px;background:var(--primary-600);color:white;border:none;padding:14px;border-radius:12px;font-weight:600;cursor:pointer;">Copiar código</button>
  </div>
</div>

<nav class="bottom-nav">
  <a href="inicio.html" class="bottom-nav-item"><i data-lucide="home"></i>Início</a>
  <a href="galeria.html" class="bottom-nav-item"><i data-lucide="image"></i>Fotos</a>
  <a href="pagamento.html" class="bottom-nav-item active"><i data-lucide="credit-card"></i>Pagar</a>
  <a href="convidados.html" class="bottom-nav-item"><i data-lucide="users"></i>Convidados</a>
  <a href="#" class="bottom-nav-item"><i data-lucide="user"></i>Perfil</a>
</nav>

<script src="../assets/js/config.js"></script>
<script src="espaco.js"></script>
<script>
lucide.createIcons();

const $ = s => document.querySelector(s);
const brl = v => 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const dtBR = s => { if(!s) return null; const d=String(s).split('T')[0].split('-'); return d.length===3 ? `${d[2]}/${d[1]}/${d[0]}` : s; };

let ALUNO_ID = null;

function mostrarEstado(titulo, texto){
  if(titulo) $('#estado-titulo').textContent = titulo;
  if(texto) $('#estado-texto').textContent = texto;
  $('#estado-msg').style.display = 'block';
  lucide.createIcons();
}

(async function init(){
  const token = (typeof getTokenAluno === 'function') ? getTokenAluno() : '';
  if(!token){ location.href = 'login.html'; return; }

  let d;
  try{ d = await carregarEspaco(); }catch(e){ d = null; }
  if(!d){ location.href = 'login.html'; return; }

  ALUNO_ID = (d.aluno && d.aluno.id) || null;
  const plano = d.plano || {};
  const bol = d.boletos || {};
  const parcelas = Array.isArray(bol.parcelas) ? bol.parcelas : [];

  const total = Number(bol.total||0);
  const pago  = Number(bol.pago||0);
  const restante = (bol.pendente!=null) ? Number(bol.pendente) : Math.max(0, total - pago);
  const pct = total>0 ? Math.min(100, Math.round(pago/total*100)) : 0;
  const pagas = parcelas.filter(p => p.pago === true || p.pago === 1).length;

  // ---- Saldo (hero) ----
  $('#sal-titulo').textContent = plano.nome ? plano.nome : 'Meu plano';
  $('#sal-total').textContent = brl(total);
  $('#sal-sub').textContent = parcelas.length ? (parcelas.length + ' parcela(s)') : 'Sem parcelas cadastradas';
  $('#sal-bar').style.width = pct + '%';
  $('#sal-pago').textContent = `Pago: ${brl(pago)} (${pagas} parcela${pagas===1?'':'s'})`;
  $('#sal-restam').textContent = `Restam: ${brl(restante)}`;

  renderParcelas(parcelas);
  $('#bloco-parcelas').style.display = 'block';
  lucide.createIcons();
})();

function renderParcelas(parcelas){
  const box = $('#lista-parcelas');
  if(!parcelas.length){
    box.innerHTML = '<div style="padding:20px;text-align:center;font-size:13px;color:var(--gray-500);">Nenhuma parcela cadastrada.</div>';
    return;
  }
  box.innerHTML = parcelas.map((p, i) => {
    const pago = (p.pago === true || p.pago === 1);
    const last = i === parcelas.length - 1;
    const borda = last ? '' : 'border-bottom:1px solid var(--gray-100);';
    const desc = p.descricao || ('Parcela ' + String(i+1).padStart(2,'0'));
    if(pago){
      const info = 'Pago' + (p.pago_em ? ' em ' + (dtBR(p.pago_em) || p.pago_em) : '') + (p.forma ? ' · ' + p.forma : '');
      return `<div class="flex justify-between items-center" style="padding:14px 16px;${borda}">
        <div>
          <div style="font-size:14px;font-weight:600;">${desc}</div>
          <div style="font-size:12px;color:var(--gray-500);">${info}</div>
        </div>
        <div class="text-right">
          <div style="font-size:14px;font-weight:600;">${brl(p.valor)}</div>
          <span class="badge badge-success" style="font-size:10px;">Paga</span>
        </div>
      </div>`;
    }
    const venc = dtBR(p.vencimento);
    return `<div style="padding:14px 16px;${borda}background:#FEF3C7;">
      <div class="flex justify-between items-center">
        <div>
          <div style="font-size:14px;font-weight:600;">${desc}</div>
          <div style="font-size:12px;color:#92400E;">${venc ? 'Vence em ' + venc : 'Em aberto'}</div>
        </div>
        <div class="text-right">
          <div style="font-size:14px;font-weight:600;">${brl(p.valor)}</div>
          <span class="badge badge-warning" style="font-size:10px;">Aberta</span>
        </div>
      </div>
      <button data-parcela="${p.id}" data-valor="${p.valor}" onclick="pagar(this)" style="width:100%;margin-top:10px;background:var(--primary-600);color:white;border:none;padding:12px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;">Pagar com boleto</button>
    </div>`;
  }).join('');
}

async function pagar(btn){
  if(!ALUNO_ID){ alert('Sessão inválida. Entre novamente.'); return; }
  const parcelaId = btn.getAttribute('data-parcela');
  const valor = Number(btn.getAttribute('data-valor')||0);
  if(valor < 5){
    alert('Pagamento online mínimo de R$ 5,00. Fale com a comissão para esta parcela.');
    return;
  }
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Gerando cobrança…';
  try{
    const r = await fetch(apiUrl('/api/pagamento'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ aluno_id: Number(ALUNO_ID), aluno_pagamento_id: Number(parcelaId), metodo: 'boleto' })
    });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    if(data && data.url){
      window.open(data.url, '_blank');
    } else if(data && (data.pix_copia_cola || data.pix_qr_base64)){
      abrirPix(data);
    } else {
      alert('Não foi possível gerar a cobrança. Tente novamente.');
    }
  }catch(e){
    alert('Erro ao gerar a cobrança. Verifique sua conexão e tente novamente.');
  }finally{
    btn.disabled = false;
    btn.textContent = original;
  }
}

function abrirPix(data){
  const qr = $('#pix-qr');
  qr.innerHTML = data.pix_qr_base64
    ? `<img src="${/^data:/.test(data.pix_qr_base64) ? data.pix_qr_base64 : 'data:image/png;base64,'+data.pix_qr_base64}" alt="QR Pix" style="width:200px;height:200px;">`
    : '';
  $('#pix-code').value = data.pix_copia_cola || '';
  const m = $('#pix-modal');
  m.style.display = 'flex';
  lucide.createIcons();
}
function fecharPix(){ $('#pix-modal').style.display = 'none'; }
function copiarPix(){
  const el = $('#pix-code');
  el.select();
  try{ navigator.clipboard.writeText(el.value); }catch(e){ document.execCommand('copy'); }
}
</script>

</body>
</html>
