<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/png" href="/assets/img/icon.png">
<link rel="apple-touch-icon" href="/assets/img/icon-app.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A2540">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contrato — Ventus</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body style="background: var(--gray-100); padding-bottom:80px;">

<div class="phone-frame">
  <div class="mobile-header">
    <a href="inicio.html" style="color:white;text-decoration:none;"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
    <strong style="font-size:16px;">Contrato</strong>
    <i data-lucide="download" class="w-5 h-5"></i>
  </div>

  <div style="padding:20px 16px;">
    <!-- Estado (erro / carregando) -->
    <div id="estado-msg" style="display:none;">
      <div style="background:white;border:1px solid var(--gray-200);border-radius:14px;padding:20px;text-align:center;">
        <div style="width:44px;height:44px;border-radius:12px;background:#FEF3C7;color:#92400E;display:grid;place-items:center;margin:0 auto 12px;"><i data-lucide="info"></i></div>
        <strong style="display:block;color:var(--gray-900);margin-bottom:4px;" id="estado-titulo">Não foi possível carregar</strong>
        <div style="font-size:13px;color:var(--gray-600);" id="estado-texto">Acesse pelo seu link ou pela página de login.</div>
      </div>
    </div>

    <div id="card-contrato" style="background:white;border-radius:16px;padding:20px;border:1px solid var(--gray-200);display:none;">
      <div class="flex justify-between items-start">
        <div>
          <span class="badge" id="ct-badge">—</span>
          <h2 style="font-size:20px;font-weight:700;margin-top:8px;letter-spacing:-0.01em;" id="ct-titulo">Contrato</h2>
          <p style="font-size:13px;color:var(--gray-500);margin-top:2px;" id="ct-sub">—</p>
        </div>
        <i data-lucide="file-text" class="w-8 h-8" id="ct-icon" style="color:var(--gray-400);"></i>
      </div>
      <div class="divider"></div>
      <div style="font-size:13px;color:var(--gray-600);line-height:1.6;" id="ct-detalhe">—</div>

      <div class="flex gap-2 mt-4" id="ct-acoes"></div>
    </div>

    <strong id="incluso-titulo" style="font-size:14px;color:var(--gray-700);text-transform:uppercase;letter-spacing:.06em;display:none;margin-top:24px;">O que está incluso</strong>

    <div id="card-incluso" style="background:white;border-radius:14px;border:1px solid var(--gray-200);margin-top:10px;padding:16px;display:none;"></div>

    <div style="margin-top:24px;background:#FEF3C7;border-radius:12px;padding:14px;font-size:13px;color:#92400E;">
      <strong>Trocar de pacote?</strong> Possível em até 30 dias após adesão. Diferença é parcelada nas próximas mensalidades.
      <a href="pacotes.html" style="color:var(--primary-700);font-weight:600;text-decoration:none;display:block;margin-top:8px;">Ver opções →</a>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="inicio.html" class="bottom-nav-item active"><i data-lucide="home"></i>Início</a>
  <a href="galeria.html" class="bottom-nav-item"><i data-lucide="image"></i>Fotos</a>
  <a href="pagamento.html" class="bottom-nav-item"><i data-lucide="credit-card"></i>Pagar</a>
  <a href="convidados.html" class="bottom-nav-item"><i data-lucide="users"></i>Convidados</a>
  <a href="#" class="bottom-nav-item"><i data-lucide="user"></i>Perfil</a>
</nav>

<script src="../assets/js/config.js"></script>
<script src="espaco.js"></script>
<script>
lucide.createIcons();

const $ = s => document.querySelector(s);
const dtBR = s => { if(!s) return null; const d=String(s).split('T')[0].split('-'); return d.length===3 ? `${d[2]}/${d[1]}/${d[0]}` : s; };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function mostrarEstado(titulo, texto){
  if(titulo) $('#estado-titulo').textContent = titulo;
  if(texto) $('#estado-texto').textContent = texto;
  $('#estado-msg').style.display = 'block';
  lucide.createIcons();
}

(async function init(){
  const token = (typeof getTokenAluno === 'function') ? getTokenAluno() : '';
  if(!token){ location.href = 'login.html'; return; }

  let d;
  try{ d = await carregarEspaco(); }catch(e){ d = null; }
  if(!d){ location.href = 'login.html'; return; }

  const plano = d.plano || {};
  const turma = d.turma || {};
  const ct = d.contrato || {};
  const assin = ct.assinatura || null;

  const subTexto = [plano.nome, turma.nome].filter(Boolean).join(' · ') || 'Contrato do formando';
  $('#ct-sub').textContent = subTexto;
  $('#ct-titulo').textContent = plano.nome ? ('Contrato · ' + plano.nome) : 'Contrato';

  const badge = $('#ct-badge');
  const icon = $('#ct-icon');
  const detalhe = $('#ct-detalhe');
  const acoes = $('#ct-acoes');

  const status = assin && assin.status ? String(assin.status).toLowerCase() : '';

  if(assin && status === 'signed'){
    // Assinado (ZapSign)
    badge.className = 'badge badge-success';
    badge.textContent = assin.assinado_em ? ('Assinado em ' + (dtBR(assin.assinado_em) || assin.assinado_em)) : 'Assinado';
    icon.setAttribute('data-lucide','check-circle');
    icon.style.color = 'var(--success)';
    detalhe.innerHTML = '<strong style="color:var(--gray-900);">Status:</strong> Contrato assinado digitalmente.'
      + (assin.assinado_em ? '<br><strong style="color:var(--gray-900);">Data:</strong> ' + (dtBR(assin.assinado_em) || esc(assin.assinado_em)) : '');
    if(assin.signed_file_url){
      acoes.innerHTML = `<a href="${esc(assin.signed_file_url)}" target="_blank" rel="noopener" class="btn btn-secondary" style="flex:1;justify-content:center;font-size:13px;"><i data-lucide="file-text" class="w-4 h-4"></i> Ver PDF</a>`;
    }
  } else if(assin && assin.sign_url){
    // Pendente de assinatura
    badge.className = 'badge badge-warning';
    badge.textContent = 'Assinatura pendente';
    icon.setAttribute('data-lucide','file-signature');
    icon.style.color = '#B45309';
    detalhe.innerHTML = '<strong style="color:var(--gray-900);">Status:</strong> Seu contrato está pronto para assinatura digital.';
    acoes.innerHTML = `<a href="${esc(assin.sign_url)}" target="_blank" rel="noopener" class="btn" style="flex:1;justify-content:center;font-size:13px;background:var(--primary-600);color:white;"><i data-lucide="pen-line" class="w-4 h-4"></i> Assinar contrato</a>`;
  } else if(ct.aceite){
    // Aceite digital simples registrado
    badge.className = 'badge badge-success';
    badge.textContent = ct.aceite_em ? ('Aceite em ' + (dtBR(ct.aceite_em) || ct.aceite_em)) : 'Aceite registrado';
    icon.setAttribute('data-lucide','check-circle');
    icon.style.color = 'var(--success)';
    detalhe.innerHTML = '<strong style="color:var(--gray-900);">Modalidade de assinatura:</strong> Aceite digital registrado.'
      + (ct.aceite_em ? '<br><strong style="color:var(--gray-900);">Data do aceite:</strong> ' + (dtBR(ct.aceite_em) || esc(ct.aceite_em)) : '');
    acoes.innerHTML = '';
  } else {
    // Sem contrato / pendente
    badge.className = 'badge badge-warning';
    badge.textContent = 'Pendente';
    icon.setAttribute('data-lucide','file-text');
    icon.style.color = 'var(--gray-400)';
    detalhe.innerHTML = ct.tem_modelo
      ? '<strong style="color:var(--gray-900);">Status:</strong> Contrato aguardando aceite/assinatura. Fale com a comissão se precisar do link.'
      : '<strong style="color:var(--gray-900);">Status:</strong> Contrato ainda não disponível. A comissão vai liberar em breve.';
    acoes.innerHTML = '';
  }
  $('#card-contrato').style.display = 'block';

  // ---- O que está incluso (eventos do plano) ----
  const eventos = Array.isArray(plano.eventos) ? plano.eventos : [];
  const itens = [];
  eventos.forEach(ev => {
    const nome = ev && ev.nome ? ev.nome : null;
    if(nome) itens.push(nome + (ev.qt_fotos!=null && ev.qt_fotos!=='' ? ' · ' + ev.qt_fotos + ' fotos' : ''));
  });
  if(plano.qt_fotos!=null && plano.qt_fotos!=='') itens.push(plano.qt_fotos + ' fotos inclusas no plano');
  if(plano.valor_foto_excedente!=null && plano.valor_foto_excedente!=='' && Number(plano.valor_foto_excedente)>0){
    itens.push('Foto excedente: R$ ' + Number(plano.valor_foto_excedente).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}));
  }

  if(itens.length){
    $('#card-incluso').innerHTML = itens.map((t,i) => {
      const last = i === itens.length - 1;
      return `<div style="padding:8px 0;${last?'':'border-bottom:1px solid var(--gray-100);'}" class="flex justify-between">
        <span style="font-size:14px;">${esc(t)}</span>
        <i data-lucide="check" class="w-4 h-4" style="color:var(--success);"></i>
      </div>`;
    }).join('');
    $('#incluso-titulo').style.display = 'block';
    $('#card-incluso').style.display = 'block';
  }

  lucide.createIcons();
})();
</script>

</body>
</html>
