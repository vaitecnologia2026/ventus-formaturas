<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/png" href="/assets/img/icon.png">
<link rel="apple-touch-icon" href="/assets/img/icon-app.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A2540">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotos editadas — Ventus</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.tile { background-image: linear-gradient(135deg, #1E3A8A 0%, #7C3AED 100%); }
.tile.t2 { background-image: linear-gradient(135deg, #16A34A, #1E3A8A); }
.tile.t3 { background-image: linear-gradient(135deg, #F59E0B, #DC2626); }
.tile.t4 { background-image: linear-gradient(135deg, #0EA5E9, #1E3A8A); }
.tile.t5 { background-image: linear-gradient(135deg, #EC4899, #7C3AED); }
.tile.t6 { background-image: linear-gradient(135deg, #14B8A6, #1E3A8A); }
</style>
</head>
<body style="background: var(--gray-100); padding-bottom:90px;">

<div class="phone-frame">
  <div class="mobile-header">
    <a href="inicio.html" style="color:white;text-decoration:none;"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
    <strong style="font-size:16px;">Fotos editadas</strong>
    <i data-lucide="download" class="w-5 h-5"></i>
  </div>

  <!-- Banner sucesso -->
  <div style="background:linear-gradient(135deg,#16A34A,#15803D);color:white;padding:20px;text-align:center;">
    <div style="display:inline-flex;width:48px;height:48px;background:rgba(255,255,255,.2);border-radius:50%;align-items:center;justify-content:center;margin-bottom:8px;"><i data-lucide="sparkles" class="w-6 h-6"></i></div>
    <h2 style="font-size:18px;font-weight:700;margin:0;">Suas fotos estão prontas!</h2>
    <p style="font-size:13px;opacity:.85;margin-top:4px;">30 fotos finalizadas pelo nosso editor.</p>
  </div>

  <div style="padding:20px 16px;">
    <div class="flex justify-between items-center mb-3">
      <strong style="font-size:14px;color:var(--gray-700);text-transform:uppercase;letter-spacing:.06em;">FOTO CONVITE INTERNO</strong>
      <span class="badge badge-success">10 fotos</span>
    </div>

    <div class="photo-grid" style="grid-template-columns:repeat(3,1fr);">
      <div class="photo-tile tile" style="cursor:pointer;"></div>
      <div class="photo-tile tile t2" style="cursor:pointer;"></div>
      <div class="photo-tile tile t3" style="cursor:pointer;"></div>
      <div class="photo-tile tile t4" style="cursor:pointer;"></div>
      <div class="photo-tile tile t5" style="cursor:pointer;"></div>
      <div class="photo-tile tile t6" style="cursor:pointer;"></div>
      <div class="photo-tile tile t2" style="cursor:pointer;"></div>
      <div class="photo-tile tile" style="cursor:pointer;"></div>
      <div class="photo-tile tile t3" style="cursor:pointer;"></div>
      <div class="photo-tile tile t5" style="cursor:pointer;"></div>
    </div>

    <div class="flex justify-between items-center mb-3 mt-6">
      <strong style="font-size:14px;color:var(--gray-700);text-transform:uppercase;letter-spacing:.06em;">FOTOS FAMÍLIA</strong>
      <span class="badge badge-success">20 fotos</span>
    </div>

    <div class="photo-grid" style="grid-template-columns:repeat(3,1fr);">
      <div class="photo-tile tile t6" style="cursor:pointer;"></div>
      <div class="photo-tile tile" style="cursor:pointer;"></div>
      <div class="photo-tile tile t2" style="cursor:pointer;"></div>
      <div class="photo-tile tile t3" style="cursor:pointer;"></div>
      <div class="photo-tile tile t4" style="cursor:pointer;"></div>
      <div class="photo-tile tile t5" style="cursor:pointer;"></div>
    </div>

    <div style="margin-top:20px;padding:14px;background:#DBEAFE;border-radius:12px;font-size:13px;color:#1E40AF;display:flex;gap:10px;">
      <i data-lucide="info" class="w-4 h-4" style="flex-shrink:0;margin-top:2px;"></i>
      <div>Quer <strong>1 retoque</strong> em alguma foto? É grátis. Toque na foto e clique em "Pedir retoque".</div>
    </div>
  </div>
</div>

<div style="position:fixed;bottom:0;left:0;right:0;max-width:420px;margin:0 auto;background:white;border-top:1px solid var(--gray-200);padding:12px 16px;display:flex;gap:10px;">
  <button class="btn btn-secondary" style="flex:1;justify-content:center;"><i data-lucide="share-2" class="w-4 h-4"></i> Compartilhar</button>
  <button class="btn btn-primary" style="flex:2;justify-content:center;"><i data-lucide="download" class="w-4 h-4"></i> Baixar tudo (.zip)</button>
</div>

<script>lucide.createIcons();</script>

</body>
</html>
