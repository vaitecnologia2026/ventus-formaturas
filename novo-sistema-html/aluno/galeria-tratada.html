<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minhas fotos tratadas — Ventus</title>
<script src="/assets/js/config.js"></script>
<style>
  :root{--azul:#2563EB;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,Segoe UI,Roboto,Inter,sans-serif;background:#F8FAFC;color:#0F172A;margin:0;}
  .wrap{max-width:720px;margin:0 auto;padding:24px 16px 64px;}
  h1{font-size:22px;margin:0 0 4px;}
  .sub{color:#64748B;font-size:14px;margin:0 0 20px;}
  .card{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:16px;margin-bottom:14px;}
  .ev-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;}
  .ok{background:#DCFCE7;color:#15803D;} .wait{background:#FEF3C7;color:#B45309;}
  .foto{display:flex;align-items:center;gap:10px;border:1px solid #F1F5F9;border-radius:9px;padding:9px 11px;margin-top:6px;font-size:13px;}
  .btn{font-size:13px;font-weight:700;padding:7px 12px;border-radius:9px;background:var(--azul);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .empty{text-align:center;color:#94A3B8;padding:40px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Minhas fotos tratadas 🎨</h1>
  <p class="sub">As fotos finais, já editadas e sem marca d'água, ficam disponíveis aqui quando o editor publica.</p>
  <div id="conteudo"><p class="empty">Carregando…</p></div>
</div>
<script>
const token=new URLSearchParams(location.search).get('t')||new URLSearchParams(location.search).get('token');
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function carregar(){
  const box=document.getElementById('conteudo');
  if(!token){ box.innerHTML='<p class="empty">Link inválido. Peça um novo à comissão.</p>'; return; }
  let d;
  try{ d=await (await fetch(apiUrl('/api/meu-espaco/'+encodeURIComponent(token)+'/tratadas'))).json(); }
  catch(e){ box.innerHTML='<p class="empty">Sem conexão. Tente de novo.</p>'; return; }
  const evs=d.eventos||[];
  if(!evs.length){ box.innerHTML='<p class="empty">Ainda não há fotos tratadas. Você será avisado quando ficarem prontas.</p>'; return; }
  box.innerHTML=evs.map(e=>`
    <div class="card">
      <div class="ev-h">
        <div style="flex:1;font-weight:700;">${esc(e.evento)}</div>
        <span class="badge ${e.disponivel?'ok':'wait'}">${e.disponivel?'Disponível':'Em edição'}</span>
      </div>
      ${e.disponivel
        ? e.fotos.map(f=>`<div class="foto"><span style="flex:1;word-break:break-all;">${esc(f.nome)}</span>
            <a class="btn" href="${f.url}" target="_blank" download>⬇ Baixar</a></div>`).join('')
        : `<p style="color:#94A3B8;font-size:13px;margin:4px 0 0;">${e.qtd} foto(s) em tratamento — aguarde a publicação.</p>`}
    </div>`).join('');
}
carregar();
</script>
</body>
</html>
