<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/png" href="/assets/img/icon.png">
<link rel="apple-touch-icon" href="/assets/img/icon-app.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A2540">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria — Ventus</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.tile { background-image: linear-gradient(135deg, #1E3A8A 0%, #7C3AED 100%); position:relative; }
.tile.t2 { background-image: linear-gradient(135deg, #16A34A, #1E3A8A); }
.tile.t3 { background-image: linear-gradient(135deg, #F59E0B, #DC2626); }
.tile.t4 { background-image: linear-gradient(135deg, #0EA5E9, #1E3A8A); }
.tile.t5 { background-image: linear-gradient(135deg, #EC4899, #7C3AED); }
.tile.t6 { background-image: linear-gradient(135deg, #14B8A6, #1E3A8A); }
</style>
</head>
<body style="background: var(--gray-100); padding-bottom:120px;">

<div class="phone-frame" style="background:transparent;">
  <div class="mobile-header">
    <a href="inicio.html" style="color:white;text-decoration:none;"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
    <strong style="font-size:16px;">Suas fotos</strong>
    <i data-lucide="filter" class="w-5 h-5"></i>
  </div>

  <!-- Banner LGPD -->
  <div style="background:#DBEAFE;padding:14px 20px;font-size:12px;color:#1E3A8A;display:flex;gap:10px;align-items:center;">
    <i data-lucide="scan-face" class="w-4 h-4" style="flex-shrink:0;"></i>
    <span>Estas fotos foram <strong>identificadas pelo seu rosto</strong> via IA. Você consentiu em <a href="#" style="color:inherit;text-decoration:underline;">04/03/2026</a>.</span>
  </div>

  <!-- Tabs por evento -->
  <div style="background:white;padding:0 16px;border-bottom:1px solid var(--gray-200);overflow-x:auto;white-space:nowrap;">
    <div style="display:inline-flex;gap:8px;padding:14px 0;">
      <button style="background:var(--primary-600);color:white;padding:8px 14px;border-radius:999px;border:none;font-size:13px;font-weight:600;">FOTO CONVITE · 14</button>
      <button style="background:var(--gray-100);color:var(--gray-700);padding:8px 14px;border-radius:999px;border:none;font-size:13px;font-weight:500;">FAMÍLIA · 18</button>
      <button style="background:var(--gray-100);color:var(--gray-700);padding:8px 14px;border-radius:999px;border:none;font-size:13px;font-weight:500;">FESTA 100 DIAS · 10</button>
      <button style="background:var(--gray-100);color:var(--gray-500);padding:8px 14px;border-radius:999px;border:none;font-size:13px;font-weight:500;">BAILE · em breve</button>
    </div>
  </div>

  <!-- Counter de seleção -->
  <div style="background:#FEF3C7;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;">
    <div style="font-size:13px;color:#92400E;">Seleção: <strong><span id="selecao-counter">3</span> de 10</strong> fotos</div>
    <a href="galeria-final.html" style="font-size:13px;color:var(--primary-600);font-weight:600;text-decoration:none;">Finalizar →</a>
  </div>

  <!-- Grid de fotos -->
  <div class="photo-grid" style="padding:8px;grid-template-columns:repeat(3,1fr);">
    <div class="photo-tile tile selected" onclick="togglePhoto(this)">
      <div class="photo-tile-overlay"></div>
      <div style="position:absolute;top:6px;right:6px;width:24px;height:24px;background:var(--primary-600);border-radius:50%;display:grid;place-items:center;color:white;font-size:14px;border:2px solid white;">✓</div>
      <div style="position:absolute;bottom:6px;left:8px;color:white;font-size:10px;text-shadow:0 1px 2px rgba(0,0,0,.5);">match 94%</div>
    </div>
    <div class="photo-tile tile t2" onclick="togglePhoto(this)">
      <div class="photo-tile-overlay"></div>
      <div style="position:absolute;bottom:6px;left:8px;color:white;font-size:10px;text-shadow:0 1px 2px rgba(0,0,0,.5);">match 91%</div>
    </div>
    <div class="photo-tile tile t3 selected" onclick="togglePhoto(this)">
      <div class="photo-tile-overlay"></div>
      <div style="position:absolute;top:6px;right:6px;width:24px;height:24px;background:var(--primary-600);border-radius:50%;display:grid;place-items:center;color:white;font-size:14px;border:2px solid white;">✓</div>
      <div style="position:absolute;bottom:6px;left:8px;color:white;font-size:10px;text-shadow:0 1px 2px rgba(0,0,0,.5);">match 96%</div>
    </div>
    <div class="photo-tile tile t4" onclick="togglePhoto(this)">
      <div class="photo-tile-overlay"></div>
    </div>
    <div class="photo-tile tile t5 selected" onclick="togglePhoto(this)">
      <div class="photo-tile-overlay"></div>
      <div style="position:absolute;top:6px;right:6px;width:24px;height:24px;background:var(--primary-600);border-radius:50%;display:grid;place-items:center;color:white;font-size:14px;border:2px solid white;">✓</div>
    </div>
    <div class="photo-tile tile t6" onclick="togglePhoto(this)"><div class="photo-tile-overlay"></div></div>
    <div class="photo-tile tile t2" onclick="togglePhoto(this)"><div class="photo-tile-overlay"></div></div>
    <div class="photo-tile tile" onclick="togglePhoto(this)"><div class="photo-tile-overlay"></div></div>
    <div class="photo-tile tile t3" onclick="togglePhoto(this)"><div class="photo-tile-overlay"></div></div>
    <div class="photo-tile tile t5" onclick="togglePhoto(this)"><div class="photo-tile-overlay"></div></div>
    <div class="photo-tile tile t4" onclick="togglePhoto(this)"><div class="photo-tile-overlay"></div></div>
    <div class="photo-tile tile t6" onclick="togglePhoto(this)"><div class="photo-tile-overlay"></div></div>
    <div class="photo-tile tile" onclick="togglePhoto(this)"><div class="photo-tile-overlay"></div></div>
    <div class="photo-tile tile t2" onclick="togglePhoto(this)"><div class="photo-tile-overlay"></div></div>
  </div>

  <!-- Botão fixed embaixo -->
  <div style="position:fixed;bottom:0;left:0;right:0;max-width:420px;margin:0 auto;background:white;border-top:1px solid var(--gray-200);padding:12px 16px;display:flex;gap:10px;">
    <a href="inicio.html" class="btn btn-secondary" style="flex:1;justify-content:center;">Voltar</a>
    <a href="galeria-final.html" class="btn btn-primary" style="flex:2;justify-content:center;">
      Finalizar seleção (<span id="counter-bottom">3</span>) →
    </a>
  </div>
</div>

<script src="../assets/js/app.js"></script>

</body>
</html>
