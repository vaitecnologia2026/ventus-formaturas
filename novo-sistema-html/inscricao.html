<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/assets/img/icon.png">
<meta name="theme-color" content="#0A2540">
<title>Cadastro da Formatura — Ventus</title>
<script src="/assets/js/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#2563EB; --azul-esc:#1E3A8A; --azul-950:#172554;
    --ink:#0F172A; --cinza:#64748B; --cinza2:#475569; --linha:#E2E8F0;
    --bg:#F1F5F9; --branco:#fff; --verde:#16A34A; --verde-bg:#DCFCE7;
    --vermelho:#B91C1C; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

  /* ===== Header com logo (contraste garantido) ===== */
  .top{background:linear-gradient(135deg,var(--azul-950),var(--azul));color:#fff;padding:18px 20px;}
  .top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;}
  .top .logo-wrap{background:transparent;padding:0;display:inline-flex;align-items:center;}
  .top .logo-wrap img{height:34px;display:block;}
  .top .logo-fallback{font-weight:900;font-size:20px;letter-spacing:-.02em;color:#fff;}
  .top .marca{font-size:13px;opacity:.9;letter-spacing:.02em;line-height:1.3;}
  .top .marca b{display:block;font-size:15px;font-weight:700;opacity:1;}

  /* ===== Progress bar (etapas) ===== */
  .steps{background:#fff;border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:20;}
  .steps-in{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;gap:6px;overflow-x:auto;}
  .step{display:flex;align-items:center;gap:8px;flex:0 0 auto;color:var(--cinza);font-size:13px;font-weight:600;white-space:nowrap;}
  .step .num{width:26px;height:26px;border-radius:50%;background:var(--linha);color:var(--cinza2);display:grid;place-items:center;font-size:13px;font-weight:700;flex:0 0 auto;transition:.2s;}
  .step.active{color:var(--azul-esc);}
  .step.active .num{background:var(--azul);color:#fff;}
  .step.done{color:var(--verde);}
  .step.done .num{background:var(--verde);color:#fff;}
  .step .bar{width:24px;height:2px;background:var(--linha);border-radius:2px;}
  @media(max-width:640px){ .step .lbl{display:none;} .step .bar{width:16px;} .steps-in{gap:4px;justify-content:center;} }

  /* ===== Layout ===== */
  .wrap{max-width:1080px;margin:0 auto;padding:24px 20px 120px;display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start;}
  @media(max-width:900px){ .wrap{grid-template-columns:1fr;padding-bottom:24px;} }
  .main{min-width:0;}
  .card{background:#fff;border:1px solid var(--linha);border-radius:20px;box-shadow:0 12px 40px -22px rgba(15,23,42,.28);padding:26px 24px;}
  @media(max-width:640px){ .card{padding:22px 18px;border-radius:16px;} }

  h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px;}
  .sub{color:var(--cinza);font-size:14px;margin:0 0 20px;line-height:1.45;}
  .sec-title{font-size:16px;font-weight:800;letter-spacing:-.01em;margin:0 0 3px;}
  .sec-hint{font-size:13px;color:var(--cinza);margin:0 0 16px;}

  label{display:block;font-size:13px;font-weight:600;color:#334155;margin:0 0 6px;}
  .fld{margin-bottom:16px;}
  input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--linha);border-radius:12px;font-size:15px;font-family:inherit;outline:none;transition:.15s;background:#fff;color:var(--ink);}
  input:focus,select:focus,textarea:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
  input[readonly]{background:#F8FAFC;color:var(--cinza2);}
  textarea{resize:vertical;min-height:64px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  @media(max-width:480px){ .grid2,.grid3{grid-template-columns:1fr;} }

  /* ===== Cards de plano (produto) ===== */
  .produtos{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:760px){ .produtos{grid-template-columns:1fr;} }
  .prod{position:relative;border:1.5px solid var(--linha);border-radius:16px;padding:18px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;background:#fff;}
  .prod:hover{border-color:#93C5FD;box-shadow:0 8px 24px -16px rgba(37,99,235,.4);}
  .prod.on{border-color:var(--azul);background:#EFF6FF;box-shadow:0 0 0 3px rgba(37,99,235,.12);}
  .prod.bloq{opacity:.6;pointer-events:none;filter:grayscale(.3);}
  .prod input{position:absolute;opacity:0;pointer-events:none;}
  .prod .badge{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;}
  .prod .badge.vaga{background:var(--verde-bg);color:#166534;}
  .prod .badge.esgot{background:#FEE2E2;color:var(--vermelho);}
  .prod .p-nome{font-weight:800;font-size:17px;letter-spacing:-.01em;padding-right:70px;}
  .prod .p-tag{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;color:var(--azul-esc);background:#DBEAFE;padding:3px 8px;border-radius:6px;}
  .prod .p-desc{font-size:13px;color:var(--cinza);margin-top:10px;line-height:1.45;}
  .prod ul.p-inc{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:6px;}
  .prod ul.p-inc li{font-size:13px;color:var(--cinza2);display:flex;gap:7px;align-items:flex-start;}
  .prod ul.p-inc li svg{width:15px;height:15px;color:var(--verde);flex:0 0 auto;margin-top:1px;}
  .prod .p-preco-wrap{margin-top:auto;padding-top:14px;}
  .prod .p-preco{font-size:24px;font-weight:900;color:var(--azul-950);letter-spacing:-.02em;}
  .prod .p-sub{font-size:12px;color:var(--cinza);margin-top:2px;}
  .prod .p-check{margin-top:12px;text-align:center;font-size:13px;font-weight:700;color:var(--azul);border:1.5px solid #BFDBFE;border-radius:10px;padding:8px;transition:.15s;}
  .prod.on .p-check{background:var(--azul);color:#fff;border-color:var(--azul);}

  /* ===== Meios de pagamento ===== */
  .meios{display:grid;gap:10px;margin-top:6px;}
  .meio{position:relative;border:1.5px solid var(--linha);border-radius:12px;padding:13px 15px;cursor:pointer;transition:.15s;}
  .meio:hover{border-color:#93C5FD;}
  .meio.on{border-color:var(--azul);background:#EFF6FF;}
  .meio input{position:absolute;opacity:0;pointer-events:none;}
  .meio .m-nome{font-weight:700;font-size:14px;}
  .meio .m-desc{font-size:12.5px;color:var(--cinza);margin-top:3px;}

  /* ===== Contrato ===== */
  .contrato-box{border:1px solid var(--linha);border-radius:12px;padding:14px 16px;font-size:13px;color:#334155;max-height:280px;overflow:auto;white-space:pre-wrap;line-height:1.5;background:#F8FAFC;}
  .aceite{display:flex;gap:11px;align-items:flex-start;margin-top:14px;font-size:14px;cursor:pointer;line-height:1.4;}
  .aceite input{width:20px;height:20px;flex:0 0 auto;margin-top:1px;accent-color:var(--azul);}

  /* ===== Adicionais ===== */
  .add{display:flex;align-items:center;gap:14px;border:1px solid var(--linha);border-radius:12px;padding:12px 15px;margin-bottom:10px;}
  .add .a-info{flex:1;min-width:0;}
  .add .a-n{font-weight:600;font-size:14px;}
  .add .a-v{font-size:12.5px;color:var(--azul-esc);font-weight:700;margin-top:2px;}
  .add .q-add{width:64px;text-align:center;padding:9px;}
  .ev{border:1px solid var(--linha);border-radius:12px;padding:14px 15px;margin-bottom:12px;}
  .ev .ev-n{font-weight:700;font-size:14px;margin-bottom:10px;}

  .empty-note{background:#F8FAFC;border:1px dashed var(--linha);border-radius:12px;padding:20px;text-align:center;color:var(--cinza);font-size:14px;}

  /* ===== Navegação ===== */
  .nav{display:flex;gap:12px;margin-top:24px;}
  .btn{flex:1;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:.15s;}
  .btn-primary{background:var(--azul);color:#fff;}
  .btn-primary:hover{background:var(--azul-esc);}
  .btn-primary:disabled{opacity:.6;cursor:not-allowed;}
  .btn-ghost{flex:0 0 auto;padding:14px 22px;background:#fff;color:var(--cinza2);border:1.5px solid var(--linha);}
  .btn-ghost:hover{border-color:#CBD5E1;background:#F8FAFC;}

  .erro{color:var(--vermelho);font-size:13px;font-weight:600;margin:0 0 14px;display:none;background:#FEF2F2;border:1px solid #FECACA;border-radius:10px;padding:10px 12px;}

  /* ===== Resumo / carrinho ===== */
  .resumo{background:#fff;border:1px solid var(--linha);border-radius:20px;box-shadow:0 12px 40px -24px rgba(15,23,42,.28);padding:22px 20px;position:sticky;top:78px;}
  @media(max-width:900px){ .resumo{position:static;margin-top:20px;} }
  .resumo h3{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--cinza2);margin:0 0 16px;display:flex;align-items:center;gap:8px;}
  .resumo h3 svg{width:18px;height:18px;color:var(--azul);}
  .r-line{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:9px 0;border-bottom:1px dashed var(--linha);}
  .r-line .l{color:var(--cinza2);}
  .r-line .v{font-weight:700;text-align:right;}
  .r-empty{color:var(--cinza);font-size:14px;text-align:center;padding:14px 0;}
  .r-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;padding-top:14px;border-top:2px solid var(--ink);}
  .r-total .l{font-size:15px;font-weight:800;}
  .r-total .v{font-size:24px;font-weight:900;color:var(--azul-950);letter-spacing:-.02em;}
  .r-desc{background:var(--verde-bg);color:#166534;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:12px;}

  /* ===== Estados globais ===== */
  .ok{text-align:center;padding:24px 6px;}
  .ok .ic{width:76px;height:76px;border-radius:50%;background:var(--verde-bg);color:var(--verde);display:grid;place-items:center;margin:0 auto 16px;}
  .ok .ic svg{width:40px;height:40px;}
  .muted{color:var(--cinza);font-size:13px;text-align:center;margin-top:16px;line-height:1.5;}
  .center-card{max-width:520px;margin:40px auto;}
  .hide{display:none !important;}

  /* Chip pagamento na tela final */
  .final-box{border:1px solid var(--linha);border-radius:16px;background:#F8FAFC;padding:20px;margin-top:20px;text-align:left;}
  .final-box .fb-t{font-weight:800;font-size:15px;margin-bottom:12px;}
  .pay-hint{display:flex;gap:12px;align-items:center;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:12px;padding:14px 16px;margin-top:18px;}
  .pay-hint svg{width:26px;height:26px;color:var(--azul);flex:0 0 auto;}
  .pay-hint .ph-t{font-size:14px;color:var(--azul-esc);line-height:1.4;}

  /* ===== Toast (aviso, sem alert nativo) ===== */
  #vt-toast-stack{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:420px;pointer-events:none;}
  .vt-toast{background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:600;line-height:1.4;box-shadow:0 12px 40px -12px rgba(15,23,42,.5);display:flex;gap:10px;align-items:flex-start;animation:vt-toast-in .2s ease-out;pointer-events:auto;}
  .vt-toast svg{width:18px;height:18px;flex:0 0 auto;margin-top:1px;}
  .vt-toast.err{background:#7F1D1D;}
  .vt-toast.err svg{color:#FCA5A5;}
  .vt-toast.ok{background:#166534;}
  .vt-toast.ok svg{color:#86EFAC;}
  @keyframes vt-toast-in{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}

  /* ===== Escolha sim/não (plus size) ===== */
  .choice{display:flex;gap:10px;}
  .choice label{flex:1;margin:0;text-align:center;border:1.5px solid var(--linha);border-radius:12px;padding:11px;font-size:14px;font-weight:700;color:var(--cinza2);cursor:pointer;transition:.15s;}
  .choice label.on{border-color:var(--azul);background:#EFF6FF;color:var(--azul-esc);}
  .choice input{position:absolute;opacity:0;pointer-events:none;}

  /* ===== Stepper +/- quantidade ===== */
  .stepper{display:inline-flex;align-items:center;border:1.5px solid var(--linha);border-radius:12px;overflow:hidden;flex:0 0 auto;}
  .stepper button{width:38px;height:40px;border:none;background:#F8FAFC;color:var(--azul-esc);font-size:20px;font-weight:800;line-height:1;cursor:pointer;padding:0;transition:.15s;}
  .stepper button:hover{background:#EFF6FF;}
  .stepper button:disabled{opacity:.4;cursor:not-allowed;}
  .stepper .st-n{min-width:40px;text-align:center;font-size:15px;font-weight:800;color:var(--ink);padding:0 6px;}
</style>
</head>
<body>
<div class="top">
  <div class="top-in">
    <span class="logo-wrap">
      <img src="/assets/img/logo-branca.png" alt="Ventus Formaturas" onerror="this.onerror=null;this.outerHTML='<span class=&quot;logo-fallback&quot;>Ventus</span>'">
    </span>
    <div class="marca"><b>Cadastro da sua Formatura</b>Preencha em poucos passos</div>
  </div>
</div>

<!-- Barra de etapas -->
<div class="steps hide" id="steps">
  <div class="steps-in" id="steps-in"></div>
</div>

<div class="wrap" id="wrap">
  <div class="main">
    <div class="card" id="card"><p class="muted">Carregando…</p></div>
  </div>
  <aside class="resumo hide" id="resumo"></aside>
</div>

<script>
const token = new URLSearchParams(location.search).get('t');
const card = document.getElementById('card');
const stepsEl = document.getElementById('steps');
const stepsIn = document.getElementById('steps-in');
const resumoEl = document.getElementById('resumo');
const brl = v => 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s==null?'':s).replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const maskCpf = v => { const x=String(v||'').replace(/\D/g,'').slice(0,11); return x.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'); };

/* ===== Toast (aviso, sem alert nativo) ===== */
function toast(msg, tipo){
  let stack = document.getElementById('vt-toast-stack');
  if(!stack){ stack = document.createElement('div'); stack.id='vt-toast-stack'; document.body.appendChild(stack); }
  const ic = tipo==='ok'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
  const el = document.createElement('div');
  el.className = 'vt-toast ' + (tipo==='ok'?'ok':'err');
  el.innerHTML = ic + '<span>'+esc(msg)+'</span>';
  stack.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .2s'; el.style.opacity='0'; setTimeout(()=>el.remove(),200); }, 3400);
}

let DADOS = null;
let STEP = 0;                 // etapa atual (0..4)
const TOTAL_STEPS = 5;
let DESC = null;             // último desconto aplicado {desconto_fotografia, desconto_cerimonial, nome}
let CUPOM = null;            // cupom aplicado {codigo, tipo:'valor'|'percentual', valor, descricao}

// ---- estado do formulário (persiste entre etapas) ----
const F = {
  nome:'', celular:'', email:'', email_confirma:'', cpf:'', curso:'', ano_formatura:'',
  altura:'', peso:'', calcado:'',
  plus_size:null, num_calca:'',      // medidas (só quando a turma solicitar)
  plano_id:null, meio_pagamento:null, forma_pagamento:null, parcelas:null,
  aceite_contrato:false, observacoes:'',
  participacoes:[],   // {evento_fotografico_id, qtd_familiares, qtd_convidados}
  adicionais:[],      // {descricao, valor, quantidade}
};

const STEP_LABELS = ['Dados','Plano & Pagamento','Adicionais','Contrato','Confirmação'];

if (!token) {
  card.innerHTML = '<h1>Link inválido</h1><p class="sub">Peça um novo link de cadastro à comissão.</p>';
} else {
  carregar();
}

const planoById = id => (DADOS && DADOS.planos.find(p => String(p.id)===String(id))) || null;
const planoSel = () => planoById(F.plano_id);

// A turma pede medidas? (flag defensiva: só mostra se a API indicar)
function pedeMedidas(){
  if(!DADOS) return false;
  const t = DADOS.turma || {};
  const cands = [DADOS.solicitar_medidas, t.solicitar_medidas, DADOS.pede_medidas, t.pede_medidas];
  return cands.some(v => v === true);
}
// Este CPF é da comissão? (defensivo: usa flag da API se vier)
function cpfEhComissao(){
  const cands = [DESC && DESC.comissao, DESC && DESC.is_comissao, DADOS && DADOS.aluno && DADOS.aluno.comissao, DADOS && DADOS.aluno && DADOS.aluno.is_comissao];
  return cands.some(v => v === true);
}
// Itens/brindes inclusos no plano (defensivo com os nomes de campo que vierem)
function brindesDoPlano(p){
  if(!p) return [];
  const raw = p.brindes || p.itens_inclusos || p.inclusos || p.brindes_inclusos || [];
  return (Array.isArray(raw)?raw:[]).map(b => (b && typeof b==='object') ? (b.nome||b.descricao||b.label||'') : String(b)).filter(Boolean);
}
// Itens exclusivos da comissão (só quando o CPF for da comissão e a API indicar)
function itensComissao(p){
  if(!p || !cpfEhComissao()) return [];
  const raw = p.itens_comissao || p.brindes_comissao || (DADOS && DADOS.itens_comissao) || [];
  return (Array.isArray(raw)?raw:[]).map(b => (b && typeof b==='object') ? (b.nome||b.descricao||b.label||'') : String(b)).filter(Boolean);
}
// Taxa de boleto quando aplicável (defensivo)
function taxaBoleto(p){
  const meio = (F.meio_pagamento||F.forma_pagamento||'').toLowerCase();
  const ehBoleto = meio.includes('boleto');
  if(!ehBoleto) return 0;
  const cands = [p && p.taxa_boleto, DADOS && DADOS.taxa_boleto, DADOS && DADOS.config && DADOS.config.taxa_boleto];
  const t = cands.find(v => v != null);
  return Number(t)||0;
}
// Lista de cursos da turma (se a API trouxer); aceita array de strings ou de {id,nome}
function cursosDaTurma(){
  const raw = (DADOS && (DADOS.cursos || (DADOS.turma && DADOS.turma.cursos))) || [];
  return (Array.isArray(raw) ? raw : [])
    .map(c => (c && typeof c === 'object') ? (c.nome || c.descricao || c.label || '') : String(c))
    .filter(Boolean);
}

// desconto do cupom, calculado sobre a base (valor da fotografia se houver, senão o total do plano+adicionais)
function cupomDesconto(baseFotografia, baseTotal){
  if(!CUPOM) return 0;
  const base = (CUPOM.tipo==='percentual')
    ? (baseFotografia != null && baseFotografia > 0 ? baseFotografia : baseTotal)
    : 0;
  let d = 0;
  if(CUPOM.tipo==='percentual') d = base * (Number(CUPOM.valor)||0) / 100;
  else d = Number(CUPOM.valor)||0; // tipo 'valor'
  return Math.max(0, d);
}

async function carregar(){
  const r = await fetch(apiUrl('/api/inscricao/'+token));
  if(!r.ok){ card.innerHTML = '<h1>Link inválido</h1><p class="sub">Este link de cadastro não é válido. Peça um novo à comissão.</p>'; return; }
  DADOS = await r.json();
  const a = DADOS.aluno || {};
  // hidrata estado com o que já veio do backend
  F.nome = a.nome || '';
  F.celular = a.celular || '';
  F.email = a.email || '';
  F.email_confirma = a.email || '';   // se já veio preenchido, considera confirmado
  F.cpf = a.cpf ? maskCpf(a.cpf) : '';
  F.curso = a.curso || '';
  F.ano_formatura = a.ano_formatura || '';
  F.altura = a.altura || '';
  F.peso = a.peso || '';
  F.calcado = a.calcado || '';
  // medidas (backend: plus_size:bool / num_calca:texto)
  F.plus_size = (a.plus_size != null) ? !!a.plus_size : null;
  F.num_calca = a.num_calca || '';
  F.plano_id = a.plano_id != null ? a.plano_id : null;
  F.meio_pagamento = a.meio_pagamento || null;
  F.forma_pagamento = a.forma_pagamento || null;
  F.parcelas = a.parcelas_escolhidas || null;
  F.aceite_contrato = !!a.aceite_contrato;
  F.observacoes = a.observacoes || '';
  // adicionais já escolhidos
  (DADOS.adicionais||[]).forEach(x=>{ F.adicionais.push({descricao:x.descricao, valor:+x.valor||0, quantidade:+x.quantidade||0}); });
  // participações já escolhidas (por evento)
  stepsEl.classList.remove('hide');
  resumoEl.classList.remove('hide');
  STEP = 0;
  render();
}

/* =================== RENDER PRINCIPAL =================== */
function render(){
  renderSteps();
  renderResumo();
  const views = [viewDados, viewPlano, viewAdicionais, viewContrato, viewFinal];
  views[STEP]();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderSteps(){
  stepsIn.innerHTML = STEP_LABELS.map((lbl,i)=>{
    const cls = i===STEP ? 'active' : (i<STEP ? 'done' : '');
    const num = i<STEP ? '✓' : (i+1);
    return `<div class="step ${cls}"><span class="num">${num}</span><span class="lbl">${lbl}</span></div>${i<STEP_LABELS.length-1?'<span class="bar"></span>':''}`;
  }).join('');
}

/* =================== RESUMO / CARRINHO =================== */
function renderResumo(){
  const p = planoSel();
  const addTotal = F.adicionais.reduce((s,x)=> s + (x.valor||0)*(x.quantidade||0), 0);
  const planoVal = p ? (p.valor||0) : 0;
  const descTotal = DESC ? ((DESC.desconto_fotografia||0)+(DESC.desconto_cerimonial||0)) : 0;
  const subTotal = planoVal + addTotal;
  const cupomVal = cupomDesconto(p ? (p.valor_fotografia||0) : 0, subTotal);
  const taxa = taxaBoleto(p);
  const total = Math.max(0, subTotal - descTotal - cupomVal) + taxa;

  let inner = `<h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>Seu pedido</h3>`;

  if(!p && !addTotal){
    inner += `<p class="r-empty">Escolha um plano para ver o resumo.</p>`;
  } else {
    if(p){
      inner += `<div class="r-line"><span class="l">${esc(p.nome)}</span><span class="v">${brl(planoVal)}</span></div>`;
      if(F.meio_pagamento || F.forma_pagamento){
        const meioLbl = meioLabel(p, F.meio_pagamento) || formaLabel(F.forma_pagamento) || '';
        if(meioLbl) inner += `<div class="r-line"><span class="l">Pagamento</span><span class="v" style="font-weight:600;">${esc(meioLbl)}${F.parcelas&&F.parcelas>1?` · ${F.parcelas}x`:''}</span></div>`;
      }
    }
    F.adicionais.filter(x=>x.quantidade>0).forEach(x=>{
      inner += `<div class="r-line"><span class="l">${esc(x.descricao)} × ${x.quantidade}</span><span class="v">${brl(x.valor*x.quantidade)}</span></div>`;
    });
    if(descTotal>0){
      inner += `<div class="r-desc">✓ Desconto aplicado${DESC && DESC.nome?` (${esc(DESC.nome)})`:''}: −${brl(descTotal)}</div>`;
    }
    if(cupomVal>0 && CUPOM){
      inner += `<div class="r-desc">🏷️ Cupom ${esc(CUPOM.codigo)} — desconto ${brl(cupomVal)}</div>`;
    }
    if(taxa>0){
      inner += `<div class="r-line"><span class="l">Taxa de boleto</span><span class="v">${brl(taxa)}</span></div>`;
    }
    inner += `<div class="r-total"><span class="l">Total</span><span class="v">${brl(total)}</span></div>`;
  }
  resumoEl.innerHTML = inner;
}

function meioLabel(p, meio){
  if(!p || !meio || !p.meios_pagamento) return null;
  const m = p.meios_pagamento.find(x=>x.meio===meio);
  return m ? m.label : null;
}
function formaLabel(forma){
  if(!forma) return null;
  const fp = (DADOS.formas_pagamento||[]).find(f=>f[0]===forma);
  return fp ? fp[1] : forma;
}

function showErro(msg){
  const e = document.getElementById('erro');
  if(e){ e.textContent = msg; e.style.display = 'block'; }
}
function clearErro(){ const e=document.getElementById('erro'); if(e) e.style.display='none'; }

/* =================== ETAPA 1: DADOS =================== */
function viewDados(){
  const a = DADOS.aluno || {};
  const nomeReadonly = !!(a.nome && a.nome.trim());
  const cursos = cursosDaTurma();
  // Curso: dropdown quando a turma trouxer a lista; senão input livre (defensivo)
  let cursoHtml;
  if(cursos.length){
    const temAtual = F.curso && cursos.some(c => c.toLowerCase() === F.curso.toLowerCase());
    cursoHtml = `<select id="i-curso"><option value="">Selecione…</option>${
      cursos.map(c=>`<option value="${esc(c)}" ${temAtual && c.toLowerCase()===F.curso.toLowerCase()?'selected':''}>${esc(c)}</option>`).join('')
    }${(F.curso && !temAtual)?`<option value="${esc(F.curso)}" selected>${esc(F.curso)}</option>`:''}</select>`;
  } else {
    cursoHtml = `<input id="i-curso" value="${esc(F.curso)}" placeholder="Ex.: Medicina">`;
  }

  // Medidas: só quando a turma solicitar. Pede apenas Plus size? e Medida da calça.
  const medidasHtml = pedeMedidas() ? `
    <p class="sec-title" style="margin-top:8px;">Suas medidas</p>
    <p class="sec-hint">Para a beca e produtos personalizados.</p>
    <div class="grid2">
      <div class="fld"><label>Plus size?</label>
        <div class="choice" id="c-plus">
          <label data-v="1" class="${F.plus_size===true?'on':''}"><input type="radio" name="plus" ${F.plus_size===true?'checked':''}>Sim</label>
          <label data-v="0" class="${F.plus_size===false?'on':''}"><input type="radio" name="plus" ${F.plus_size===false?'checked':''}>Não</label>
        </div>
      </div>
      <div class="fld"><label>Medida da calça (sem elastano)</label>
        <input id="i-numcalca" value="${esc(F.num_calca)}" placeholder="Ex.: 42"></div>
    </div>` : '';

  card.innerHTML = `
    <h1>Olá, ${esc((F.nome||'você').split(' ')[0])}! 👋</h1>
    <p class="sub">Confirme seus dados para a turma <b>${esc(DADOS.turma?DADOS.turma.nome:'')}</b>${DADOS.turma&&DADOS.turma.instituicao?` · ${esc(DADOS.turma.instituicao)}`:''}.</p>
    <p class="erro" id="erro"></p>

    <div class="fld"><label>Nome completo *</label>
      <input id="i-nome" value="${esc(F.nome)}" ${nomeReadonly?'readonly':'placeholder="Seu nome completo"'}></div>

    <div class="grid2">
      <div class="fld"><label>CPF *</label><input id="i-cpf" value="${esc(F.cpf)}" inputmode="numeric" placeholder="000.000.000-00"></div>
      <div class="fld"><label>WhatsApp *</label><input id="i-cel" value="${esc(F.celular)}" placeholder="(38) 99999-0000"></div>
    </div>
    <div class="grid2">
      <div class="fld"><label>E-mail *</label><input id="i-email" type="email" value="${esc(F.email)}" placeholder="voce@email.com" autocomplete="email"></div>
      <div class="fld"><label>Confirmar e-mail *</label><input id="i-email2" type="email" value="${esc(F.email_confirma)}" placeholder="repita seu e-mail" autocomplete="off" onpaste="return false;"></div>
    </div>
    <div class="grid2">
      <div class="fld"><label>Curso *</label>${cursoHtml}</div>
      <div class="fld"><label>Ano de formatura *</label><input id="i-ano" type="number" value="${esc(F.ano_formatura)}" placeholder="2026"></div>
    </div>

    ${medidasHtml}

    <div class="nav">
      <button class="btn btn-primary" id="btn-next">Continuar</button>
    </div>`;

  const cpfEl = document.getElementById('i-cpf');
  cpfEl.value = maskCpf(cpfEl.value);
  cpfEl.oninput = () => { cpfEl.value = maskCpf(cpfEl.value); };

  // Plus size (escolha sim/não)
  const cplus = document.getElementById('c-plus');
  if(cplus){
    cplus.querySelectorAll('label').forEach(l=>{
      l.onclick = () => {
        F.plus_size = l.dataset.v === '1';
        cplus.querySelectorAll('label').forEach(x=>x.classList.toggle('on', x===l));
        const inp = l.querySelector('input'); if(inp) inp.checked = true;
      };
    });
  }

  document.getElementById('btn-next').onclick = () => {
    saveDados();
    if(!validarDados()) return;
    clearErro();
    // aplica desconto por CPF ao avançar (mantém comportamento existente)
    checarDesconto();
    STEP = 1; render();
  };
}

// valida todos os campos obrigatórios da etapa Dados; avisa via toast
function validarDados(){
  const cpfNum = (F.cpf||'').replace(/\D/g,'');
  const email = (F.email||'').trim().toLowerCase();
  const email2 = (F.email_confirma||'').trim().toLowerCase();
  if(!F.nome.trim()){ toast('Informe seu nome completo.'); return false; }
  if(cpfNum.length !== 11){ toast('Informe um CPF válido (11 dígitos).'); return false; }
  if(!(F.celular||'').trim()){ toast('Informe seu WhatsApp.'); return false; }
  if(!email){ toast('Informe seu e-mail.'); return false; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast('Informe um e-mail válido.'); return false; }
  if(!email2){ toast('Confirme seu e-mail.'); return false; }
  if(email !== email2){ toast('Os e-mails não coincidem. Verifique e tente de novo.'); return false; }
  if(!(F.curso||'').trim()){ toast('Selecione ou informe seu curso.'); return false; }
  if(!(String(F.ano_formatura||'').trim())){ toast('Informe o ano de formatura.'); return false; }
  if(pedeMedidas()){
    if(F.plus_size === null){ toast('Informe se você usa plus size.'); return false; }
    if(!(F.num_calca||'').trim()){ toast('Informe a medida da calça (sem elastano).'); return false; }
  }
  return true;
}

function saveDados(){
  F.nome = document.getElementById('i-nome').value.trim();
  F.celular = document.getElementById('i-cel').value;
  F.email = document.getElementById('i-email').value;
  F.email_confirma = document.getElementById('i-email2').value;
  F.cpf = document.getElementById('i-cpf').value;
  F.curso = document.getElementById('i-curso').value;
  F.ano_formatura = document.getElementById('i-ano').value || '';
  const nc = document.getElementById('i-numcalca');
  if(nc) F.num_calca = nc.value;
}

/* =================== ETAPA 2: PLANO + PAGAMENTO =================== */
function viewPlano(){
  const a = DADOS.aluno || {};
  const planos = DADOS.planos || [];
  const cardsHtml = planos.length ? planos.map(p=>{
    const bloq = p.lotado && String(a.plano_id)!==String(p.id);
    const on = String(F.plano_id)===String(p.id);
    let badge='';
    if(p.vagas!=null){
      badge = bloq ? `<span class="badge esgot">Esgotado</span>` : `<span class="badge vaga">${p.vagas_restantes} vaga(s)</span>`;
    }
    const incl = [];
    if(p.qt_fotos) incl.push(`${p.qt_fotos} fotos`);
    if(p.forma_entrega) incl.push(esc(p.forma_entrega));
    if(p.valor_fotografia) incl.push(`Fotografia ${brl(p.valor_fotografia)}`);
    if(p.valor_cerimonial) incl.push(`Cerimonial ${brl(p.valor_cerimonial)}`);
    const inclHtml = incl.length ? `<ul class="p-inc">${incl.map(t=>`<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>${t}</li>`).join('')}</ul>` : '';
    return `
      <label class="prod ${on?'on':''} ${bloq?'bloq':''}" data-id="${p.id}">
        <input type="radio" name="plano" value="${p.id}" ${on?'checked':''} ${bloq?'disabled':''}>
        ${badge}
        <div class="p-nome">${esc(p.nome)}</div>
        ${p.tipo_contrato_label?`<span class="p-tag">${esc(p.tipo_contrato_label)}</span>`:''}
        ${p.descricao?`<div class="p-desc">${esc(p.descricao)}</div>`:''}
        ${inclHtml}
        <div class="p-preco-wrap">
          <div class="p-preco">${brl(p.valor)}</div>
          <div class="p-sub">${bloq?'Vagas esgotadas':'Valor do plano'}</div>
          <div class="p-check">${on?'Selecionado ✓':'Escolher plano'}</div>
        </div>
      </label>`;
  }).join('') : '<div class="empty-note">Nenhum plano disponível no momento. Fale com a comissão.</div>';

  card.innerHTML = `
    <h1>Escolha seu plano</h1>
    <p class="sub">Selecione o plano da sua formatura e a forma de pagamento.</p>
    <p class="erro" id="erro"></p>
    <div class="produtos">${cardsHtml}</div>
    <div id="pag-sec" style="margin-top:22px;"></div>
    <div class="nav">
      <button class="btn btn-ghost" id="btn-back">Voltar</button>
      <button class="btn btn-primary" id="btn-next">Continuar</button>
    </div>`;

  document.querySelectorAll('.prod').forEach(el=>{
    if(el.classList.contains('bloq')) return;
    el.onclick = () => {
      F.plano_id = el.dataset.id;
      // reset de pagamento ao trocar de plano
      F.meio_pagamento = null; F.forma_pagamento = null; F.parcelas = null;
      renderPagamento();
      // re-marcar visual
      document.querySelectorAll('.prod').forEach(x=>{
        const isOn = x.dataset.id===F.plano_id;
        x.classList.toggle('on', isOn);
        const chk = x.querySelector('.p-check'); if(chk) chk.textContent = isOn?'Selecionado ✓':'Escolher plano';
        const inp = x.querySelector('input'); if(inp) inp.checked = isOn;
      });
      checarDesconto();
      renderResumo();
    };
  });

  renderPagamento();

  document.getElementById('btn-back').onclick = () => { STEP=0; render(); };
  document.getElementById('btn-next').onclick = () => {
    savePagamento();
    if(!F.plano_id){ showErro('Escolha um plano para continuar.'); toast('Escolha um plano para continuar.'); return; }
    if(!F.meio_pagamento && !F.forma_pagamento){ showErro('Selecione a forma de pagamento.'); toast('Selecione a forma de pagamento.'); return; }
    clearErro();
    STEP = 2; render();
  };
}

function renderPagamento(){
  const sec = document.getElementById('pag-sec'); if(!sec) return;
  const p = planoSel();
  if(!p){ sec.innerHTML = ''; return; }
  let meiosHtml;
  if(p.meios_pagamento && p.meios_pagamento.length){
    meiosHtml = `<div class="meios">${p.meios_pagamento.map(m=>{
      const on = F.meio_pagamento===m.meio;
      return `
        <label class="meio ${on?'on':''}" data-meio="${esc(m.meio)}" data-qt="${m.qt_parcela||1}">
          <input type="radio" name="meio" value="${esc(m.meio)}" ${on?'checked':''}>
          <div class="m-nome">${esc(m.label)}${m.qt_parcela>1?` · até ${m.qt_parcela}x`:''}</div>
          ${m.descricao?`<div class="m-desc">${esc(m.descricao)}</div>`:''}
        </label>`;
    }).join('')}</div>`;
  } else {
    const formas = DADOS.formas_pagamento || [];
    meiosHtml = `<div class="fld"><select id="i-forma"><option value="">Selecione…</option>${formas.map(f=>`<option value="${esc(f[0])}" ${F.forma_pagamento===f[0]?'selected':''}>${esc(f[1])}</option>`).join('')}</select></div>`;
  }
  sec.innerHTML = `
    <p class="sec-title">Forma de pagamento</p>
    <p class="sec-hint">Como você prefere pagar seu plano.</p>
    ${meiosHtml}
    <div id="desc-note" style="margin-top:10px;font-size:13px;"></div>
    <div id="parc-box" style="margin-top:12px;"></div>
    <div id="cupom-box" style="margin-top:16px;"></div>`;

  renderCupom();

  // meios (radios visuais)
  document.querySelectorAll('#pag-sec .meio').forEach(el=>{
    el.onclick = () => {
      F.meio_pagamento = el.dataset.meio;
      F.forma_pagamento = el.dataset.meio; // espelha (backend usa forma_pagamento)
      F.parcelas = null;
      document.querySelectorAll('#pag-sec .meio').forEach(x=>x.classList.toggle('on', x===el));
      const inp = el.querySelector('input'); if(inp) inp.checked = true;
      renderParcelas(+el.dataset.qt);
      renderResumo();
    };
  });
  // select (formas_pagamento fallback)
  const formaSel = document.getElementById('i-forma');
  if(formaSel){
    formaSel.onchange = () => {
      F.forma_pagamento = formaSel.value || null;
      F.meio_pagamento = null;
      renderResumo();
    };
  }

  // re-render de parcelas se já havia meio escolhido
  const selMeio = p.meios_pagamento && F.meio_pagamento ? p.meios_pagamento.find(m=>m.meio===F.meio_pagamento) : null;
  if(selMeio) renderParcelas(selMeio.qt_parcela||1);

  checarDesconto();
}

function renderParcelas(qt){
  const box = document.getElementById('parc-box'); if(!box) return;
  qt = +qt || 0;
  if(qt > 1){
    const cur = F.parcelas || 1;
    box.innerHTML = `<div class="fld"><label>Parcelas</label><select id="i-parc">${Array.from({length:qt},(_,i)=>`<option value="${i+1}" ${cur==(i+1)?'selected':''}>${i+1}x</option>`).join('')}</select></div>`;
    const pel = document.getElementById('i-parc');
    F.parcelas = +pel.value;
    pel.onchange = () => { F.parcelas = +pel.value; renderResumo(); };
  } else {
    box.innerHTML = '';
    F.parcelas = null;
  }
}

function savePagamento(){
  const parcEl = document.getElementById('i-parc');
  if(parcEl) F.parcelas = +parcEl.value;
  const formaSel = document.getElementById('i-forma');
  if(formaSel && formaSel.value) F.forma_pagamento = formaSel.value;
}

async function checarDesconto(){
  const note = document.getElementById('desc-note');
  const p = planoSel();
  const cpfNum = (F.cpf||'').replace(/\D/g,'');
  if(!p || cpfNum.length !== 11){ DESC=null; if(note) note.innerHTML=''; renderResumo(); return; }
  try{
    const r = await fetch(apiUrl(`/api/inscricao/${token}/desconto?plano_id=${p.id}&cpf=${cpfNum}`));
    const dd = await r.json();
    if(dd.tem_desconto && (dd.desconto_fotografia || dd.desconto_cerimonial)){
      DESC = dd;
      const totalDesc = (dd.desconto_fotografia||0)+(dd.desconto_cerimonial||0);
      const final = Math.max(0, (p.valor||0) - totalDesc);
      if(note) note.innerHTML = `<div style="background:#DCFCE7;color:#166534;border-radius:10px;padding:10px 12px;font-weight:600;">✓ Desconto aplicado${dd.nome?` (${esc(dd.nome)})`:''}: ${dd.desconto_fotografia?`fotografia ${brl(dd.desconto_fotografia)}`:''}${dd.desconto_cerimonial?`${dd.desconto_fotografia?' · ':''}cerimonial ${brl(dd.desconto_cerimonial)}`:''}. Total do plano: <b>${brl(final)}</b></div>`;
    } else {
      DESC=null; if(note) note.innerHTML='';
    }
  }catch(e){ DESC=null; if(note) note.innerHTML=''; }
  renderResumo();
}

/* =================== CUPOM DE DESCONTO =================== */
function renderCupom(){
  const box = document.getElementById('cupom-box'); if(!box) return;
  if(CUPOM){
    box.innerHTML = `
      <p class="sec-title" style="margin-bottom:8px;">Cupom de desconto</p>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;background:#DCFCE7;color:#166534;border:1px solid #86EFAC;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;">
        <span>🏷️ Cupom <b>${esc(CUPOM.codigo)}</b> aplicado${CUPOM.descricao?` — ${esc(CUPOM.descricao)}`:''}</span>
        <button type="button" id="cupom-remove" style="background:none;border:none;color:#166534;font-weight:700;cursor:pointer;text-decoration:underline;font-size:13px;padding:0;width:auto;">Remover</button>
      </div>`;
    document.getElementById('cupom-remove').onclick = removerCupom;
  } else {
    box.innerHTML = `
      <p class="sec-title" style="margin-bottom:8px;">Cupom de desconto</p>
      <div style="display:flex;gap:8px;">
        <input id="i-cupom" placeholder="Digite seu cupom" style="text-transform:uppercase;" autocomplete="off">
        <button type="button" class="btn btn-primary" id="cupom-aplicar" style="flex:0 0 auto;padding:12px 20px;font-size:14px;">Aplicar</button>
      </div>
      <div id="cupom-msg" style="margin-top:8px;font-size:13px;"></div>`;
    const inp = document.getElementById('i-cupom');
    inp.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); aplicarCupom(); } };
    document.getElementById('cupom-aplicar').onclick = aplicarCupom;
  }
}

async function aplicarCupom(){
  const inp = document.getElementById('i-cupom');
  const msg = document.getElementById('cupom-msg');
  const codigo = (inp && inp.value || '').trim().toUpperCase();
  if(!codigo){ if(msg) msg.innerHTML = `<span style="color:var(--vermelho);font-weight:600;">Digite um cupom.</span>`; return; }
  const btn = document.getElementById('cupom-aplicar');
  if(btn){ btn.disabled = true; btn.textContent = '…'; }
  try{
    const r = await fetch(apiUrl(`/api/cupom/validar?codigo=${encodeURIComponent(codigo)}&aplica_em=fotografia`));
    const dd = await r.json();
    if(dd && dd.valido){
      CUPOM = { codigo: dd.codigo || codigo, tipo: dd.tipo, valor: dd.valor, aplica_em: dd.aplica_em, descricao: dd.descricao || '' };
      renderCupom();
      renderResumo();
    } else {
      if(msg) msg.innerHTML = `<span style="color:var(--vermelho);font-weight:600;">${esc((dd&&dd.motivo)||'Cupom inválido.')}</span>`;
      if(btn){ btn.disabled = false; btn.textContent = 'Aplicar'; }
    }
  }catch(e){
    if(msg) msg.innerHTML = `<span style="color:var(--vermelho);font-weight:600;">Não foi possível validar o cupom. Tente de novo.</span>`;
    if(btn){ btn.disabled = false; btn.textContent = 'Aplicar'; }
  }
}

function removerCupom(){
  CUPOM = null;
  renderCupom();
  renderResumo();
}

/* =================== ETAPA 3: ADICIONAIS =================== */
function viewAdicionais(){
  const cat = DADOS.adicionais_catalogo || [];
  const eventos = DADOS.eventos || [];
  const jaEsc = {}; F.adicionais.forEach(x=>{ jaEsc[x.descricao.toLowerCase()] = x.quantidade; });

  const addHtml = cat.length ? cat.map(it=>{
    const q = jaEsc[it.descricao.toLowerCase()]||0;
    return `
      <div class="add" data-desc="${esc(it.descricao)}" data-valor="${it.valor}">
        <div class="a-info"><div class="a-n">${esc(it.descricao)}</div><div class="a-v">${brl(it.valor)}</div></div>
        <div class="stepper" data-target="add">
          <button type="button" class="st-minus" aria-label="Diminuir">−</button>
          <span class="st-n">${q}</span>
          <input type="hidden" class="q-add" value="${q}">
          <button type="button" class="st-plus" aria-label="Aumentar">+</button>
        </div>
      </div>`;
  }).join('') : '';

  const evHtml = eventos.length ? eventos.map(e=>{
    const prev = F.participacoes.find(x=>x.evento_fotografico_id==e.id) || {};
    const fam = prev.qtd_familiares != null ? prev.qtd_familiares : (e.qtd_familiares||0);
    const conv = prev.qtd_convidados != null ? prev.qtd_convidados : (e.qtd_convidados||0);
    return `
      <div class="ev" data-ev="${e.id}">
        <div class="ev-n">${esc(e.nome)}</div>
        <div class="grid2">
          ${e.pede_familiares?`<div><label>Familiares</label>
            <div class="stepper" data-target="fam">
              <button type="button" class="st-minus" aria-label="Diminuir">−</button>
              <span class="st-n">${fam}</span>
              <input type="hidden" class="q-fam" value="${fam}">
              <button type="button" class="st-plus" aria-label="Aumentar">+</button>
            </div></div>`:''}
          ${e.pede_convidados?`<div><label>Convidados</label>
            <div class="stepper" data-target="conv">
              <button type="button" class="st-minus" aria-label="Diminuir">−</button>
              <span class="st-n">${conv}</span>
              <input type="hidden" class="q-conv" value="${conv}">
              <button type="button" class="st-plus" aria-label="Aumentar">+</button>
            </div></div>`:''}
        </div>
      </div>`;
  }).join('') : '';

  const temAlgo = cat.length || eventos.length;

  card.innerHTML = `
    <h1>Adicionais</h1>
    <p class="sub">Produtos, serviços e convidados — tudo opcional.</p>
    <p class="erro" id="erro"></p>
    ${eventos.length?`<p class="sec-title">Familiares e convidados</p><p class="sec-hint">Informe quantas pessoas você levará em cada evento.</p>${evHtml}`:''}
    ${cat.length?`<p class="sec-title" style="margin-top:${eventos.length?'20px':'0'};">Produtos e serviços</p><p class="sec-hint">O que você quiser além do plano.</p>${addHtml}`:''}
    ${!temAlgo?`<div class="empty-note">Nenhum adicional disponível para sua turma. Você pode seguir para a próxima etapa.</div>`:''}
    <div class="nav">
      <button class="btn btn-ghost" id="btn-back">Voltar</button>
      <button class="btn btn-primary" id="btn-next">Continuar</button>
    </div>`;

  // steppers +/- (produtos e eventos); atualiza resumo ao vivo
  document.querySelectorAll('#card .stepper').forEach(st=>{
    const nEl = st.querySelector('.st-n');
    const inp = st.querySelector('input');
    const setVal = (v)=>{ v = Math.max(0, v); nEl.textContent = v; inp.value = v; st.querySelector('.st-minus').disabled = (v<=0); saveAdicionais(); renderResumo(); };
    setVal(+inp.value||0);
    st.querySelector('.st-minus').onclick = () => setVal((+inp.value||0) - 1);
    st.querySelector('.st-plus').onclick  = () => setVal((+inp.value||0) + 1);
  });

  document.getElementById('btn-back').onclick = () => { STEP=1; render(); };
  document.getElementById('btn-next').onclick = () => {
    saveAdicionais();
    clearErro();
    STEP = 3; render();
  };
}

function saveAdicionais(){
  F.adicionais = [...document.querySelectorAll('.add')].map(el=>({
    descricao: el.dataset.desc,
    valor: +el.dataset.valor,
    quantidade: +(el.querySelector('.q-add')?.value || 0),
  })).filter(x=>x.quantidade>0);
  F.participacoes = [...document.querySelectorAll('.ev')].map(el=>({
    evento_fotografico_id: +el.dataset.ev,
    qtd_familiares: +(el.querySelector('.q-fam')?.value || 0),
    qtd_convidados: +(el.querySelector('.q-conv')?.value || 0),
  })).filter(x=>x.qtd_familiares>0 || x.qtd_convidados>0);
}

/* =================== ETAPA 4: CONTRATO =================== */
function viewContrato(){
  const p = planoSel();
  const contrato = p ? p.contrato : null;

  let inner;
  if(contrato){
    inner = `
      <p class="sec-title">Contrato — ${esc(contrato.nome)}</p>
      <p class="sec-hint">Leia com atenção e marque o aceite para continuar.</p>
      <div class="contrato-box">${esc(contrato.conteudo) || ('Contrato: '+esc(contrato.nome))}</div>
      <label class="aceite">
        <input type="checkbox" id="i-aceite" ${F.aceite_contrato?'checked':''}>
        <span>Li e aceito o contrato <b>${esc(contrato.nome)}</b> e concordo com os termos da minha formatura.</span>
      </label>`;
  } else {
    inner = `<div class="empty-note">Este plano não possui contrato a ser assinado nesta etapa. Você pode seguir para a confirmação.</div>`;
  }

  card.innerHTML = `
    <h1>Assinatura do contrato</h1>
    <p class="sub">Confirme o aceite dos termos do seu plano.</p>
    <p class="erro" id="erro"></p>
    ${inner}
    <div class="nav">
      <button class="btn btn-ghost" id="btn-back">Voltar</button>
      <button class="btn btn-primary" id="btn-next">Continuar</button>
    </div>`;

  const ac = document.getElementById('i-aceite');
  if(ac) ac.onchange = () => { F.aceite_contrato = ac.checked; };

  document.getElementById('btn-back').onclick = () => { STEP=2; render(); };
  document.getElementById('btn-next').onclick = () => {
    if(ac){ F.aceite_contrato = ac.checked; }
    if(contrato && !F.aceite_contrato){ showErro('É necessário aceitar o contrato para continuar.'); toast('Aceite o contrato para continuar.'); return; }
    clearErro();
    STEP = 4; render();
  };
}

/* =================== ETAPA 5: CONFIRMAÇÃO / LINK DE PAGAMENTO =================== */
function viewFinal(){
  const p = planoSel();
  const addTotal = F.adicionais.reduce((s,x)=> s + (x.valor||0)*(x.quantidade||0), 0);

  // Composição do plano: fotografia × cerimonial (defensivo)
  const valFoto = p ? (Number(p.valor_fotografia)||0) : 0;
  const valCerim = p ? (Number(p.valor_cerimonial)||0) : 0;
  const planoVal = p ? (Number(p.valor)||0) : 0;

  // Descontos por CPF
  const descFoto = DESC ? (Number(DESC.desconto_fotografia)||0) : 0;
  const descCerim = DESC ? (Number(DESC.desconto_cerimonial)||0) : 0;
  const descTotal = descFoto + descCerim;

  const subTotal = planoVal + addTotal;
  const cupomVal = cupomDesconto(valFoto, subTotal);
  const taxa = taxaBoleto(p);
  const total = Math.max(0, subTotal - descTotal - cupomVal) + taxa;
  const meioLbl = p ? (meioLabel(p, F.meio_pagamento) || formaLabel(F.forma_pagamento) || '—') : '—';

  const linhas = [];
  if(p){
    linhas.push(`<div class="r-line"><span class="l"><b>${esc(p.nome)}</b></span><span class="v">${brl(planoVal)}</span></div>`);
    // Fotografia × Cerimonial (quando a API trouxer a composição)
    if(valFoto) linhas.push(`<div class="r-line"><span class="l">&nbsp;&nbsp;Fotografia</span><span class="v" style="font-weight:600;">${brl(valFoto)}</span></div>`);
    if(valCerim) linhas.push(`<div class="r-line"><span class="l">&nbsp;&nbsp;Cerimonial</span><span class="v" style="font-weight:600;">${brl(valCerim)}</span></div>`);
  }
  // Adicionais
  F.adicionais.filter(x=>x.quantidade>0).forEach(x=>{
    linhas.push(`<div class="r-line"><span class="l">${esc(x.descricao)} × ${x.quantidade}</span><span class="v">${brl(x.valor*x.quantidade)}</span></div>`);
  });
  // Descontos por CPF (detalhados)
  if(descFoto>0) linhas.push(`<div class="r-line"><span class="l">Desconto fotografia (CPF)</span><span class="v" style="color:#166534;">−${brl(descFoto)}</span></div>`);
  if(descCerim>0) linhas.push(`<div class="r-line"><span class="l">Desconto cerimonial (CPF)</span><span class="v" style="color:#166534;">−${brl(descCerim)}</span></div>`);
  if(cupomVal>0 && CUPOM) linhas.push(`<div class="r-line"><span class="l">Cupom ${esc(CUPOM.codigo)}</span><span class="v" style="color:#166534;">−${brl(cupomVal)}</span></div>`);
  if(taxa>0) linhas.push(`<div class="r-line"><span class="l">Taxa de boleto</span><span class="v">${brl(taxa)}</span></div>`);
  linhas.push(`<div class="r-line"><span class="l">Pagamento</span><span class="v">${esc(meioLbl)}${F.parcelas&&F.parcelas>1?` · ${F.parcelas}x`:''}</span></div>`);

  // Brindes inclusos + itens exclusivos da comissão
  const brindes = brindesDoPlano(p);
  const comissaoItens = itensComissao(p);
  const chk = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;color:#16A34A;flex:0 0 auto;margin-top:2px;"><path d="M20 6 9 17l-5-5"/></svg>';
  let brindesHtml = '';
  if(brindes.length || comissaoItens.length){
    brindesHtml = `<div class="fb-t" style="margin-top:16px;">Inclusos no seu plano</div>
      <ul style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;">
      ${brindes.map(b=>`<li style="display:flex;gap:8px;font-size:13.5px;color:var(--cinza2);">${chk}<span>${esc(b)}</span></li>`).join('')}
      ${comissaoItens.map(b=>`<li style="display:flex;gap:8px;font-size:13.5px;color:var(--azul-esc);font-weight:600;">${chk}<span>${esc(b)} <span style="font-size:11px;background:#DBEAFE;color:var(--azul-esc);padding:1px 7px;border-radius:6px;">comissão</span></span></li>`).join('')}
      </ul>`;
  }

  // Escolha de parcelas entre as opções do plano (no passo de revisão)
  const selMeio = (p && p.meios_pagamento && F.meio_pagamento) ? p.meios_pagamento.find(m=>m.meio===F.meio_pagamento) : null;
  const maxParc = selMeio ? (+selMeio.qt_parcela||1) : 1;
  let parcHtml = '';
  if(maxParc > 1){
    const cur = F.parcelas || 1;
    const valorParcela = total>0 ? total / cur : 0;
    parcHtml = `<div class="fld" style="margin-top:16px;margin-bottom:0;"><label>Número de parcelas</label>
      <select id="i-parc-final">${Array.from({length:maxParc},(_,i)=>`<option value="${i+1}" ${cur==(i+1)?'selected':''}>${i+1}x de ${brl(total/(i+1))}</option>`).join('')}</select>
      <div class="p-sub" id="parc-info" style="margin-top:6px;font-size:12px;color:var(--cinza);">${cur}x de ${brl(valorParcela)}</div></div>`;
  }

  card.innerHTML = `
    <h1>Confirme seu pedido</h1>
    <p class="sub">Revise tudo antes de finalizar. Seu link de pagamento será gerado após a confirmação.</p>
    <p class="erro" id="erro"></p>

    <div class="final-box">
      <div class="fb-t">Resumo</div>
      ${linhas.join('')}
      ${brindesHtml}
      ${parcHtml}
      <div class="r-total"><span class="l">Total</span><span class="v">${brl(total)}</span></div>
    </div>

    <div class="pay-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
      <div class="ph-t">Assim que você confirmar, <b>seu link de pagamento será gerado</b> e enviado no seu WhatsApp (${esc(F.celular||'—')}).</div>
    </div>

    <div class="nav">
      <button class="btn btn-ghost" id="btn-back">Voltar</button>
      <button class="btn btn-primary" id="btn-enviar">Confirmar cadastro</button>
    </div>
    <p class="muted">Seus dados ficam disponíveis para a comissão e a Ventus.</p>`;

  const parcSel = document.getElementById('i-parc-final');
  if(parcSel){
    parcSel.onchange = () => {
      F.parcelas = +parcSel.value;
      const info = document.getElementById('parc-info');
      if(info) info.textContent = `${F.parcelas}x de ${brl(total/F.parcelas)}`;
      renderResumo();
    };
  }

  document.getElementById('btn-back').onclick = () => { STEP=3; render(); };
  document.getElementById('btn-enviar').onclick = enviar;
}

/* =================== SUBMISSÃO =================== */
async function enviar(){
  const btn = document.getElementById('btn-enviar');
  const p = planoSel();

  const emailNorm = (F.email||'').trim().toLowerCase();
  if(!F.nome){ toast('Informe seu nome.'); STEP=0; setTimeout(render,50); return; }
  if(!emailNorm || (F.email_confirma && emailNorm !== (F.email_confirma||'').trim().toLowerCase())){ toast('Verifique seu e-mail (confirmação não bate).'); STEP=0; setTimeout(render,50); return; }
  if(!F.plano_id){ toast('Escolha um plano.'); STEP=1; setTimeout(render,50); return; }
  if(p && p.contrato && !F.aceite_contrato){ toast('É necessário aceitar o contrato.'); STEP=3; setTimeout(render,50); return; }

  const body = {
    nome: F.nome,
    celular: F.celular,
    email: (F.email||'').trim(),
    cpf: F.cpf,
    curso: F.curso,
    ano_formatura: F.ano_formatura || null,
    altura: F.altura,
    peso: F.peso,
    calcado: F.calcado,
    plus_size: F.plus_size,
    num_calca: F.num_calca || '',
    plano_id: p ? p.id : null,
    meio_pagamento: F.meio_pagamento || null,
    forma_pagamento: F.forma_pagamento || F.meio_pagamento || null,
    parcelas: F.parcelas || null,
    aceite_contrato: !!F.aceite_contrato,
    observacoes: F.observacoes || '',
    participacoes: F.participacoes,
    adicionais: F.adicionais,
  };

  btn.textContent = 'Enviando…'; btn.disabled = true;
  let r;
  try{
    r = await fetch(apiUrl('/api/inscricao/'+token), {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  }catch(e){ r = {ok:false}; }
  if(!r.ok){
    showErro('Erro ao enviar. Tente de novo.');
    btn.textContent = 'Confirmar cadastro'; btn.disabled = false; return;
  }

  // registra uso do cupom (não bloqueia o fluxo se falhar)
  if(CUPOM && CUPOM.codigo){
    try{
      await fetch(apiUrl('/api/cupom/usar'), {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codigo: CUPOM.codigo})});
    }catch(e){ /* ignora */ }
  }

  stepsEl.classList.add('hide');
  resumoEl.classList.add('hide');
  document.getElementById('wrap').style.gridTemplateColumns = '1fr';
  card.classList.add('center-card');
  card.innerHTML = `<div class="ok">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h1>Cadastro confirmado!</h1>
    <p class="sub">Prontinho, ${esc((F.nome||'').split(' ')[0])}. ${p&&p.contrato&&F.aceite_contrato?'Contrato aceito. ':''}A comissão já vê seu cadastro.</p>
    <div class="pay-hint" style="margin-top:8px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
      <div class="ph-t">Em breve enviamos o <b>link de pagamento</b> no seu WhatsApp.</div>
    </div>
  </div>`;
  window.scrollTo({top:0, behavior:'smooth'});
}
</script>
