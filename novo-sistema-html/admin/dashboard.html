<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/png" href="/assets/img/icon.png">
<link rel="apple-touch-icon" href="/assets/img/icon-app.png">
<meta name="theme-color" content="#0A2540">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Ventus Formaturas</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('ventus-theme')||'light')}catch(e){}</script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../assets/js/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
  .page-head { display:flex; align-items:center; gap:16px; margin-bottom:24px; }
  .page-head .chip { width:52px; height:52px; border-radius:15px; flex:none; display:grid; place-items:center; background:linear-gradient(140deg,var(--primary-500),var(--primary-700)); color:#fff; box-shadow:0 8px 20px -8px rgba(37,99,235,.6); }
  .page-head .chip svg { width:26px; height:26px; }
  .page-head h1 { font-size:24px; font-weight:800; letter-spacing:-.02em; margin:0; color:var(--gray-900); }
  .page-head p { margin:3px 0 0; color:var(--gray-500); font-size:13.5px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:20px; }
  .kpi { background:var(--surface); border:1px solid var(--gray-200); border-radius:16px; padding:18px 20px; box-shadow:var(--shadow-sm); }
  .kpi .top { display:flex; align-items:center; justify-content:space-between; }
  .kpi .ic { width:38px; height:38px; border-radius:11px; display:grid; place-items:center; background:var(--primary-50); color:var(--primary-700); }
  .kpi .l { font-size:12.5px; color:var(--gray-500); font-weight:600; margin-top:12px; }
  .kpi .v { font-size:26px; font-weight:800; letter-spacing:-.02em; color:var(--gray-900); margin-top:2px; }
  .kpi .s { font-size:12px; color:var(--gray-400); margin-top:2px; }
  .kpi.verde .ic{background:#DCFCE7;color:#16A34A;} .kpi.verde .v{color:#16A34A;}
  .kpi.laranja .ic{background:#FEF3C7;color:#D97706;} .kpi.laranja .v{color:#D97706;}
  .cols { display:grid; grid-template-columns:1.6fr 1fr; gap:18px; align-items:start; }
  .col { display:flex; flex-direction:column; gap:18px; min-width:0; }
  @media (max-width:900px){ .cols{grid-template-columns:1fr;} }
  .panel { background:var(--surface); border:1px solid var(--gray-200); border-radius:16px; box-shadow:var(--shadow-sm); overflow:hidden; }
  .panel-head { padding:15px 20px; border-bottom:1px solid var(--gray-100); font-size:14.5px; font-weight:700; color:var(--gray-900); display:flex; align-items:center; gap:9px; }
  .panel-body { padding:20px; }
  table.tbl { width:100%; border-collapse:collapse; font-size:14px; }
  table.tbl th { text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--gray-400); font-weight:700; padding:12px 20px; background:var(--gray-50); border-bottom:1px solid var(--gray-100); white-space:nowrap; }
  table.tbl td { padding:13px 20px; border-bottom:1px solid var(--gray-100); color:var(--gray-700); }
  table.tbl tr:last-child td { border-bottom:none; } table.tbl tbody tr:hover td { background:var(--gray-50); }
  table.tbl td.num, table.tbl th.num { text-align:right; font-variant-numeric:tabular-nums; } table.tbl td.nome{font-weight:600;color:var(--gray-900);}
  .prog { height:7px; background:var(--gray-100); border-radius:999px; overflow:hidden; min-width:70px; }
  .prog > div { height:100%; background:linear-gradient(90deg,var(--primary-500),var(--success)); border-radius:999px; }
  .evt { display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--gray-100); }
  .evt:last-child{border-bottom:none;} .evt .d{width:46px;height:46px;border-radius:12px;background:var(--primary-50);color:var(--primary-700);display:grid;place-items:center;flex:none;text-align:center;line-height:1;}
  .evt .d b{font-size:16px;font-weight:800;display:block;} .evt .d span{font-size:10px;text-transform:uppercase;}
  .evt .info strong{font-size:14px;color:var(--gray-900);display:block;} .evt .info span{font-size:12.5px;color:var(--gray-500);}
  .pop { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--gray-100); font-size:14px;} .pop:last-child{border-bottom:none;}
  .pop .n{font-weight:600;color:var(--gray-900);} .pop .b{font-size:12px;font-weight:700;color:var(--primary-700);background:var(--primary-50);padding:3px 10px;border-radius:999px;}
  .empty{text-align:center;color:var(--gray-400);padding:26px 0;font-size:13px;}
  /* Financeiro — barra clara em vez de rosca */
  .fin-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .fin-l{font-size:12.5px;color:var(--gray-500);font-weight:600;}
  .fin-big{font-size:28px;font-weight:800;letter-spacing:-.02em;color:#16A34A;}
  .fin-pct{font-size:14px;font-weight:800;color:var(--primary-700);background:var(--primary-50);padding:5px 12px;border-radius:999px;flex:none;}
  .fin-bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--gray-100);margin-bottom:16px;}
  .fin-seg{height:100%;transition:width .4s;} .fin-seg.verde{background:#16A34A;} .fin-seg.laranja{background:#F59E0B;}
  .fin-rows{display:flex;flex-direction:column;}
  .fin-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-size:14px;border-bottom:1px solid var(--gray-100);}
  .fin-row span{color:var(--gray-600);display:flex;align-items:center;gap:8px;} .fin-row b{color:var(--gray-900);}
  .fin-row.tot{margin-top:4px;padding-top:12px;border-top:1px solid var(--gray-200);border-bottom:none;} .fin-row.tot b{font-size:16px;}
  .fdot{width:10px;height:10px;border-radius:3px;display:inline-block;} .fdot.verde{background:#16A34A;} .fdot.laranja{background:#F59E0B;}
  /* Responsivo */
  @media (max-width:900px){ .grid2{grid-template-columns:1fr;} }
  @media (max-width:640px){
    .app-content{padding:16px;}
    .page-head{gap:12px;margin-bottom:18px;} .page-head .chip{width:44px;height:44px;border-radius:13px;} .page-head .chip svg{width:22px;height:22px;} .page-head h1{font-size:20px;}
    .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
    .kpi{padding:14px 16px;} .kpi .v{font-size:22px;}
    .fin-big{font-size:24px;}
    .panel-head{padding:14px 16px;} .panel-body{padding:16px;}
    table.tbl th, table.tbl td{padding:11px 14px;}
  }
  /* Barra de filtros compacta (campos modestos, botões agrupados à direita e iguais) */
  .filtros{ display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; padding:16px 20px; }
  .filtros .f{ display:flex; flex-direction:column; gap:6px; }
  .filtros .f label{ font-size:12px; font-weight:600; color:var(--gray-600); }
  .filtros .f input, .filtros .f select{ padding:9px 11px; border:1px solid var(--gray-300); border-radius:9px; font-size:13.5px; font-family:inherit; background:var(--surface); color:var(--gray-900); outline:none; transition:.15s; }
  .filtros .f input:focus, .filtros .f select:focus{ border-color:var(--primary-500); box-shadow:0 0 0 3px var(--primary-100); }
  .filtros .f input[type=date]{ width:158px; }
  .filtros .f select{ min-width:158px; }
  .filtros .acoes{ display:flex; gap:8px; margin-left:auto; }
  .filtros .acoes .btn{ min-width:112px; justify-content:center; }
  @media (max-width:640px){
    .filtros .f{ flex:1 1 45%; } .filtros .f input, .filtros .f select{ width:100%; min-width:0; }
    .filtros .acoes{ margin-left:0; width:100%; } .filtros .acoes .btn{ flex:1; }
  }
</style>
</head>
<body>
<aside id="admin-sidebar" class="sidebar"></aside>
<div class="app-shell">
  <header class="topbar">
    <div class="topbar-search"><i data-lucide="search" class="w-4 h-4"></i><input type="text" placeholder="Buscar turma, aluno, OS, contrato…"></div>
  </header>
  <main class="app-content">
    <div class="page-head">
      <div class="chip"><i data-lucide="layout-dashboard"></i></div>
      <div><h1>Painel</h1><p>Resumo geral das turmas, formandos e financeiro.</p></div>
    </div>

    <div class="panel" style="margin-bottom:18px;">
      <div class="filtros">
        <div class="f"><label>Previsão formatura (de)</label><input type="date" id="fil-di"></div>
        <div class="f"><label>Previsão formatura (até)</label><input type="date" id="fil-df"></div>
        <div class="f"><label>Situação da turma</label><select id="fil-sit"><option value="">Todas</option><option value="ativa">Ativa</option><option value="inativa">Inativa</option></select></div>
        <div class="f"><label>Situação eventos</label><select id="fil-sev"><option value="">Todas</option><option value="previsto">Previsto</option><option value="confirmado">Confirmado</option><option value="realizado">Realizado</option><option value="cancelado">Cancelado</option></select></div>
        <div class="f"><label>Possui cerimonial</label><select id="fil-cer"><option value="">Todas</option><option value="1">Sim</option><option value="0">Não</option></select></div>
        <div class="f"><label>Vendedor</label><select id="fil-vend"><option value="">Todos</option></select></div>
        <div class="f"><label>Tipo de boleto</label><select id="fil-tb"><option value="">Tipo de boleto (todos)</option></select></div>
        <div class="f"><label>Assinatura (de)</label><input type="date" id="fil-ai"></div>
        <div class="f"><label>Assinatura (até)</label><input type="date" id="fil-af"></div>
        <div class="acoes">
          <button class="btn btn-primary" onclick="carregar()"><i data-lucide="filter" class="w-4 h-4"></i> Filtrar</button>
          <button class="btn btn-secondary" onclick="limparFiltros()">Limpar</button>
        </div>
      </div>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="panel" style="margin-bottom:18px;">
      <div class="panel-head"><span style="display:flex;align-items:center;gap:9px;"><i data-lucide="bar-chart-3" style="width:16px;height:16px;color:var(--primary-600);"></i> Indicadores <span style="font-size:12px;color:var(--gray-400);font-weight:500;">(referência: data de assinatura)</span></span></div>
      <div class="panel-body"><div class="kpis" id="indicadores"></div></div>
    </div>

    <div class="cols">
      <div class="col">
        <div class="panel">
          <div class="panel-head"><i data-lucide="users-round" style="width:17px;height:17px;color:var(--primary-600);"></i> Turmas</div>
          <div style="overflow-x:auto;"><table class="tbl">
            <thead><tr><th>Turma</th><th class="num">Formandos</th><th>Preenchimento</th><th class="num">Contratado</th><th class="num">Recebido</th></tr></thead>
            <tbody id="turmas-tbody"></tbody></table></div>
        </div>
        <div class="panel">
          <div class="panel-head"><i data-lucide="calendar" style="width:17px;height:17px;color:var(--primary-600);"></i> Próximos eventos</div>
          <div class="panel-body" id="eventos"></div>
        </div>
      </div>
      <div class="col">
        <div class="panel">
          <div class="panel-head"><i data-lucide="wallet" style="width:17px;height:17px;color:var(--primary-600);"></i> Financeiro</div>
          <div class="panel-body">
            <div class="fin-head">
              <div><div class="fin-l">Recebido</div><div class="fin-big" id="fin-receb">R$ 0,00</div></div>
              <div class="fin-pct" id="fin-pct">0%</div>
            </div>
            <div class="fin-bar"><div class="fin-seg verde" id="fin-seg-r"></div><div class="fin-seg laranja" id="fin-seg-a"></div></div>
            <div class="fin-rows">
              <div class="fin-row"><span><i class="fdot verde"></i> Recebido</span><b id="fin-r2">R$ 0,00</b></div>
              <div class="fin-row"><span><i class="fdot laranja"></i> A receber</span><b id="fin-a2">R$ 0,00</b></div>
              <div class="fin-row tot"><span>Contratado (total)</span><b id="fin-c2">R$ 0,00</b></div>
            </div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-head"><i data-lucide="package-2" style="width:17px;height:17px;color:var(--primary-600);"></i> Planos mais escolhidos</div>
          <div class="panel-body" id="planos"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/app.js"></script>
<script>
lucide.createIcons();
const brl = v => 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const MES = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];

initPainel();
async function initPainel(){
  try{ const r=await fetch(apiUrl('/api/painel/opcoes')); const o=await r.json();
    document.getElementById('fil-vend').innerHTML='<option value="">Todos</option>'+(o.vendedores||[]).map(v=>`<option value="${v.id}">${v.nome}</option>`).join('');
    document.getElementById('fil-tb').innerHTML='<option value="">Tipo de boleto (todos)</option>'+(o.tipos_boleto||[]).map(t=>`<option value="${t[0]}">${t[1]}</option>`).join('');
  }catch(e){}
  carregar();
}
window.limparFiltros = () => { ['fil-di','fil-df','fil-sit','fil-sev','fil-cer','fil-vend','fil-tb','fil-ai','fil-af'].forEach(k=>document.getElementById(k).value=''); carregar(); };
function queryFiltros(){
  const p = new URLSearchParams();
  const G=id=>document.getElementById(id);
  if(G('fil-di').value) p.set('previsao_inicio',G('fil-di').value);
  if(G('fil-df').value) p.set('previsao_fim',G('fil-df').value);
  if(G('fil-sit').value) p.set('situacao',G('fil-sit').value);
  if(G('fil-sev').value) p.set('situacao_evento',G('fil-sev').value);
  if(G('fil-cer').value) p.set('possui_cerimonial', G('fil-cer').value==='1'?'true':'false');
  if(G('fil-vend').value) p.set('vendedor_id',G('fil-vend').value);
  if(G('fil-tb').value) p.set('tipo_boleto',G('fil-tb').value);
  if(G('fil-ai').value) p.set('assinatura_inicio',G('fil-ai').value);
  if(G('fil-af').value) p.set('assinatura_fim',G('fil-af').value);
  const q=p.toString(); return q?('?'+q):'';
}
async function carregar(){
  const r = await fetch(apiUrl('/api/painel'+queryFiltros())); const d = await r.json();
  const f = d.financeiro, al = d.alunos;
  const taxa = al.total ? Math.round(al.preenchidos/al.total*100) : 0;
  document.getElementById('kpis').innerHTML = `
    ${kpi('','users-round','Turmas', d.turmas, '')}
    ${kpi('','user-check','Formandos', al.total, `${al.preenchidos} preencheram (${taxa}%)`)}
    ${kpi('','file-text','Contratado', brl(f.contratado), 'soma dos planos escolhidos')}
    ${kpi('verde','banknote','Recebido', brl(f.recebido), '')}
    ${kpi('laranja','clock','A receber', brl(f.a_receber), 'parcelas em aberto')}`;

  // indicadores (doc Revisão 2)
  const ind = d.indicadores || {};
  document.getElementById('indicadores').innerHTML = `
    ${kpi('','shopping-cart','Vendas', brl(ind.vendas), 'contratos + produtos/serviços')}
    ${kpi('','file-signature','Contratos', brl(ind.contratos_valor), `${ind.contratos_qtd||0} contrato(s)`)}
    ${kpi('','utensils','Cerimonial', brl(ind.cerimonial), '')}
    ${kpi('','package','Produtos/Serviços', brl(ind.produtos_servicos), '')}
    ${kpi('','receipt','Ticket médio/contrato', brl(ind.ticket_medio_contrato), '')}
    ${kpi('','trending-up','LTV', (ind.ltv_meses||0).toFixed(1)+'x', 'prazo médio (parcelas)')}
    ${kpi('','credit-card','Ticket médio/parcela', brl(ind.ticket_medio_parcela), '')}`;
  lucide.createIcons();

  // turmas
  const tb = document.getElementById('turmas-tbody');
  tb.innerHTML = d.turmas_lista.length ? d.turmas_lista.map(t=>{
    const pct = t.alunos ? Math.round(t.preenchidos/t.alunos*100) : 0;
    return `<tr onclick="location.href='turma-detalhe.html?id=${t.id}'" style="cursor:pointer;">
      <td class="nome">${t.nome}<div style="font-size:12px;color:var(--gray-400);font-weight:400;">${t.instituicao||''}</div></td>
      <td class="num">${t.alunos}</td>
      <td><div style="display:flex;align-items:center;gap:8px;"><div class="prog"><div style="width:${pct}%"></div></div><span style="font-size:12px;color:var(--gray-500);">${t.preenchidos}/${t.alunos}</span></div></td>
      <td class="num">${brl(t.contratado)}</td><td class="num" style="color:#16A34A;font-weight:600;">${brl(t.recebido)}</td></tr>`;
  }).join('') : `<tr><td colspan="5"><div class="empty">Nenhuma turma cadastrada ainda.</div></td></tr>`;

  // financeiro — barra clara (recebido x a receber sobre o contratado)
  const totalFin = f.contratado || (f.recebido + f.a_receber) || 1;
  const pctR = Math.round((f.recebido/totalFin)*100);
  document.getElementById('fin-receb').textContent = brl(f.recebido);
  document.getElementById('fin-pct').textContent = pctR + '% recebido';
  document.getElementById('fin-seg-r').style.width = (f.recebido/totalFin*100) + '%';
  document.getElementById('fin-seg-a').style.width = (f.a_receber/totalFin*100) + '%';
  document.getElementById('fin-r2').textContent = brl(f.recebido);
  document.getElementById('fin-a2').textContent = brl(f.a_receber);
  document.getElementById('fin-c2').textContent = brl(f.contratado);

  // eventos
  document.getElementById('eventos').innerHTML = d.eventos_proximos.length ? d.eventos_proximos.map(e=>{
    const [y,m,dia]=e.data.split('-');
    return `<div class="evt"><div class="d"><b>${dia}</b><span>${MES[+m-1]}</span></div>
      <div class="info"><strong>${e.evento}</strong><span>${e.turma||''} · ${e.situacao}</span></div></div>`;
  }).join('') : `<div class="empty">Nenhum evento futuro agendado.</div>`;

  // planos
  document.getElementById('planos').innerHTML = d.planos_populares.length ? d.planos_populares.map(p=>
    `<div class="pop"><span class="n">${p.nome}</span><span class="b">${p.escolhas} formando(s)</span></div>`).join('') : `<div class="empty">Nenhum plano escolhido ainda.</div>`;
}
function kpi(cls,ic,l,v,s){ return `<div class="kpi ${cls}"><div class="top"><div class="ic"><i data-lucide="${ic}"></i></div></div><div class="l">${l}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`; }
</script>
</body>
</html>
