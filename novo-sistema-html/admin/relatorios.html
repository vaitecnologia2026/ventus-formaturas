<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/png" href="/assets/img/icon.png">
<meta name="theme-color" content="#0A2540">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatórios — Ventus</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('ventus-theme')||'light')}catch(e){}</script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../assets/js/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
  .page-head { display:flex; align-items:center; gap:16px; margin-bottom:22px; }
  .page-head .chip { width:52px; height:52px; border-radius:15px; flex:none; display:grid; place-items:center; background:linear-gradient(140deg,var(--primary-500),var(--primary-700)); color:#fff; box-shadow:0 8px 20px -8px rgba(37,99,235,.6); }
  .page-head .chip svg { width:26px; height:26px; }
  .page-head h1 { font-size:24px; font-weight:800; letter-spacing:-.02em; margin:0; color:var(--gray-900); }
  .page-head p { margin:3px 0 0; color:var(--gray-500); font-size:13.5px; }
  .panel { background:var(--surface); border:1px solid var(--gray-200); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); overflow:hidden; margin-bottom:18px; }
  .panel-head { padding:15px 22px; border-bottom:1px solid var(--gray-100); font-size:14.5px; font-weight:700; color:var(--gray-900); display:flex; align-items:center; justify-content:space-between; gap:9px; }
  .panel-head .count{font-size:12px;font-weight:700;color:var(--primary-700);background:var(--primary-50);padding:3px 11px;border-radius:999px;}
  .add-bar { display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; padding:18px 22px; }
  .add-bar .fld { display:flex; flex-direction:column; gap:6px; } .add-bar .fld.grow{flex:1;min-width:200px;}
  .add-bar label { font-size:12.5px; font-weight:600; color:var(--gray-600); }
  .add-bar select { padding:10px 12px; border:1px solid var(--gray-300); border-radius:10px; background:var(--surface); color:var(--gray-900); font-size:14px; font-family:inherit; outline:none; }
  .add-bar select:focus { border-color:var(--primary-500); box-shadow:0 0 0 3px var(--primary-100); }
  .tbl-wrap { overflow-x:auto; }
  table.tbl { width:100%; border-collapse:collapse; font-size:13.5px; }
  table.tbl th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--gray-400); font-weight:700; padding:12px 18px; background:var(--gray-50); border-bottom:1px solid var(--gray-100); white-space:nowrap; }
  table.tbl td { padding:11px 18px; border-bottom:1px solid var(--gray-100); color:var(--gray-700); white-space:nowrap; } table.tbl tr:last-child td{border-bottom:none;} table.tbl tbody tr:hover td{background:var(--gray-50);}
  table.tbl td:first-child{font-weight:600;color:var(--gray-900);}
  .empty { text-align:center; color:var(--gray-500); padding:48px 20px; } .empty svg{width:34px;height:34px;color:var(--gray-300);margin:0 auto 10px;display:block;}

  /* ===== Responsivo mobile (passada geral) ===== */
  @media (max-width:640px){
    .app-content{padding:16px;}
    .page-head{gap:12px;margin-bottom:18px;}
    .page-head .chip{width:44px;height:44px;border-radius:13px;}
    .page-head .chip svg{width:22px;height:22px;}
    .page-head h1{font-size:20px;}
    .crumb{font-size:12px;}
    .form-grid{grid-template-columns:1fr;}
    .med-grid{grid-template-columns:1fr;}
    .add-bar{padding:16px;gap:12px;}
    .add-bar .fld{flex:1 1 100%;min-width:0;}
    .add-bar input,.add-bar select,.add-bar textarea{width:100%!important;}
    .panel-head{padding:14px 16px;}
    .panel-body{padding:16px;}
    .segmented{width:100%;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;}
    .segmented .tab{white-space:nowrap;flex:0 0 auto;}
    table.tbl th, table.tbl td{padding:11px 14px;}
    .form-actions{flex-direction:column;align-items:stretch;}
    .form-actions .btn{width:100%;justify-content:center;}
  }
</style>
</head>
<body>
<aside id="admin-sidebar" class="sidebar"></aside>
<div class="app-shell">
  <header class="topbar">
    <div style="flex:1"></div>
    <div class="flex items-center gap-3"></div>
  </header>
  <main class="app-content">
    <div class="page-head">
      <div class="chip"><i data-lucide="file-text"></i></div>
      <div><h1>Relatórios</h1><p>Gere e exporte relatórios de alunos, financeiro e pagamentos.</p></div>
    </div>

    <div class="panel">
      <div class="add-bar">
        <div class="fld grow"><label>Relatório</label><select id="r-tipo"></select></div>
        <div class="fld grow"><label>Turma (filtro)</label><select id="r-turma"></select></div>
        <div class="fld"><button class="btn btn-primary" id="r-gerar"><i data-lucide="play" class="w-4 h-4"></i> Gerar</button></div>
        <div class="fld"><button class="btn btn-secondary" id="r-csv"><i data-lucide="download" class="w-4 h-4"></i> Exportar CSV</button></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><span id="r-nome">Relatório</span><span class="count" id="r-count">0 linhas</span></div>
      <div class="tbl-wrap"><table class="tbl"><thead id="r-thead"></thead><tbody id="r-tbody"></tbody></table></div>
    </div>
  </main>
</div>

<script src="../assets/js/app.js"></script>
<script>
lucide.createIcons();
const $ = s => document.querySelector(s);
let atual = null;

init();
async function init(){
  const r = await fetch(apiUrl('/api/relatorios/opcoes')); const d = await r.json();
  $('#r-tipo').innerHTML = d.relatorios.map(x=>`<option value="${x.tipo}">${x.nome}</option>`).join('');
  $('#r-turma').innerHTML = `<option value="">Todas as turmas</option>` + d.turmas.map(t=>`<option value="${t.id}">${t.nome}</option>`).join('');
  $('#r-gerar').onclick = gerar;
  $('#r-csv').onclick = exportarCSV;
  gerar();
}
async function gerar(){
  const tipo = $('#r-tipo').value; const turma = $('#r-turma').value;
  const r = await fetch(apiUrl(`/api/relatorios/${tipo}`+(turma?`?turma_id=${turma}`:''))); atual = await r.json();
  $('#r-nome').textContent = atual.nome;
  $('#r-count').textContent = atual.linhas.length + ' linha(s)';
  $('#r-thead').innerHTML = '<tr>' + atual.colunas.map(c=>`<th>${c}</th>`).join('') + '</tr>';
  if(!atual.linhas.length){ $('#r-tbody').innerHTML = `<tr><td colspan="${atual.colunas.length||1}"><div class="empty"><i data-lucide="file-search"></i>Sem dados para este relatório.</div></td></tr>`; lucide.createIcons(); return; }
  $('#r-tbody').innerHTML = atual.linhas.map(l=>'<tr>'+l.map(c=>`<td>${c===''?'—':c}</td>`).join('')+'</tr>').join('');
}
function exportarCSV(){
  if(!atual || !atual.linhas.length){ vtAlert('Gere um relatório primeiro.'); return; }
  const esc = v => `"${String(v).replace(/"/g,'""')}"`;
  const linhas = [atual.colunas.map(esc).join(';'), ...atual.linhas.map(l=>l.map(esc).join(';'))];
  const blob = new Blob(['﻿'+linhas.join('\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = (atual.nome||'relatorio').toLowerCase().replace(/[^a-z0-9]+/g,'-') + '.csv';
  a.click();
}
</script>
</body>
</html>
