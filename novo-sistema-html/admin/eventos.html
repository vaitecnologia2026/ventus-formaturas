<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/png" href="/assets/img/icon.png">
<link rel="apple-touch-icon" href="/assets/img/icon-app.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A2540">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Eventos — Ventus</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
<script src="../assets/js/config.js"></script>
<style>
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--gray-200); border-radius:12px; overflow:hidden; }
.cal-day-head { background:var(--gray-50); padding:10px; text-align:center; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--gray-500); }
.cal-cell { background:var(--surface,#fff); min-height:110px; padding:8px; position:relative; }
.cal-cell.other { background:var(--gray-50); }
.cal-cell.other .cal-num { color:var(--gray-400); }
.cal-cell.today { background:var(--primary-50); }
.cal-num { font-size:13px; font-weight:600; color:var(--gray-900); }
.cal-today-mark { display:inline-grid; place-items:center; width:24px; height:24px; border-radius:50%; background:var(--primary-600); color:#fff; font-size:12px; font-weight:700; }
.cal-evt { display:block; font-size:11px; padding:3px 6px; border-radius:4px; margin-top:4px; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; background:var(--warning-bg,#FEF3C7); color:var(--warning-fg,#92400E); text-decoration:none; }
.cal-evt:hover { filter:brightness(.97); }
.cal-list { display:flex; flex-direction:column; gap:2px; }
.cal-list-day { padding:12px 4px 6px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--gray-500); border-bottom:1px solid var(--gray-200); }
.cal-list-item { display:flex; align-items:center; gap:12px; padding:11px 8px; border-radius:8px; text-decoration:none; color:inherit; }
.cal-list-item:hover { background:var(--gray-50); }
.cal-list-chip { width:12px; height:12px; border-radius:4px; flex:none; background:var(--primary-600); }
.cal-list-txt { flex:1; min-width:0; font-size:14px; font-weight:600; color:var(--gray-900); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cal-list-sub { font-size:12px; color:var(--gray-500); }
.cal-view { display:none; } .cal-view.active { display:block; }
</style>
</head>
<body>
<aside id="admin-sidebar" class="sidebar"></aside>

<div class="app-shell">
  <header class="topbar">
    <div style="flex:1"></div>
    <div class="flex gap-2 items-center">
      <button class="btn btn-secondary btn-sm" id="cal-btn-reload"><i data-lucide="refresh-cw" class="w-4 h-4"></i> Recarregar</button>
      <a class="btn btn-primary btn-sm" href="turmas.html"><i data-lucide="plus" class="w-4 h-4"></i> Novo evento (via turma)</a>
    </div>
  </header>

  <main class="app-content">
    <div class="text-sm" style="color:var(--gray-500);"><a href="dashboard.html" style="color:inherit;text-decoration:none;">Painel</a> / Eventos</div>
    <div class="flex justify-between items-center mt-1 mb-2">
      <h1 class="text-2xl font-bold" style="color:var(--gray-900);">Calendário de eventos</h1>
      <div class="flex gap-2" id="cal-view-toggle">
        <button class="btn btn-secondary btn-sm active" data-view="month">Mês</button>
        <button class="btn btn-secondary btn-sm" data-view="list">Lista</button>
      </div>
    </div>
    <p class="mb-6" style="color:var(--gray-500);font-size:14px;">Todos os eventos fotográficos agendados nas turmas. Os eventos são cadastrados na turma (aba <b>Eventos fotográficos</b>).</p>

    <div class="card mb-6">
      <div class="card-header">
        <div class="flex items-center gap-3">
          <button class="btn btn-ghost btn-icon" id="cal-prev" aria-label="Mês anterior"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
          <h2 id="cal-label" style="font-size:18px;font-weight:700;min-width:170px;text-align:center;text-transform:capitalize;">—</h2>
          <button class="btn btn-ghost btn-icon" id="cal-next" aria-label="Próximo mês"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
          <button class="btn btn-secondary btn-sm" id="cal-today" style="margin-left:8px;">Hoje</button>
        </div>
        <div id="cal-count" class="text-sm" style="color:var(--gray-500);">—</div>
      </div>
      <div class="card-body">
        <div id="cal-month" class="cal-view active"><div class="cal-grid" id="cal-grid"></div></div>
        <div id="cal-list" class="cal-view"><div class="cal-list" id="cal-list-body"></div></div>
      </div>
    </div>
  </main>
</div>
<script src="../assets/js/app.js"></script>

<script>
(function () {
  'use strict';
  var MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var DIAS_SEM = ['dom','seg','ter','qua','qui','sex','sáb'];
  var DIAS_LONGO = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function $(id){ return document.getElementById(id); }
  function icons(){ if(window.lucide){ try{ lucide.createIcons(); }catch(e){} } }

  var EVENTOS = [];               // {data, turma_id, turma, evento, hora_inicio, hora_fim}
  var PORDIA = {};                // 'YYYY-MM-DD' -> [ev...]
  var hoje = new Date(); hoje.setHours(0,0,0,0);
  var refYear = hoje.getFullYear(), refMonth = hoje.getMonth();
  var view = 'month';

  function iso(y,m,d){ return y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0'); }
  function horaTxt(e){ return e.hora_inicio ? (e.hora_inicio + (e.hora_fim ? '–'+e.hora_fim : '')) : ''; }
  function tituloEv(e){ var h = horaTxt(e); return (h ? h+' · ' : '') + (e.evento || 'Evento') + (e.turma ? ' — '+e.turma : ''); }
  function linkTurma(e){ return e.turma_id ? ('turma-detalhe.html?id='+encodeURIComponent(e.turma_id)) : '#'; }

  function indexar(){
    PORDIA = {};
    EVENTOS.forEach(function(e){ (PORDIA[e.data] || (PORDIA[e.data]=[])).push(e); });
  }

  function renderMonth(){
    var grid = $('cal-grid');
    var html = DIAS_SEM.map(function(d){ return '<div class="cal-day-head">'+d+'</div>'; }).join('');
    var first = new Date(refYear, refMonth, 1);
    var startOffset = first.getDay();
    var start = new Date(refYear, refMonth, 1 - startOffset);
    var noMes = 0;
    for (var i=0;i<42;i++){
      var cur = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i);
      var cy=cur.getFullYear(), cm=cur.getMonth(), cd=cur.getDate();
      var key = iso(cy,cm,cd);
      var other = (cm !== refMonth);
      var isToday = (cur.getTime() === hoje.getTime());
      var evs = PORDIA[key] || [];
      if(!other) noMes += evs.length;
      var evHtml = evs.slice(0,4).map(function(e){
        return '<a class="cal-evt" href="'+linkTurma(e)+'" title="'+esc(tituloEv(e))+'">'+(e.hora_inicio?esc(e.hora_inicio)+' ':'')+esc(e.evento||'Evento')+'</a>';
      }).join('');
      if(evs.length>4) evHtml += '<div style="font-size:10px;color:var(--gray-500);margin-top:3px;">+'+(evs.length-4)+' mais</div>';
      html += '<div class="cal-cell'+(other?' other':'')+(isToday?' today':'')+'">'+
        '<div class="'+(isToday?'cal-today-mark':'cal-num')+'">'+cd+'</div>'+evHtml+'</div>';
    }
    grid.innerHTML = html;
    $('cal-count').textContent = noMes + (noMes===1?' evento no mês':' eventos no mês');
    icons();
  }

  function renderList(){
    var body = $('cal-list-body');
    var futuros = EVENTOS.filter(function(e){ return e.data >= iso(hoje.getFullYear(),hoje.getMonth(),hoje.getDate()); })
                         .sort(function(a,b){ return a.data<b.data?-1:(a.data>b.data?1:(String(a.hora_inicio||'').localeCompare(String(b.hora_inicio||'')))); });
    if(!futuros.length){ body.innerHTML = '<div class="cal-list-empty" style="padding:40px;text-align:center;color:var(--gray-400);">Nenhum evento futuro agendado.</div>'; return; }
    var html = '', ultimo = '';
    futuros.forEach(function(e){
      if(e.data !== ultimo){
        ultimo = e.data;
        var p = e.data.split('-').map(Number); var dt = new Date(p[0],p[1]-1,p[2]);
        html += '<div class="cal-list-day">'+p[2]+'/'+p[1]+' · '+DIAS_LONGO[dt.getDay()]+'</div>';
      }
      html += '<a class="cal-list-item" href="'+linkTurma(e)+'">'+
        '<span class="cal-list-chip"></span>'+
        '<div class="cal-list-txt">'+esc(e.evento||'Evento')+
          (e.turma?'<div class="cal-list-sub">'+esc(e.turma)+(horaTxt(e)?' · '+esc(horaTxt(e)):'')+'</div>':'')+
        '</div>'+
        '<i data-lucide="chevron-right" style="width:16px;height:16px;color:var(--gray-400);"></i></a>';
    });
    body.innerHTML = html; icons();
  }

  function render(){
    $('cal-label').textContent = MESES[refMonth] + ' de ' + refYear;
    $('cal-month').classList.toggle('active', view==='month');
    $('cal-list').classList.toggle('active', view==='list');
    if(view==='month') renderMonth(); else renderList();
  }

  function carregar(){
    var grid = $('cal-grid');
    grid.innerHTML = '<div style="grid-column:1/-1;padding:40px;text-align:center;color:var(--gray-500);">Carregando…</div>';
    return fetch(apiUrl('/api/agenda'))
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ EVENTOS = (d && d.itens) || []; indexar(); render(); })
      .catch(function(){ grid.innerHTML = '<div style="grid-column:1/-1;padding:40px;text-align:center;color:#DC2626;">Não foi possível carregar o calendário.</div>'; });
  }

  $('cal-prev').addEventListener('click', function(){ refMonth--; if(refMonth<0){refMonth=11;refYear--;} render(); });
  $('cal-next').addEventListener('click', function(){ refMonth++; if(refMonth>11){refMonth=0;refYear++;} render(); });
  $('cal-today').addEventListener('click', function(){ refYear=hoje.getFullYear(); refMonth=hoje.getMonth(); render(); });
  $('cal-btn-reload').addEventListener('click', carregar);
  document.querySelectorAll('#cal-view-toggle [data-view]').forEach(function(b){
    b.addEventListener('click', function(){
      view = b.dataset.view;
      document.querySelectorAll('#cal-view-toggle [data-view]').forEach(function(x){ x.classList.toggle('active', x===b); });
      render();
    });
  });

  icons();
  carregar();
})();
</script>

</body>
</html>
