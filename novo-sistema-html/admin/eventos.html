<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/png" href="/assets/img/icon.png">
<link rel="apple-touch-icon" href="/assets/img/icon-app.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A2540">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Eventos — Ventus</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
<script src="../assets/js/config.js"></script>
</head>
<body>
<aside id="admin-sidebar" class="sidebar"></aside>

<div class="app-shell">
  <header class="topbar">
    <div style="flex:1"></div>
    <button class="btn btn-primary btn-sm" id="btnNovoEvento"><i data-lucide="plus" class="w-4 h-4"></i> Novo evento</button>
  </header>

  <main class="app-content">
    <div class="text-sm" style="color:var(--gray-500);"><a href="dashboard.html" style="color:inherit;text-decoration:none;">Painel</a> / Eventos</div>
    <div class="flex justify-between items-center mt-1 mb-6">
      <h1 class="text-2xl font-bold" style="color:var(--gray-900);">Tipos de evento</h1>
      <button class="btn btn-secondary btn-sm" id="btnRecarregar"><i data-lucide="refresh-cw" class="w-4 h-4"></i> Recarregar</button>
    </div>

    <div class="card">
      <div class="card-header"><div class="card-title" id="listTitle">Eventos cadastrados</div></div>
      <table class="table">
        <thead id="evThead"></thead>
        <tbody id="evTbody"></tbody>
      </table>
    </div>
  </main>
</div>
<script src="../assets/js/app.js"></script>

<script>
(function () {
  'use strict';

  var SLUG = 'evento';
  var CAMPOS = [], LABEL = 'Evento', PLURAL = 'Eventos';

  function notify(msg) {
    if (typeof showToast === 'function') showToast(msg);
    else if (window.vtAlert) window.vtAlert(msg);
  }
  function alerta(msg, titulo) {
    if (window.vtAlert) return window.vtAlert(msg, { title: titulo });
    window.alert(msg);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function refreshIcons() { if (window.lucide) { try { lucide.createIcons(); } catch (e) {} } }

  // Colunas visíveis na tabela (esconde textarea/imagem, que ficam feios em coluna)
  function colunas() { return CAMPOS.filter(function (c) { return c.tipo !== 'textarea' && c.tipo !== 'imagem'; }); }

  function celula(campo, valor) {
    if (campo.tipo === 'bool') {
      return valor
        ? '<span class="badge badge-success">Sim</span>'
        : '<span class="badge">Não</span>';
    }
    if (campo.tipo === 'select') {
      var op = (campo.opcoes || []).filter(function (o) { return String(o[0]) === String(valor); })[0];
      return esc(op ? op[1] : (valor == null ? '' : valor));
    }
    return esc(valor == null ? '' : valor);
  }

  // ---- Descobre o schema real ----
  async function carregarSchema() {
    var r = await fetch(apiUrl('/api/cadastro/' + SLUG + '/schema'));
    if (!r.ok) throw new Error('Schema não encontrado.');
    var schema = await r.json();
    CAMPOS = schema.campos || [];
    LABEL = schema.label || 'Evento';
    PLURAL = schema.plural || 'Eventos';
    document.getElementById('listTitle').textContent = PLURAL + ' cadastrados';
  }

  // ---- Carrega e lista os eventos reais ----
  async function carregar() {
    var thead = document.getElementById('evThead');
    var tbody = document.getElementById('evTbody');
    var cols = colunas();
    thead.innerHTML = '<tr>' + cols.map(function (c) { return '<th>' + esc(c.label) + '</th>'; }).join('') + '<th style="text-align:right;">Ações</th></tr>';
    tbody.innerHTML = '<tr><td colspan="' + (cols.length + 1) + '" style="text-align:center;color:var(--gray-500);padding:18px;">Carregando…</td></tr>';

    var itens;
    try {
      var r = await fetch(apiUrl('/api/cadastro/' + SLUG));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var d = await r.json();
      itens = d.itens || [];
    } catch (e) {
      tbody.innerHTML = '<tr><td colspan="' + (cols.length + 1) + '" style="text-align:center;color:#DC2626;padding:18px;">Não foi possível carregar os eventos.</td></tr>';
      return;
    }

    if (!itens.length) {
      tbody.innerHTML = '<tr><td colspan="' + (cols.length + 1) + '" style="text-align:center;color:var(--gray-400);padding:36px 18px;">Nenhum evento cadastrado.</td></tr>';
      return;
    }

    tbody.innerHTML = itens.map(function (it) {
      var tds = cols.map(function (c, idx) {
        return '<td' + (idx === 0 ? ' style="font-weight:600;color:var(--gray-900);"' : '') + '>' + celula(c, it[c.nome]) + '</td>';
      }).join('');
      return '<tr>' + tds +
        '<td class="text-right"><div class="row-actions" style="display:flex;gap:6px;justify-content:flex-end;">' +
          '<button class="icon-btn" title="Editar" data-edit="' + it.id + '"><i data-lucide="pencil" style="width:15px;height:15px;"></i></button>' +
          '<button class="icon-btn danger" title="Excluir" data-del="' + it.id + '"><i data-lucide="trash-2" style="width:15px;height:15px;"></i></button>' +
        '</div></td></tr>';
    }).join('');
    refreshIcons();

    tbody.querySelectorAll('[data-edit]').forEach(function (b) {
      b.addEventListener('click', function () {
        var item = itens.filter(function (x) { return String(x.id) === b.dataset.edit; })[0];
        if (item) abrirForm(item);
      });
    });
    tbody.querySelectorAll('[data-del]').forEach(function (b) {
      b.addEventListener('click', function () {
        var item = itens.filter(function (x) { return String(x.id) === b.dataset.del; })[0];
        if (item) excluir(item);
      });
    });
  }

  // ---- Renderiza um controle a partir do tipo do campo ----
  function controleHtml(c) {
    var id = 'f-' + c.nome;
    if (c.tipo === 'text') return '<input class="input" type="text" id="' + id + '">';
    if (c.tipo === 'number') return '<input class="input" type="number" step="0.01" id="' + id + '">';
    if (c.tipo === 'int') return '<input class="input" type="number" step="1" id="' + id + '">';
    if (c.tipo === 'textarea') return '<textarea class="textarea" rows="3" id="' + id + '"></textarea>';
    if (c.tipo === 'select') {
      return '<select class="select" id="' + id + '">' +
        (c.opcoes || []).map(function (o) { return '<option value="' + esc(o[0]) + '">' + esc(o[1]) + '</option>'; }).join('') +
        '</select>';
    }
    if (c.tipo === 'bool') {
      return '<label style="display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;">' +
          '<input type="checkbox" id="' + id + '" style="width:0;height:0;position:absolute;opacity:0;">' +
          '<span data-track="' + id + '" style="width:42px;height:24px;border-radius:999px;background:var(--gray-300);position:relative;transition:background .15s;flex:none;">' +
            '<span data-knob="' + id + '" style="position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25);"></span>' +
          '</span>' +
        '</label>';
    }
    if (c.tipo === 'imagem') return '<input class="input" type="url" id="' + id + '" placeholder="URL da imagem">';
    // fallback
    return '<input class="input" type="text" id="' + id + '">';
  }

  function bindToggle(body, id) {
    var chk = body.querySelector('#' + id);
    var track = body.querySelector('[data-track="' + id + '"]');
    var knob = body.querySelector('[data-knob="' + id + '"]');
    if (!chk || !track || !knob) return;
    function paint() {
      track.style.background = chk.checked ? 'var(--primary-500)' : 'var(--gray-300)';
      knob.style.left = chk.checked ? '20px' : '2px';
    }
    chk.addEventListener('change', paint);
    paint();
  }

  // ---- Form dinâmico (novo/editar) ----
  function abrirForm(item) {
    var editando = !!(item && item.id != null);
    var body = document.createElement('form');
    body.setAttribute('novalidate', '');

    var camposHtml = CAMPOS.map(function (c) {
      var req = c.obrigatorio ? ' <span style="color:#DC2626;">*</span>' : '';
      // bool: label ao lado do switch
      if (c.tipo === 'bool') {
        return '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">' +
            '<span style="font-size:14px;font-weight:600;color:var(--gray-700);">' + esc(c.label) + '</span>' +
            controleHtml(c) +
          '</div>';
      }
      return '<div>' +
          '<label class="label" for="f-' + c.nome + '">' + esc(c.label) + req + '</label>' +
          controleHtml(c) +
        '</div>';
    }).join('');

    body.innerHTML = '<div style="display:flex;flex-direction:column;gap:14px;">' +
        camposHtml +
        '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:4px;">' +
          '<button type="button" class="btn btn-secondary" data-cancel>Cancelar</button>' +
          '<button type="submit" class="btn btn-primary" data-handled="1"><span data-savetxt>Salvar</span></button>' +
        '</div>' +
      '</div>';

    var modal = window.vtModal({ title: editando ? 'Editar ' + LABEL.toLowerCase() : 'Novo ' + LABEL.toLowerCase(), bodyHTML: body });

    // Preenche defaults / valores e liga toggles
    CAMPOS.forEach(function (c) {
      var el = body.querySelector('#f-' + c.nome);
      if (!el) return;
      var val = editando ? item[c.nome] : c.default;
      if (c.tipo === 'bool') {
        el.checked = editando ? !!item[c.nome] : (c.default !== undefined ? !!c.default : false);
        bindToggle(body, 'f-' + c.nome);
      } else {
        el.value = (val === undefined || val === null) ? '' : val;
      }
    });

    body.querySelector('[data-cancel]').addEventListener('click', modal.close);

    body.addEventListener('submit', async function (e) {
      e.preventDefault();
      var payload = {};
      var faltando = null;
      CAMPOS.forEach(function (c) {
        var el = body.querySelector('#f-' + c.nome);
        if (!el) return;
        var v;
        if (c.tipo === 'bool') v = el.checked;
        else v = (el.value || '').trim();
        if (c.obrigatorio && (v === '' || v === null || v === undefined) && !faltando) faltando = c;
        payload[c.nome] = v;
      });
      if (faltando) {
        alerta('Preencha o campo "' + faltando.label + '".', 'Campo obrigatório');
        var f = body.querySelector('#f-' + faltando.nome);
        if (f) f.focus();
        return;
      }

      var btn = body.querySelector('[data-savetxt]');
      var orig = btn.textContent;
      btn.textContent = 'Salvando…';
      var url = editando ? apiUrl('/api/cadastro/' + SLUG + '/' + item.id) : apiUrl('/api/cadastro/' + SLUG);
      try {
        var r = await fetch(url, {
          method: editando ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        var d = await r.json().catch(function () { return {}; });
        if (!r.ok) throw new Error(d.detail || 'Erro ao salvar.');
        modal.close();
        notify(editando ? LABEL + ' atualizado.' : LABEL + ' criado.');
        carregar();
      } catch (err) {
        btn.textContent = orig;
        alerta(err.message || 'Erro ao salvar.', 'Erro');
      }
    });

    setTimeout(function () {
      var first = body.querySelector('input, select, textarea');
      if (first) first.focus();
    }, 80);
  }

  async function excluir(item) {
    var nome = item.nome || ('#' + item.id);
    var ok = window.vtConfirm
      ? await window.vtConfirm('Excluir "' + nome + '"? Esta ação não pode ser desfeita.', { title: 'Excluir ' + LABEL.toLowerCase(), okText: 'Excluir', danger: true })
      : window.confirm('Excluir "' + nome + '"?');
    if (!ok) return;
    try {
      var r = await fetch(apiUrl('/api/cadastro/' + SLUG + '/' + item.id), { method: 'DELETE' });
      if (!r.ok) {
        var d = await r.json().catch(function () { return {}; });
        throw new Error(d.detail || 'Erro ao excluir.');
      }
      notify(LABEL + ' excluído.');
      carregar();
    } catch (err) {
      alerta(err.message || 'Erro ao excluir.', 'Erro');
    }
  }

  // ---- Init ----
  (async function init() {
    var btnNovo = document.getElementById('btnNovoEvento');
    var btnReload = document.getElementById('btnRecarregar');
    try {
      await carregarSchema();
    } catch (e) {
      document.getElementById('evTbody').innerHTML = '<tr><td style="text-align:center;color:#DC2626;padding:18px;">Não foi possível carregar o formulário de eventos.</td></tr>';
    }
    if (btnNovo) btnNovo.addEventListener('click', function () { abrirForm(null); });
    if (btnReload) btnReload.addEventListener('click', carregar);
    await carregar();
  })();
})();
</script>

</body>
</html>
