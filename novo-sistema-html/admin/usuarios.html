<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/png" href="/assets/img/icon.png">
<link rel="apple-touch-icon" href="/assets/img/icon-app.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A2540">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Usuários — Ventus</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../assets/js/config.js"></script>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
<aside id="admin-sidebar" class="sidebar"></aside>

<div class="app-shell">
  <header class="topbar">
    <div style="flex:1"></div>
    <div class="flex gap-2">
      <button class="btn btn-primary btn-sm" id="btn-novo"><i data-lucide="user-plus" class="w-4 h-4"></i> Novo usuário</button>
    </div>
  </header>

  <main class="app-content">
    <div class="text-sm" style="color:var(--gray-500);"><a href="dashboard.html" style="color:inherit;text-decoration:none;">Painel</a> / Sistema / Usuários</div>
    <h1 class="text-2xl font-bold mt-1 mb-2" style="color:var(--gray-900);">Usuários do sistema</h1>
    <p class="text-sm mb-6" style="color:var(--gray-600);">Contas de acesso ao painel (e-mail + senha). Estes são os usuários reais cadastrados no banco.</p>

    <div class="card">
      <div class="card-header">
        <div class="card-title" id="tbl-title">Usuários</div>
        <input id="busca" class="input" placeholder="Buscar nome ou e-mail…" style="width:220px;font-size:13px;padding:6px 10px;">
      </div>
      <table class="table">
        <thead><tr><th>Nome</th><th>E-mail</th><th>Criado em</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="3" style="text-align:center;color:var(--gray-500);padding:24px;">Carregando…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>
<script src="../assets/js/app.js"></script>
<script>
(function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const dtBR = s => { if(!s) return '—'; const d=String(s).split('T')[0].split('-'); return d.length===3?`${d[2]}/${d[1]}/${d[0]}`:s; };
  let ITENS = [];

  function toast(m){ const st=$('#vt-toast-stack'); if(st){const t=document.createElement('div');t.className='vt-toast';t.textContent=m;st.appendChild(t);setTimeout(()=>t.classList.add('fade'),2200);setTimeout(()=>t.remove(),2500);} else if(window.vtAlert){vtAlert(m);} }

  async function carregar(){
    try{
      const r = await fetch(apiUrl('/api/usuarios'));
      const d = await r.json();
      ITENS = d.itens || [];
    }catch(e){ $('#tbody').innerHTML=`<tr><td colspan="3" style="text-align:center;color:var(--danger-fg);padding:24px;">Erro ao carregar usuários.</td></tr>`; return; }
    render();
  }
  function render(){
    const q=($('#busca').value||'').toLowerCase().trim();
    let its=ITENS;
    if(q) its=its.filter(u => (u.nome||'').toLowerCase().includes(q) || (u.email||'').toLowerCase().includes(q));
    $('#tbl-title').textContent = `Usuários (${its.length})`;
    if(!its.length){ $('#tbody').innerHTML=`<tr><td colspan="3" style="text-align:center;color:var(--gray-500);padding:24px;">${ITENS.length?'Nenhum usuário com esse filtro.':'Nenhum usuário cadastrado.'}</td></tr>`; return; }
    $('#tbody').innerHTML = its.map(u=>`<tr>
      <td><strong>${esc(u.nome)}</strong></td>
      <td>${esc(u.email)}</td>
      <td>${dtBR(u.criado_em)}</td>
    </tr>`).join('');
    if(window.lucide) lucide.createIcons();
  }

  function novoUsuario(){
    const wrap=document.createElement('div');
    wrap.innerHTML =
      `<div style="display:flex;flex-direction:column;gap:12px;">
        <div><label style="font-size:12.5px;font-weight:700;color:var(--gray-600);">Nome</label><input class="input" id="u-nome" style="width:100%;" placeholder="Nome do usuário"></div>
        <div><label style="font-size:12.5px;font-weight:700;color:var(--gray-600);">E-mail</label><input class="input" id="u-email" type="email" style="width:100%;" placeholder="email@ventus.com"></div>
        <div><label style="font-size:12.5px;font-weight:700;color:var(--gray-600);">Senha</label><input class="input" id="u-senha" type="text" style="width:100%;" placeholder="mínimo 6 caracteres"></div>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;">
        <button class="btn btn-secondary btn-sm" data-act="cancel">Cancelar</button>
        <button class="btn btn-primary btn-sm" data-act="save"><i data-lucide="check" class="w-4 h-4"></i> Criar acesso</button>
      </div>`;
    const m = window.vtModal({ title:'Novo usuário', size:'sm', bodyHTML:wrap });
    if(window.lucide) lucide.createIcons();
    wrap.addEventListener('click', async e=>{
      const b=e.target.closest('[data-act]'); if(!b) return;
      if(b.dataset.act==='cancel'){ m.close(); return; }
      const nome=wrap.querySelector('#u-nome').value.trim();
      const email=wrap.querySelector('#u-email').value.trim();
      const senha=wrap.querySelector('#u-senha').value;
      if(!nome||!email){ toast('Preencha nome e e-mail.'); return; }
      if((senha||'').length<6){ toast('A senha precisa de ao menos 6 caracteres.'); return; }
      b.disabled=true; b.textContent='Criando…';
      try{
        const r=await fetch(apiUrl('/api/registrar'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome,email,senha})});
        const d=await r.json().catch(()=>({}));
        if(!r.ok){ toast(d.detail||'Erro ao criar usuário.'); b.disabled=false; b.innerHTML='Criar acesso'; return; }
        m.close(); toast('Usuário criado!'); carregar();
      }catch(err){ toast('Sem conexão.'); b.disabled=false; b.innerHTML='Criar acesso'; }
    });
  }

  $('#btn-novo').addEventListener('click', novoUsuario);
  $('#busca').addEventListener('input', render);
  carregar();
})();
</script>
</body>
</html>
