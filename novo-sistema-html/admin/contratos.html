<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/png" href="/assets/img/icon.png">
<link rel="apple-touch-icon" href="/assets/img/icon-app.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A2540">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contratos — Ventus</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../assets/js/config.js"></script>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.placeholder-pill { display:inline-block; padding:3px 8px; background:var(--warning-bg); color:var(--warning-fg); border-radius:5px; font-size:11px; font-family:'JetBrains Mono', monospace; cursor:pointer; margin:2px; border:0; }
.placeholder-pill:hover { filter:brightness(.95); }
.editor-fake { min-height:120px; padding:18px; background:var(--surface); border:1px solid var(--gray-200); border-radius:10px; font-size:13.5px; line-height:1.7; color:var(--gray-700); }
.contract-doc { background:var(--surface); border:1px solid var(--gray-200); border-radius:12px; padding:26px 30px; font-family:Georgia,'Times New Roman',serif; font-size:14px; line-height:1.85; color:var(--gray-800); max-height:56vh; overflow:auto; }
.contract-doc h4 { text-align:center; font-weight:800; font-size:15px; color:var(--gray-900); margin:0 0 18px; letter-spacing:.02em; }
.contract-doc p { margin:0 0 14px; }
.contract-doc .ph { display:inline-block; padding:1px 6px; background:var(--warning-bg); color:var(--warning-fg); border-radius:5px; font-family:'JetBrains Mono',monospace; font-size:12px; }
.contract-note { display:flex; gap:8px; align-items:center; margin-top:14px; padding:10px 14px; background:var(--primary-50); color:var(--primary-700); border-radius:10px; font-family:system-ui,sans-serif; font-size:12.5px; }
.tpl-editor { width:100%; height:320px; resize:vertical; padding:16px; border:1px solid var(--gray-200); border-radius:12px; background:var(--surface); color:var(--gray-800); font-family:'JetBrains Mono',monospace; font-size:13px; line-height:1.7; }
.tpl-editor:focus { outline:none; border-color:var(--primary-600); box-shadow:0 0 0 3px var(--primary-50); }
.ph-group-title { font-size:11px;color:var(--gray-500);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin:14px 0 6px; }
</style>
</head>
<body>
<aside id="admin-sidebar" class="sidebar"></aside>

<div class="app-shell">
  <header class="topbar">
    <div style="flex:1"></div>
    <div class="flex gap-2">
      <button class="btn btn-primary btn-sm" id="btn-novo"><i data-lucide="plus" class="w-4 h-4"></i> Novo template</button>
    </div>
  </header>

  <main class="app-content">
    <div class="text-sm" style="color:var(--gray-500);"><a href="dashboard.html" style="color:inherit;text-decoration:none;">Painel</a> / Comercial / Contratos</div>
    <h1 class="text-2xl font-bold mt-1 mb-2" style="color:var(--gray-900);">Contratos & Assinaturas</h1>
    <p class="text-sm mb-6" style="color:var(--gray-600);">Modelos de contrato usados no <strong>checkout</strong> e enviados para assinatura no <strong>ZapSign</strong>. Editou aqui, atualiza em todos os planos que usam o modelo.</p>

    <div class="grid gap-4" style="grid-template-columns: 1.4fr 1fr;">
      <!-- LISTA DE TEMPLATES (real) -->
      <div>
        <div class="flex items-center justify-between mb-3">
          <div class="card-title" id="tpl-count">Templates</div>
        </div>
        <div id="tpl-list" class="grid gap-4"></div>
      </div>

      <!-- PLACEHOLDERS reais -->
      <div class="card" style="align-self:start;position:sticky;top:16px;">
        <div class="card-header">
          <div class="card-title">Placeholders disponíveis</div>
        </div>
        <div class="card-body" style="max-height:70vh;overflow-y:auto;">
          <p style="font-size:12px;color:var(--gray-500);margin-bottom:6px;">Clique para copiar. Dentro do editor, clica para inserir no texto.</p>
          <div id="ph-side"></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../assets/js/app.js"></script>
<script>
(function () {
  const API = '/api/cadastro/modelo-documento';
  // Placeholders REAIS que o backend (gerar_contrato) substitui por aluno.
  const PH_GROUPS = [
    ['📌 Aluno', ['nome','cpf','email','celular','curso','ano']],
    ['🎓 Turma & Plano', ['turma','instituicao','plano']],
    ['💰 Financeiro', ['valor','valor_fotografia','valor_cerimonial','forma_pagamento','parcelas','qt_fotos','tipo_contrato']],
    ['📅 Data', ['data']],
  ];

  let ITEMS = [];
  let curEditor = null; // textarea do modal de edição, quando aberto

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function renderDoc(text) {
    const withPills = esc(text).replace(/\{\{[a-zA-Z0-9_]+\}\}/g, m => `<span class="ph">${m}</span>`);
    const lines = withPills.split('\n');
    const head = lines[0] || '(sem título)';
    const body = lines.slice(1).join('\n').split(/\n{2,}/)
      .map(p => p.trim() ? `<p>${p.replace(/\n/g, '<br>')}</p>` : '').join('');
    return `<h4>${head}</h4>${body}`;
  }

  function toast(msg) {
    const stack = document.getElementById('vt-toast-stack');
    if (stack) {
      const t = document.createElement('div'); t.className = 'vt-toast'; t.textContent = msg;
      stack.appendChild(t); setTimeout(() => t.classList.add('fade'), 2200); setTimeout(() => t.remove(), 2500);
    } else if (window.vtAlert) { window.vtAlert(msg); } else { console.log(msg); }
  }

  function phPillsHTML(insert) {
    // insert=true → data-ins (inserir no editor); senão data-copy
    return PH_GROUPS.map(([titulo, chaves]) =>
      `<div class="ph-group-title">${titulo}</div>` +
      chaves.map(k => {
        const tag = '{{' + k + '}}';
        const attr = insert ? `data-ins="${tag}"` : `data-copy="${tag}"`;
        return `<button type="button" class="placeholder-pill" ${attr}>${tag}</button>`;
      }).join('')
    ).join('');
  }

  async function load() {
    const list = document.getElementById('tpl-list');
    list.innerHTML = `<div style="color:var(--gray-500);font-size:14px;padding:20px;">Carregando…</div>`;
    try {
      const r = await fetch(apiUrl(API));
      const d = await r.json();
      ITEMS = (d && d.itens) || [];
    } catch (e) { ITEMS = []; }
    document.getElementById('tpl-count').textContent = `Templates (${ITEMS.length})`;
    if (!ITEMS.length) {
      list.innerHTML = `<div class="card"><div class="card-body" style="text-align:center;color:var(--gray-500);padding:30px;">Nenhum modelo de contrato ainda.<br><button class="btn btn-primary btn-sm mt-3" onclick="document.getElementById('btn-novo').click()">Criar o primeiro</button></div></div>`;
      return;
    }
    list.innerHTML = ITEMS.map(t => `
      <div class="card">
        <div class="card-header">
          <div>
            <strong>${esc(t.nome)}</strong>
            <div style="font-size:12px;color:var(--gray-500);">${(t.conteudo || '').length} caracteres</div>
          </div>
          <span class="badge ${t.ativo === false ? 'badge-neutral' : 'badge-success'}">${t.ativo === false ? 'Inativo' : 'Ativo'}</span>
        </div>
        <div class="card-body" style="padding:14px;">
          <div class="editor-fake" style="max-height:210px;overflow:auto;">${renderDoc(t.conteudo || '(vazio — clique em Editar para escrever)')}</div>
          <div class="flex gap-2 mt-3">
            <button class="btn btn-secondary btn-sm" data-no-toast data-act="editar" data-id="${t.id}"><i data-lucide="edit" class="w-4 h-4"></i> Editar</button>
            <button class="btn btn-secondary btn-sm" data-no-toast data-act="preview" data-id="${t.id}"><i data-lucide="eye" class="w-4 h-4"></i> Pré-visualizar</button>
            <button class="btn btn-secondary btn-sm" data-no-toast data-act="duplicar" data-id="${t.id}"><i data-lucide="copy" class="w-4 h-4"></i> Duplicar</button>
            <button class="btn btn-secondary btn-sm" data-no-toast data-act="excluir" data-id="${t.id}" style="margin-left:auto;color:var(--danger-fg);"><i data-lucide="trash-2" class="w-4 h-4"></i> Excluir</button>
          </div>
        </div>
      </div>`).join('');
    if (window.lucide) lucide.createIcons();
  }

  function byId(id) { return ITEMS.find(x => String(x.id) === String(id)); }

  function preview(t) {
    window.vtModal({
      title: `Pré-visualização — ${t.nome}`, size: 'lg',
      bodyHTML: `<div class="contract-doc">${renderDoc(t.conteudo || '(vazio)')}</div>` +
        `<div class="contract-note"><i data-lucide="info" class="w-4 h-4"></i> Os campos {{...}} são preenchidos automaticamente por aluno na hora de gerar o contrato.</div>`
    });
    if (window.lucide) lucide.createIcons();
  }

  // Editor real: cria (POST) ou atualiza (PUT)
  function editar(t) {
    const isNew = !t;
    const wrap = document.createElement('div');
    wrap.innerHTML =
      `<label style="display:block;font-size:12.5px;font-weight:700;color:var(--gray-600);margin-bottom:6px;">Nome do modelo</label>` +
      `<input class="input" id="tpl-nome" style="width:100%;margin-bottom:14px;" placeholder="Ex: Contrato Padrão 2026">` +
      `<label style="display:block;font-size:12.5px;font-weight:700;color:var(--gray-600);margin-bottom:6px;">Texto do contrato · use os {{placeholders}} abaixo</label>` +
      `<textarea class="tpl-editor" id="tpl-texto" spellcheck="false" placeholder="CONTRATO DE PRESTAÇÃO DE SERVIÇOS...&#10;&#10;...de outro lado {{nome}}, CPF {{cpf}}..."></textarea>` +
      `<div style="margin-top:10px;font-size:11px;color:var(--gray-500);text-transform:uppercase;letter-spacing:.06em;font-weight:700;">Inserir placeholder</div>` +
      `<div id="ph-modal" style="margin-top:4px;max-height:118px;overflow:auto;"></div>` +
      `<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;">` +
      `<button class="btn btn-secondary btn-sm" data-no-toast data-act="cancel">Cancelar</button>` +
      `<button class="btn btn-primary btn-sm" data-no-toast data-act="save"><i data-lucide="check" class="w-4 h-4"></i> Salvar template</button>` +
      `</div>`;
    wrap.querySelector('#tpl-nome').value = isNew ? '' : (t.nome || '');
    wrap.querySelector('#tpl-texto').value = isNew ? '' : (t.conteudo || '');
    wrap.querySelector('#ph-modal').innerHTML = phPillsHTML(true);

    const m = window.vtModal({ title: isNew ? 'Novo template de contrato' : `Editar template — ${t.nome}`, size: 'lg', bodyHTML: wrap });
    if (window.lucide) lucide.createIcons();

    const ta = wrap.querySelector('#tpl-texto');
    curEditor = ta;

    wrap.addEventListener('click', async e => {
      // inserir placeholder no cursor
      const ins = e.target.closest('[data-ins]');
      if (ins) { insertAtCursor(ta, ins.dataset.ins); return; }

      const b = e.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'cancel') { curEditor = null; m.close(); return; }
      if (b.dataset.act === 'save') {
        const nome = wrap.querySelector('#tpl-nome').value.trim();
        const conteudo = ta.value;
        if (!nome) { toast('Dê um nome ao modelo.'); return; }
        b.disabled = true; b.textContent = 'Salvando…';
        try {
          const url = isNew ? apiUrl(API) : apiUrl(API + '/' + t.id);
          const r = await fetch(url, { method: isNew ? 'POST' : 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nome, conteudo, ativo: true }) });
          if (!r.ok) { const er = await r.json().catch(() => ({})); toast(er.detail || 'Erro ao salvar.'); b.disabled = false; b.innerHTML = 'Salvar template'; return; }
          curEditor = null; m.close();
          toast(isNew ? 'Template criado!' : 'Template salvo!');
          load();
        } catch (err) { toast('Sem conexão ao salvar.'); b.disabled = false; b.innerHTML = 'Salvar template'; }
      }
    });
  }

  function insertAtCursor(ta, text) {
    const s = ta.selectionStart || 0, e = ta.selectionEnd || 0;
    ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
    const pos = s + text.length;
    ta.focus(); ta.setSelectionRange(pos, pos);
  }

  async function duplicar(t) {
    const ok = await window.vtConfirm(`Duplicar o template "${t.nome}"?`, { okText: 'Duplicar' });
    if (!ok) return;
    try {
      const r = await fetch(apiUrl(API), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nome: (t.nome || 'Contrato') + ' (cópia)', conteudo: t.conteudo || '', ativo: true }) });
      if (!r.ok) { toast('Erro ao duplicar.'); return; }
      toast('Template duplicado.'); load();
    } catch (e) { toast('Sem conexão.'); }
  }

  async function excluir(t) {
    const ok = await window.vtConfirm(`Excluir o template "${t.nome}"? Planos que usam este modelo ficarão sem contrato.`, { okText: 'Excluir', danger: true });
    if (!ok) return;
    try {
      const r = await fetch(apiUrl(API + '/' + t.id), { method: 'DELETE' });
      if (!r.ok) { toast('Erro ao excluir.'); return; }
      toast('Template excluído.'); load();
    } catch (e) { toast('Sem conexão.'); }
  }

  // eventos
  document.getElementById('btn-novo').addEventListener('click', () => editar(null));

  document.getElementById('tpl-list').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    e.preventDefault();
    const t = byId(b.dataset.id); if (!t) return;
    const a = b.dataset.act;
    if (a === 'editar') editar(t);
    else if (a === 'preview') preview(t);
    else if (a === 'duplicar') duplicar(t);
    else if (a === 'excluir') excluir(t);
  });

  // placeholders laterais: copiar
  const side = document.getElementById('ph-side');
  side.innerHTML = phPillsHTML(false);
  side.addEventListener('click', e => {
    const b = e.target.closest('[data-copy]'); if (!b) return;
    const tag = b.dataset.copy;
    if (curEditor) { insertAtCursor(curEditor, tag); toast('Inserido no texto.'); }
    else if (navigator.clipboard) { navigator.clipboard.writeText(tag).then(() => toast(tag + ' copiado.')); }
    else toast(tag);
  });

  load();
})();
</script>

</body>
</html>
