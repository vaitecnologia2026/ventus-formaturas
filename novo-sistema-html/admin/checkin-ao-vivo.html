<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/png" href="/assets/img/icon.png">
<link rel="apple-touch-icon" href="/assets/img/icon-app.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A2540">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Check-in ao vivo — Ventus</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('ventus-theme')||'light')}catch(e){}</script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../assets/js/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
  /* ===== Cabeçalho da página (padrão admin, igual dashboard) ===== */
  .page-head { display:flex; align-items:center; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
  .page-head .chip { width:52px; height:52px; border-radius:15px; flex:none; display:grid; place-items:center; background:linear-gradient(140deg,var(--primary-500),var(--primary-700)); color:#fff; box-shadow:0 8px 20px -8px rgba(37,99,235,.6); }
  .page-head .chip svg { width:26px; height:26px; }
  .page-head .ph-txt { min-width:0; }
  .page-head h1 { font-size:24px; font-weight:800; letter-spacing:-.02em; margin:0; color:var(--gray-900); display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .page-head p { margin:3px 0 0; color:var(--gray-500); font-size:13.5px; }
  .page-head .actions { margin-left:auto; display:flex; gap:10px; flex-wrap:wrap; }
  /* Badge "AO VIVO" verde com pontinho pulsante */
  .badge-live { display:inline-flex; align-items:center; gap:7px; padding:4px 12px; border-radius:999px; font-size:12px; font-weight:700; letter-spacing:.03em; background:var(--success-bg); color:var(--success-fg); }

  /* ===== KPIs (padrão dashboard: 4 → 2 → 1, fileira sempre cheia) ===== */
  .kpis { display:grid; gap:16px; margin-bottom:20px; grid-template-columns:repeat(4,1fr); }
  @media (max-width:1024px){ .kpis { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:640px){ .kpis { grid-template-columns:1fr; } }
  .kpi { background:var(--surface); border:1px solid var(--gray-200); border-radius:var(--radius-lg); padding:18px 20px; box-shadow:var(--shadow-sm); }
  .kpi .top { display:flex; align-items:center; justify-content:space-between; }
  .kpi .ic { width:38px; height:38px; border-radius:11px; display:grid; place-items:center; background:var(--primary-50); color:var(--primary-700); }
  .kpi .l { font-size:12.5px; color:var(--gray-500); font-weight:600; margin-top:12px; }
  .kpi .v { font-size:30px; font-weight:800; letter-spacing:-.02em; color:var(--gray-900); margin-top:2px; }
  .kpi .s { font-size:12px; color:var(--gray-400); margin-top:2px; }
  .kpi.verde .ic{background:var(--success-bg);color:#16A34A;} .kpi.verde .v{color:#16A34A;}
  .kpi.laranja .ic{background:var(--warning-bg);color:#D97706;} .kpi.laranja .v{color:#D97706;}

  /* ===== Corpo em 2 colunas (2fr 1fr → 1fr no mobile) ===== */
  .cols { display:grid; grid-template-columns:2fr 1fr; gap:18px; align-items:start; }
  .col { display:flex; flex-direction:column; gap:18px; min-width:0; }
  @media (max-width:900px){ .cols{grid-template-columns:1fr;} }

  /* Painéis (mesmos tokens do dashboard) */
  .panel { background:var(--surface); border:1px solid var(--gray-200); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); overflow:hidden; }
  .panel-head { padding:15px 20px; border-bottom:1px solid var(--gray-100); font-size:14.5px; font-weight:700; color:var(--gray-900); display:flex; align-items:center; justify-content:space-between; gap:9px; }
  .panel-head .ph-l { display:flex; align-items:center; gap:9px; }
  .panel-body { padding:20px; }

  /* Tabela de últimos check-ins */
  table.tbl { width:100%; border-collapse:collapse; font-size:14px; }
  table.tbl td { padding:13px 20px; border-bottom:1px solid var(--gray-100); color:var(--gray-700); vertical-align:middle; }
  table.tbl tr:last-child td { border-bottom:none; }
  table.tbl tbody tr:hover td { background:var(--gray-50); }
  table.tbl td.nome { font-weight:600; color:var(--gray-900); }
  table.tbl td.nome small { display:block; font-size:12px; color:var(--gray-400); font-weight:400; margin-top:2px; }
  table.tbl td.cat { text-align:right; white-space:nowrap; }
  table.tbl td.hora { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; font-size:13px; color:var(--gray-500); }
  table.tbl td.hora.ok { color:#16A34A; font-weight:600; } table.tbl td.hora.err { color:var(--danger); font-weight:600; }

  /* Distribuição por categoria — barras com token de cor */
  .dist { display:flex; flex-direction:column; gap:14px; }
  .dist-row .dist-top { display:flex; align-items:center; justify-content:space-between; font-size:13.5px; color:var(--gray-600); margin-bottom:6px; }
  .dist-row .dist-top b { color:var(--gray-900); font-variant-numeric:tabular-nums; }
  .dist-bar { height:7px; background:var(--gray-100); border-radius:999px; overflow:hidden; }
  .dist-bar > span { display:block; height:100%; border-radius:999px; }

  /* Pontos de acesso — lista com status */
  .pop { display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--gray-100); font-size:14px; }
  .pop:last-child{ border-bottom:none; }
  .pop .n { font-weight:600; color:var(--gray-700); display:flex; align-items:center; gap:9px; }
  .pop .n svg { width:16px; height:16px; color:var(--gray-400); flex:none; }
  .pop .b { font-size:12px; font-weight:700; color:var(--success-fg); background:var(--success-bg); padding:4px 11px; border-radius:999px; white-space:nowrap; }

  /* Responsivo — mesmos ajustes do dashboard */
  @media (max-width:640px){
    .app-content{padding:16px;}
    .page-head{gap:12px;margin-bottom:18px;} .page-head .chip{width:44px;height:44px;border-radius:13px;} .page-head .chip svg{width:22px;height:22px;} .page-head h1{font-size:20px;}
    .page-head .actions{width:100%;} .page-head .actions .btn{flex:1;justify-content:center;}
    .kpis{gap:12px;} .kpi{padding:14px 16px;} .kpi .v{font-size:24px;}
    .panel-head{padding:14px 16px;} .panel-body{padding:16px;}
    table.tbl td{padding:11px 14px;}
  }
</style>
</head>
<body>
<aside id="admin-sidebar" class="sidebar"></aside>

<div class="app-shell">
  <header class="topbar">
    <div style="flex:1"></div>
  </header>

  <main class="app-content">

    <!-- Cabeçalho da página -->
    <div class="page-head">
      <div class="chip"><i data-lucide="scan-line"></i></div>
      <div class="ph-txt">
        <h1>Check-in ao vivo <span class="badge-live"><span class="live-dot"></span> AO VIVO</span></h1>
        <p id="evt-sub">Selecione um evento para iniciar o check-in.</p>
      </div>
      <div class="actions">
        <select id="evt-select" class="input" style="min-width:280px;max-width:100%;">
          <option value="">Carregando eventos…</option>
        </select>
      </div>
    </div>

    <!-- KPIs ao vivo (preenchidos via API) -->
    <div class="kpis">
      <div class="kpi">
        <div class="top"><div class="ic"><i data-lucide="users-round"></i></div></div>
        <div class="l">Total de alunos</div>
        <div class="v" id="kpi-total">—</div>
        <div class="s">no evento selecionado</div>
      </div>
      <div class="kpi verde">
        <div class="top"><div class="ic"><i data-lucide="user-check"></i></div></div>
        <div class="l">Check-ins realizados</div>
        <div class="v" id="kpi-presentes">—</div>
        <div class="s" id="kpi-presentes-pct">—</div>
      </div>
      <div class="kpi laranja">
        <div class="top"><div class="ic"><i data-lucide="clock"></i></div></div>
        <div class="l">Pendentes</div>
        <div class="v" id="kpi-ausentes">—</div>
        <div class="s">ainda não fizeram check-in</div>
      </div>
      <div class="kpi">
        <div class="top"><div class="ic"><i data-lucide="calendar-days"></i></div></div>
        <div class="l">Data do evento</div>
        <div class="v" id="kpi-data" style="font-size:20px;">—</div>
        <div class="s" id="kpi-local">—</div>
      </div>
    </div>

    <!-- Lista de alunos do evento -->
    <div class="panel">
      <div class="panel-head">
        <span class="ph-l"><i data-lucide="list" style="width:17px;height:17px;color:var(--primary-600);"></i> Alunos do evento</span>
        <span class="badge badge-info" id="lista-info">—</span>
      </div>
      <table class="tbl" id="alunos-tbl">
        <tbody id="alunos-body"></tbody>
      </table>
      <div id="alunos-empty" style="padding:40px;text-align:center;color:var(--gray-500);font-size:14px;">Nenhum evento disponível para check-in.</div>
    </div>
  </main>
</div>

<script src="../assets/js/app.js"></script>
<script>
/* ================================================================
   Check-in ao vivo — 100% real.
   GET  /api/checkin/opcoes                         -> turmas + eventos
   GET  /api/checkin/{evento_id}                    -> situação (alunos)
   POST /api/checkin/{evento_id}/aluno/{aluno_id}   -> marca presença
   ZERO dado hardcoded. Sem evento/dados => estado vazio real.
================================================================ */
(function () {
  const selEl    = document.getElementById('evt-select');
  const subEl    = document.getElementById('evt-sub');
  const bodyEl   = document.getElementById('alunos-body');
  const emptyEl  = document.getElementById('alunos-empty');
  const infoEl   = document.getElementById('lista-info');
  const tblEl    = document.getElementById('alunos-tbl');

  const kpiTotal   = document.getElementById('kpi-total');
  const kpiPres    = document.getElementById('kpi-presentes');
  const kpiPresPct = document.getElementById('kpi-presentes-pct');
  const kpiAus     = document.getElementById('kpi-ausentes');
  const kpiData    = document.getElementById('kpi-data');
  const kpiLocal   = document.getElementById('kpi-local');

  const notify = (m) => { if (typeof showToast === 'function') showToast(m); };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function fmtData(d) {
    if (!d) return '—';
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d);
    return m ? `${m[3]}/${m[2]}/${m[1]}` : d;
  }
  function fmtHora(iso) {
    if (!iso) return '';
    const dt = new Date(iso);
    if (isNaN(dt)) return '';
    return dt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  function resetKpis() {
    kpiTotal.textContent = '—'; kpiPres.textContent = '—'; kpiPresPct.textContent = '—';
    kpiAus.textContent = '—'; kpiData.textContent = '—'; kpiLocal.textContent = '—';
  }

  // Carrega opções (turmas + eventos) e monta o seletor agrupado por turma.
  async function carregarOpcoes() {
    let data;
    try {
      const r = await fetch(apiUrl('/api/checkin/opcoes'));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      data = await r.json();
    } catch (e) {
      selEl.innerHTML = '<option value="">Erro ao carregar eventos</option>';
      subEl.textContent = 'Não foi possível carregar os eventos. Verifique a conexão.';
      return;
    }

    const turmas  = Array.isArray(data.turmas)  ? data.turmas  : [];
    const eventos = Array.isArray(data.eventos) ? data.eventos : [];
    const turmaNome = new Map(turmas.map(t => [t.id, t.nome]));

    if (!eventos.length) {
      selEl.innerHTML = '<option value="">Nenhum evento disponível</option>';
      selEl.disabled = true;
      subEl.textContent = 'Nenhum evento disponível para check-in.';
      tblEl.style.display = 'none';
      emptyEl.style.display = 'block';
      infoEl.textContent = '0 alunos';
      return;
    }

    // Agrupa eventos por turma em <optgroup>.
    const porTurma = new Map();
    eventos.forEach(ev => {
      const key = ev.turma_id;
      if (!porTurma.has(key)) porTurma.set(key, []);
      porTurma.get(key).push(ev);
    });

    let html = '<option value="">Selecione um evento…</option>';
    porTurma.forEach((evs, tid) => {
      const label = esc(turmaNome.get(tid) || ('Turma ' + tid));
      html += `<optgroup label="${label}">`;
      evs.forEach(ev => {
        const dt = ev.data ? ' · ' + fmtData(ev.data) : '';
        html += `<option value="${ev.id}">${esc(ev.nome)}${esc(dt)}</option>`;
      });
      html += '</optgroup>';
    });
    selEl.innerHTML = html;
    selEl.disabled = false;
    subEl.textContent = 'Selecione um evento para iniciar o check-in.';
  }

  // Carrega a situação de check-in de um evento e lista os alunos.
  async function carregarEvento(eventoId) {
    if (!eventoId) {
      resetKpis();
      bodyEl.innerHTML = '';
      tblEl.style.display = 'none';
      emptyEl.style.display = 'block';
      emptyEl.textContent = 'Selecione um evento para ver os alunos.';
      infoEl.textContent = '—';
      subEl.textContent = 'Selecione um evento para iniciar o check-in.';
      return;
    }

    infoEl.textContent = 'Carregando…';
    let data;
    try {
      const r = await fetch(apiUrl('/api/checkin/' + encodeURIComponent(eventoId)));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      data = await r.json();
    } catch (e) {
      resetKpis();
      bodyEl.innerHTML = '';
      tblEl.style.display = 'none';
      emptyEl.style.display = 'block';
      emptyEl.textContent = 'Não foi possível carregar este evento.';
      infoEl.textContent = 'erro';
      return;
    }

    const ev    = data.evento || {};
    const itens = Array.isArray(data.itens) ? data.itens : [];
    const total = data.total != null ? data.total : itens.length;
    const pres  = data.presentes != null ? data.presentes : itens.filter(i => i.presente).length;
    const aus   = data.ausentes  != null ? data.ausentes  : (total - pres);

    // KPIs reais
    kpiTotal.textContent = total;
    kpiPres.textContent  = pres;
    kpiPresPct.textContent = total ? `${Math.round((pres / total) * 100)}% dos alunos` : '—';
    kpiAus.textContent   = aus;
    kpiData.textContent  = fmtData(ev.data);
    kpiLocal.textContent = ev.local || '—';

    // Subtítulo
    subEl.textContent = [ev.nome, ev.local, fmtData(ev.data)].filter(x => x && x !== '—').join(' · ')
                        || 'Evento selecionado';

    infoEl.textContent = `${total} aluno${total === 1 ? '' : 's'}`;

    if (!itens.length) {
      bodyEl.innerHTML = '';
      tblEl.style.display = 'none';
      emptyEl.style.display = 'block';
      emptyEl.textContent = 'Nenhum aluno neste evento.';
      return;
    }

    tblEl.style.display = '';
    emptyEl.style.display = 'none';
    renderAlunos(eventoId, itens);
  }

  function renderAlunos(eventoId, itens) {
    bodyEl.innerHTML = itens.map(a => {
      const sub = a.curso ? esc(a.curso) : 'Aluno';
      const hora = fmtHora(a.checkin_em);
      const acao = a.presente
        ? `<span class="badge badge-success"><i data-lucide="check" style="width:12px;height:12px;"></i> Presente${hora ? ' · ' + esc(hora) : ''}</span>`
        : `<button class="btn btn-primary btn-sm" data-checkin="${a.aluno_id}">
             <i data-lucide="user-check" class="w-4 h-4"></i> Marcar presença
           </button>`;
      return `<tr data-row="${a.aluno_id}">
        <td class="nome">${esc(a.nome || 'Sem nome')}<small>${sub}</small></td>
        <td class="cat" style="text-align:right;">${acao}</td>
      </tr>`;
    }).join('');
    if (window.lucide) lucide.createIcons();

    bodyEl.querySelectorAll('[data-checkin]').forEach(btn => {
      btn.addEventListener('click', () => marcarPresenca(eventoId, btn.dataset.checkin, btn));
    });
  }

  async function marcarPresenca(eventoId, alunoId, btn) {
    btn.disabled = true;
    const original = btn.innerHTML;
    btn.innerHTML = 'Registrando…';
    try {
      const r = await fetch(apiUrl(`/api/checkin/${encodeURIComponent(eventoId)}/aluno/${encodeURIComponent(alunoId)}`), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      notify('Presença registrada.');
      // Recarrega a situação real do evento (KPIs + lista).
      await carregarEvento(eventoId);
    } catch (e) {
      btn.disabled = false;
      btn.innerHTML = original;
      if (window.lucide) lucide.createIcons();
      notify('Não foi possível registrar a presença.');
    }
  }

  selEl.addEventListener('change', () => carregarEvento(selEl.value));

  // Init
  resetKpis();
  tblEl.style.display = 'none';
  carregarOpcoes();
  if (window.lucide) lucide.createIcons();
})();
</script>
</body>
</html>
