<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/png" href="/assets/img/icon.png">
<link rel="apple-touch-icon" href="/assets/img/icon-app.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A2540">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Produtos e Serviços — Ventus</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
<script src="../assets/js/config.js"></script>
</head>
<body>
<aside id="admin-sidebar" class="sidebar"></aside>

<div class="app-shell">
  <header class="topbar">
    <div style="flex:1"></div>
    <button class="btn btn-primary btn-sm" id="btnNovoProduto" data-handled="1"><i data-lucide="plus" class="w-4 h-4"></i> Novo produto</button>
  </header>

  <main class="app-content">
    <div class="text-sm" style="color:var(--gray-500);"><a href="dashboard.html" style="color:inherit;text-decoration:none;">Painel</a> / Comercial / Produtos e Serviços</div>
    <h1 class="text-2xl font-bold mt-1 mb-6" style="color:var(--gray-900);">Produtos e serviços</h1>

    <div class="card">
      <div class="card-header">
        <div class="card-title" id="catTitle">Catálogo</div>
        <button class="btn btn-secondary btn-sm" id="btnRecarregar"><i data-lucide="refresh-cw" class="w-4 h-4"></i> Recarregar</button>
      </div>
      <div class="card-body">
        <div id="listaProdutos" class="grid gap-4" style="grid-template-columns:repeat(2,1fr);"></div>
      </div>
    </div>
  </main>
</div>
<script src="../assets/js/app.js"></script>

<script>
(function () {
  'use strict';

  var SLUG = 'produto';
  var TIPO_LABEL = { produto: 'Produto', servico: 'Serviço', cerimonial: 'Cerimonial' };

  function notify(msg) {
    if (typeof showToast === 'function') showToast(msg);
    else if (window.vtAlert) window.vtAlert(msg);
  }
  function alerta(msg, titulo) {
    if (window.vtAlert) return window.vtAlert(msg, { title: titulo });
    window.alert(msg);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function refreshIcons() { if (window.lucide) { try { lucide.createIcons(); } catch (e) {} } }

  // ---- Carregar e renderizar catálogo real ----
  async function carregar() {
    var lista = document.getElementById('listaProdutos');
    lista.innerHTML = '<div style="grid-column:1/-1;padding:24px;text-align:center;color:var(--gray-500);font-size:14px;">Carregando…</div>';
    var itens;
    try {
      var r = await fetch(apiUrl('/api/cadastro/' + SLUG));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var d = await r.json();
      itens = d.itens || [];
    } catch (e) {
      lista.innerHTML = '<div style="grid-column:1/-1;padding:24px;text-align:center;color:#DC2626;font-size:14px;">Não foi possível carregar os produtos. Tente novamente.</div>';
      return;
    }

    document.getElementById('catTitle').textContent = 'Catálogo (' + itens.length + (itens.length === 1 ? ' item' : ' itens') + ')';

    if (!itens.length) {
      lista.innerHTML = '<div style="grid-column:1/-1;padding:40px 16px;text-align:center;color:var(--gray-400);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:10px;">' +
        '<i data-lucide="package-open" style="width:34px;height:34px;"></i>' +
        'Nenhum produto cadastrado.</div>';
      refreshIcons();
      return;
    }

    lista.innerHTML = itens.map(function (it) {
      var img = it.imagem_url
        ? '<img src="' + esc(it.imagem_url) + '" alt="" style="width:80px;height:80px;border-radius:10px;object-fit:cover;flex-shrink:0;border:1px solid var(--gray-200);">'
        : '<div style="width:80px;height:80px;border-radius:10px;background:linear-gradient(135deg,#1E3A8A,#7C3AED);flex-shrink:0;display:grid;place-items:center;color:white;"><i data-lucide="package" class="w-6 h-6"></i></div>';
      var statusBadge = it.ativo
        ? '<span class="badge badge-success">Ativo</span>'
        : '<span class="badge">Inativo</span>';
      return '<div style="padding:16px;border:1px solid var(--gray-200);border-radius:12px;display:flex;gap:14px;">' +
          img +
          '<div style="flex:1;min-width:0;">' +
            '<strong style="font-size:14px;display:block;">' + esc(it.nome) + '</strong>' +
            '<div style="font-size:12px;color:var(--gray-500);margin:2px 0 6px;">' + esc(TIPO_LABEL[it.tipo] || it.tipo || '') + (it.descricao ? ' · ' + esc(it.descricao) : '') + '</div>' +
            '<div class="flex justify-between items-end">' +
              statusBadge +
              '<div class="row-actions" style="display:flex;gap:6px;">' +
                '<button class="btn btn-secondary btn-sm" data-edit="' + it.id + '"><i data-lucide="pencil" class="w-4 h-4"></i></button>' +
                '<button class="btn btn-secondary btn-sm" data-del="' + it.id + '"><i data-lucide="trash-2" class="w-4 h-4"></i></button>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';
    }).join('');
    refreshIcons();

    lista.querySelectorAll('[data-edit]').forEach(function (b) {
      b.addEventListener('click', function () {
        var item = itens.filter(function (x) { return String(x.id) === b.dataset.edit; })[0];
        if (item) abrirForm(item);
      });
    });
    lista.querySelectorAll('[data-del]').forEach(function (b) {
      b.addEventListener('click', function () {
        var item = itens.filter(function (x) { return String(x.id) === b.dataset.del; })[0];
        if (item) excluir(item);
      });
    });
  }

  // ---- Form (novo/editar) ----
  function abrirForm(item) {
    var editando = !!(item && item.id != null);
    var body = document.createElement('form');
    body.setAttribute('novalidate', '');
    body.innerHTML = [
      '<div style="display:flex;flex-direction:column;gap:14px;">',
        '<div>',
          '<label class="label" for="np-nome">Nome *</label>',
          '<input class="input" id="np-nome" type="text" placeholder="Ex.: Foto adicional, Convite de festa…" autocomplete="off">',
        '</div>',
        '<div>',
          '<label class="label" for="np-tipo">Tipo</label>',
          '<select class="select" id="np-tipo">',
            '<option value="produto">Produto</option>',
            '<option value="servico">Serviço</option>',
            '<option value="cerimonial">Cerimonial</option>',
          '</select>',
        '</div>',
        '<div>',
          '<label class="label" for="np-desc">Descrição</label>',
          '<textarea class="textarea" id="np-desc" rows="3" placeholder="Detalhes do produto (opcional)"></textarea>',
        '</div>',
        '<label style="display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;">',
          '<input type="checkbox" id="np-ativo" style="width:0;height:0;position:absolute;opacity:0;">',
          '<span data-track style="width:42px;height:24px;border-radius:999px;background:var(--gray-300);position:relative;transition:background .15s;flex:none;">',
            '<span data-knob style="position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25);"></span>',
          '</span>',
          '<span style="font-size:14px;font-weight:600;color:var(--gray-700);">Ativo</span>',
        '</label>',
        '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:4px;">',
          '<button type="button" class="btn btn-secondary" data-cancel>Cancelar</button>',
          '<button type="submit" class="btn btn-primary" data-handled="1"><span data-savetxt>Salvar</span></button>',
        '</div>',
      '</div>'
    ].join('');

    var modal = window.vtModal({ title: editando ? 'Editar produto' : 'Novo produto', bodyHTML: body });

    var chk = body.querySelector('#np-ativo');
    var track = body.querySelector('[data-track]');
    var knob = body.querySelector('[data-knob]');
    function paintToggle() {
      track.style.background = chk.checked ? 'var(--primary-500)' : 'var(--gray-300)';
      knob.style.left = chk.checked ? '20px' : '2px';
    }
    chk.addEventListener('change', paintToggle);

    // Preenche valores (edição) ou defaults (novo)
    if (editando) {
      body.querySelector('#np-nome').value = item.nome || '';
      body.querySelector('#np-tipo').value = item.tipo || 'produto';
      body.querySelector('#np-desc').value = item.descricao || '';
      chk.checked = !!item.ativo;
    } else {
      chk.checked = true; // default ativo
    }
    paintToggle();

    body.querySelector('[data-cancel]').addEventListener('click', modal.close);

    body.addEventListener('submit', async function (e) {
      e.preventDefault();
      var nome = (body.querySelector('#np-nome').value || '').trim();
      if (!nome) {
        alerta('Informe o nome do produto.', 'Campo obrigatório');
        body.querySelector('#np-nome').focus();
        return;
      }
      var payload = {
        nome: nome,
        tipo: body.querySelector('#np-tipo').value,
        descricao: (body.querySelector('#np-desc').value || '').trim(),
        ativo: chk.checked
      };
      // Preserva imagem existente na edição (form não altera imagem)
      if (editando && item.imagem_url) payload.imagem_url = item.imagem_url;

      var btn = body.querySelector('[data-savetxt]');
      var orig = btn.textContent;
      btn.textContent = 'Salvando…';
      var url = editando ? apiUrl('/api/cadastro/' + SLUG + '/' + item.id) : apiUrl('/api/cadastro/' + SLUG);
      try {
        var r = await fetch(url, {
          method: editando ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        var d = await r.json().catch(function () { return {}; });
        if (!r.ok) throw new Error(d.detail || 'Erro ao salvar.');
        modal.close();
        notify(editando ? 'Produto atualizado.' : 'Produto criado.');
        carregar();
      } catch (err) {
        btn.textContent = orig;
        alerta(err.message || 'Erro ao salvar.', 'Erro');
      }
    });

    setTimeout(function () { body.querySelector('#np-nome').focus(); }, 80);
  }

  async function excluir(item) {
    var ok = window.vtConfirm
      ? await window.vtConfirm('Excluir "' + item.nome + '"? Esta ação não pode ser desfeita.', { title: 'Excluir produto', okText: 'Excluir', danger: true })
      : window.confirm('Excluir "' + item.nome + '"?');
    if (!ok) return;
    try {
      var r = await fetch(apiUrl('/api/cadastro/' + SLUG + '/' + item.id), { method: 'DELETE' });
      if (!r.ok) {
        var d = await r.json().catch(function () { return {}; });
        throw new Error(d.detail || 'Erro ao excluir.');
      }
      notify('Produto excluído.');
      carregar();
    } catch (err) {
      alerta(err.message || 'Erro ao excluir.', 'Erro');
    }
  }

  var btnNovo = document.getElementById('btnNovoProduto');
  if (btnNovo) btnNovo.addEventListener('click', function () { abrirForm(null); });
  var btnReload = document.getElementById('btnRecarregar');
  if (btnReload) btnReload.addEventListener('click', carregar);

  carregar();
})();
</script>

</body>
</html>
