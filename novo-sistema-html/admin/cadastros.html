<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/png" href="/assets/img/icon.png">
<link rel="apple-touch-icon" href="/assets/img/icon-app.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A2540">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cadastros — Ventus</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../assets/js/config.js"></script>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.cad-group { margin-bottom:28px; }
.cad-group-title { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--gray-500); margin-bottom:12px; }
.cad-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
.cad-card { display:flex; align-items:center; gap:14px; padding:16px 18px; background:var(--surface,#fff); border:1px solid var(--gray-200); border-radius:var(--radius-lg,12px); box-shadow:var(--shadow-sm); text-decoration:none; color:inherit; transition:all .15s; }
.cad-card:hover { border-color:var(--primary-400); box-shadow:var(--shadow-md,0 8px 20px -8px rgba(37,99,235,.25)); transform:translateY(-1px); }
.cad-card .ic { width:40px; height:40px; flex:none; border-radius:11px; display:grid; place-items:center; background:var(--primary-50); color:var(--primary-700); }
.cad-card .ic svg { width:20px; height:20px; }
.cad-card .txt { min-width:0; }
.cad-card .txt .lbl { font-size:14.5px; font-weight:600; color:var(--gray-900); }
.cad-card .txt .cnt { font-size:12.5px; color:var(--gray-500); margin-top:2px; }
.cad-empty { padding:40px; text-align:center; color:var(--gray-500); font-size:14px; }
</style>
</head>
<body>
<aside id="admin-sidebar" class="sidebar"></aside>

<div class="app-shell">
  <header class="topbar">
    <div style="flex:1"></div>
  </header>

  <main class="app-content">
    <div class="text-sm" style="color:var(--gray-500);"><a href="dashboard.html" style="color:inherit;text-decoration:none;">Painel</a> / Cadastros</div>
    <div class="flex justify-between items-center mt-1 mb-6">
      <div>
        <h1 class="text-2xl font-bold" style="color:var(--gray-900);">Cadastros consolidados</h1>
        <p class="text-sm" style="color:var(--gray-500);" id="cad-sub">Cadastros base do sistema · usados em turmas, contratos, eventos, OS</p>
      </div>
    </div>

    <div id="cad-container"></div>
  </main>
</div>

<script>
/* ================================================================
   Índice de cadastros — 100% real, vindo de GET /api/cadastro.
   Cada card leva para cadastro.html?slug=<slug> (tela genérica).
   Contagem real (opcional) via GET /api/cadastro/{slug} -> itens.length.
   ZERO dado hardcoded.
================================================================ */

// Ícone Lucide por slug (só estético; se faltar cai no default).
const ICONES = {
  'instituicao':'building-2', 'curso':'graduation-cap', 'evento':'calendar-days',
  'brinde':'gift', 'vendedor':'user-round', 'produto':'package',
  'tipo-foto':'camera', 'forma-entrega':'truck', 'prestador':'hard-hat',
  'status':'flag', 'os-setor':'building', 'os-tipo':'wrench',
  'os-situacao':'list-checks', 'modelo-documento':'file-text',
  'cupom':'ticket-percent', 'modalidade-pagamento':'credit-card',
};

const container = document.getElementById('cad-container');

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function carregar() {
  container.innerHTML = '<div class="cad-empty">Carregando cadastros…</div>';
  let cadastros;
  try {
    const r = await fetch(apiUrl('/api/cadastro'));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    cadastros = Array.isArray(data.cadastros) ? data.cadastros : [];
  } catch (e) {
    container.innerHTML = '<div class="cad-empty">Não foi possível carregar os cadastros. Verifique a conexão e tente novamente.</div>';
    return;
  }

  if (!cadastros.length) {
    container.innerHTML = '<div class="cad-empty">Nenhum cadastro disponível.</div>';
    return;
  }

  document.getElementById('cad-sub').textContent =
    `${cadastros.length} cadastros base do sistema · usados em turmas, contratos, eventos, OS`;

  // Agrupa por módulo preservando a ordem de chegada.
  const grupos = new Map();
  cadastros.forEach(c => {
    const mod = c.modulo || 'Outros';
    if (!grupos.has(mod)) grupos.set(mod, []);
    grupos.get(mod).push(c);
  });

  container.innerHTML = '';
  grupos.forEach((itens, modulo) => {
    const grp = document.createElement('div');
    grp.className = 'cad-group';
    grp.innerHTML = `<div class="cad-group-title">${esc(modulo)}</div>
      <div class="cad-grid">${itens.map(c => {
        const ic = ICONES[c.slug] || 'folder';
        return `<a class="cad-card" href="cadastro.html?slug=${encodeURIComponent(c.slug)}">
          <span class="ic"><i data-lucide="${ic}"></i></span>
          <span class="txt">
            <span class="lbl">${esc(c.plural || c.label || c.slug)}</span>
            <span class="cnt" data-count-slug="${esc(c.slug)}">—</span>
          </span>
        </a>`;
      }).join('')}</div>`;
    container.appendChild(grp);
  });

  if (window.lucide) lucide.createIcons();

  // Contagem real de cada cadastro (opcional, best-effort, sem inventar nada).
  cadastros.forEach(async c => {
    const el = container.querySelector(`[data-count-slug="${CSS.escape(c.slug)}"]`);
    if (!el) return;
    try {
      const r = await fetch(apiUrl('/api/cadastro/' + encodeURIComponent(c.slug)));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      const n = Array.isArray(d.itens) ? d.itens.length : null;
      el.textContent = n == null ? 'Abrir cadastro' : (n === 1 ? '1 item cadastrado' : `${n} itens cadastrados`);
    } catch (e) {
      el.textContent = 'Abrir cadastro';
    }
  });
}

carregar();
</script>

<script src="../assets/js/app.js"></script>

</body>
</html>
