// Renderiza abas
const tabsEl = document.getElementById('cad-tabs');
CADASTROS.forEach((c, i) => {
  const a = document.createElement('a');
  a.href = '#';
  a.className = 'cad-tab' + (i === 0 ? ' active' : '');
  a.dataset.id = c.id;
  a.innerHTML = `${c.label} <span class="badge">${c.count}</span>`;
  a.addEventListener('click', e => { e.preventDefault(); selectTab(c.id); });
  tabsEl.appendChild(a);
});

function selectTab(id) {
  document.querySelectorAll('.cad-tab').forEach(t => t.classList.toggle('active', t.dataset.id === id));
  const c = CADASTROS.find(x => x.id === id);
  document.getElementById('cad-title').textContent = c.label;
  document.getElementById('cad-count').textContent = `${c.count} itens cadastrados`;

  const thead = document.getElementById('cad-thead');
  const tbody = document.getElementById('cad-tbody');
  thead.innerHTML = '<tr>' + c.cols.map(col => `<th>${col}</th>`).join('') + '<th></th></tr>';
  tbody.innerHTML = c.rows.map(row => '<tr>' + row.map(cell => `<td>${cell === '—' ? '<span style="color:var(--gray-400);">—</span>' : cell}</td>`).join('') + `<td class="text-right"><button class="btn btn-ghost btn-icon" data-no-toast><i data-lucide="more-horizontal" class="w-4 h-4"></i></button></td></tr>`).join('');
  document.getElementById('cad-foot').textContent = `Mostrando ${c.rows.length} de ${c.count}`;

  if (window.lucide) lucide.createIcons();
}
