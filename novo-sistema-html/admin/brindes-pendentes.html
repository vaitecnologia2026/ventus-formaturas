<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/png" href="/assets/img/icon.png">
<link rel="apple-touch-icon" href="/assets/img/icon-app.png">
<meta name="theme-color" content="#0A2540">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brindes pendentes — Ventus</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('ventus-theme')||'light')}catch(e){}</script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../assets/js/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
  .page-head { display:flex; align-items:center; gap:16px; margin-bottom:22px; }
  .page-head .chip { width:52px; height:52px; border-radius:15px; flex:none; display:grid; place-items:center;
    background:linear-gradient(140deg,var(--primary-500),var(--primary-700)); color:#fff; box-shadow:0 8px 20px -8px rgba(37,99,235,.6); }
  .page-head h1 { font-size:24px; font-weight:800; letter-spacing:-.02em; margin:0; color:var(--gray-900); }
  .page-head p { margin:3px 0 0; color:var(--gray-500); font-size:13.5px; }
  .filtros { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:18px; }
  .filtros .f { display:flex; flex-direction:column; gap:5px; }
  .filtros label { font-size:12px; font-weight:600; color:var(--gray-600); }
  .filtros select { padding:9px 12px; border:1px solid var(--gray-300); border-radius:10px; font-size:14px; font-family:inherit; min-width:220px; background:var(--surface); color:var(--gray-900); }
  .tabs { display:inline-flex; gap:4px; background:var(--gray-100); padding:4px; border-radius:12px; margin-bottom:18px; }
  .tabs button { border:0; background:transparent; padding:8px 18px; border-radius:9px; font-size:14px; font-weight:600; font-family:inherit; color:var(--gray-600); cursor:pointer; display:flex; align-items:center; gap:7px; }
  .tabs button.active { background:var(--surface); color:var(--gray-900); box-shadow:var(--shadow-sm); }
  .count.ok { color:#047857; background:#D1FAE5; }
  .date-inline { padding:7px 9px; border:1px solid var(--gray-300); border-radius:9px; font-size:13px; font-family:inherit; background:var(--surface); color:var(--gray-900); }
  .row-actions { display:flex; gap:8px; align-items:center; justify-content:flex-end; flex-wrap:wrap; }
  .panel { background:var(--surface); border:1px solid var(--gray-200); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); overflow:hidden; }
  .panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 22px; border-bottom:1px solid var(--gray-100); }
  .panel-head h2 { font-size:15px; font-weight:700; color:var(--gray-900); margin:0; }
  .count { font-size:12px; font-weight:700; color:#B45309; background:var(--warning-bg); padding:3px 11px; border-radius:999px; }
  table.tbl { width:100%; border-collapse:collapse; font-size:14px; }
  table.tbl th { text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--gray-400);
    font-weight:700; padding:13px 22px; background:var(--gray-50); border-bottom:1px solid var(--gray-100); white-space:nowrap; }
  table.tbl td { padding:13px 22px; border-bottom:1px solid var(--gray-100); color:var(--gray-700); }
  table.tbl td.nome { font-weight:600; color:var(--gray-900); }
  .badge { font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; }
  .badge.todos { background:var(--primary-50); color:var(--primary-700); }
  .badge.comissao { background:var(--purple-bg); color:#6D28D9; }
  .empty { text-align:center; color:var(--gray-500); padding:52px 20px; }
  .empty svg { width:34px; height:34px; color:var(--gray-300); margin:0 auto 10px; display:block; }
</style>
</head>
<body>
<aside id="admin-sidebar" class="sidebar"></aside>
<div class="app-shell">
  <header class="topbar">
    <div style="flex:1"></div>
  </header>
  <main class="app-content">
    <div class="page-head">
      <div class="chip"><i data-lucide="gift"></i></div>
      <div><h1>Brindes</h1><p>Controle de entregas de brindes de todas as turmas. Respeita o escopo (comissão só conta para a comissão).</p></div>
    </div>
    <div class="tabs" role="tablist">
      <button id="tab-pend" class="active" role="tab" onclick="setAba('pendentes')"><i data-lucide="clock" class="w-4 h-4"></i> Pendentes</button>
      <button id="tab-ent" role="tab" onclick="setAba('entregues')"><i data-lucide="check-circle-2" class="w-4 h-4"></i> Entregues</button>
    </div>
    <div class="filtros">
      <div class="f"><label>Turma</label><select id="fil-turma"><option value="">Todas as turmas</option></select></div>
      <div class="f"><label>Brinde</label><select id="fil-brinde"><option value="">Todos os brindes</option></select></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2 id="panel-title">Pendentes</h2><span class="count" id="cnt">0</span></div>
      <div class="tbl-wrap"><table class="tbl">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table></div>
    </div>
  </main>
</div>
<script src="../assets/js/app.js"></script>
<script>
lucide.createIcons();
const $ = s => document.querySelector(s);
let ABA = 'pendentes';
let TURMA = '';
let BRINDE = '';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoje = () => new Date().toISOString().slice(0,10);
function fmtData(d) {
  if (!d) return '—';
  const m = String(d).slice(0,10).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : d;
}

function setAba(aba) {
  ABA = aba;
  $('#tab-pend').classList.toggle('active', aba === 'pendentes');
  $('#tab-ent').classList.toggle('active', aba === 'entregues');
  $('#panel-title').textContent = aba === 'pendentes' ? 'Pendentes' : 'Entregues';
  $('#cnt').classList.toggle('ok', aba === 'entregues');
  carregar();
}
window.setAba = setAba;

async function carregar() {
  if (ABA === 'pendentes') return carregarPendentes();
  return carregarEntregues();
}

async function carregarPendentes() {
  const q = TURMA ? ('?turma_id=' + encodeURIComponent(TURMA)) : '';
  const r = await fetch(apiUrl('/api/brindes/pendentes' + q));
  let { itens } = await r.json();
  itens = itens || [];
  popularTurmas(itens);
  if (BRINDE) itens = itens.filter(i => i.brinde === BRINDE);
  $('#cnt').textContent = itens.length;
  $('#thead').innerHTML = `<tr><th>Turma</th><th>Aluno</th><th>Brinde</th><th>Escopo</th><th style="text-align:right;">Ação</th></tr>`;
  if (!itens.length) {
    $('#tbody').innerHTML = `<tr><td colspan="5"><div class="empty"><i data-lucide="check-circle-2"></i>Nenhum brinde pendente. Tudo entregue! 🎉</div></td></tr>`;
    lucide.createIcons(); return;
  }
  $('#tbody').innerHTML = itens.map(it => `<tr id="row-${it.aluno_id}-${it.turma_brinde_id}">
    <td>${esc(it.turma)}</td><td class="nome">${esc(it.aluno)}</td><td>${esc(it.brinde)}</td>
    <td><span class="badge ${it.escopo==='Comissão'?'comissao':'todos'}">${esc(it.escopo)}</span></td>
    <td><div class="row-actions">
      <input type="date" class="date-inline" id="dt-${it.aluno_id}-${it.turma_brinde_id}" value="${hoje()}" max="${hoje()}">
      <button class="btn btn-primary btn-sm" onclick="entregar(${it.aluno_id},${it.turma_brinde_id})"><i data-lucide="check" class="w-4 h-4"></i> Marcar entregue</button>
      <button class="btn btn-secondary btn-sm" title="Este aluno não vai receber este brinde" onclick="naoRecebe(${it.aluno_id},${it.turma_brinde_id},'${esc(it.aluno).replace(/'/g,"\\'")}')"><i data-lucide="x-circle" class="w-4 h-4"></i> Não receberá</button>
    </div></td>
  </tr>`).join('');
  lucide.createIcons();
}

async function carregarEntregues() {
  const params = new URLSearchParams();
  if (TURMA) params.set('turma_id', TURMA);
  if (BRINDE) params.set('brinde', BRINDE);
  const qs = params.toString();
  const r = await fetch(apiUrl('/api/brindes/entregues' + (qs ? '?' + qs : '')));
  const data = await r.json();
  const itens = data.itens || [];
  popularTurmas(itens);
  popularBrindes(data.brindes);
  $('#cnt').textContent = (data.total != null ? data.total : itens.length);
  $('#thead').innerHTML = `<tr><th>Turma</th><th>Aluno</th><th>Brinde</th><th>Escopo</th><th>Data da entrega</th></tr>`;
  if (!itens.length) {
    $('#tbody').innerHTML = `<tr><td colspan="5"><div class="empty"><i data-lucide="gift"></i>Nenhum brinde entregue com esses filtros.</div></td></tr>`;
    lucide.createIcons(); return;
  }
  $('#tbody').innerHTML = itens.map(it => `<tr>
    <td>${esc(it.turma)}</td><td class="nome">${esc(it.aluno)}</td><td>${esc(it.brinde)}</td>
    <td><span class="badge ${it.escopo==='Comissão'?'comissao':'todos'}">${esc(it.escopo)}</span></td>
    <td>${fmtData(it.entregue_em)}</td>
  </tr>`).join('');
  lucide.createIcons();
}

const turmasSet = new Set();
function popularTurmas(itens) {
  const sel = $('#fil-turma');
  let added = false;
  itens.forEach(i => {
    if (i.turma_id == null || turmasSet.has(i.turma_id)) return;
    turmasSet.add(i.turma_id);
    const o = document.createElement('option'); o.value = i.turma_id; o.textContent = i.turma; sel.appendChild(o); added = true;
  });
  if (added) sel.value = TURMA;
}

const brindesSet = new Set();
function popularBrindes(nomes) {
  if (!Array.isArray(nomes)) return;
  const sel = $('#fil-brinde');
  let added = false;
  nomes.forEach(n => {
    if (n == null || brindesSet.has(n)) return;
    brindesSet.add(n);
    const o = document.createElement('option'); o.value = n; o.textContent = n; sel.appendChild(o); added = true;
  });
  if (added) sel.value = BRINDE;
}

window.entregar = async function(alunoId, tbId) {
  const dtEl = document.getElementById(`dt-${alunoId}-${tbId}`);
  const dataEntrega = (dtEl && dtEl.value) || hoje();
  const r = await fetch(apiUrl(`/api/aluno/${alunoId}/brindes/${tbId}/entrega`), {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({entregue:true, data_entrega:dataEntrega})
  });
  if (r.ok) {
    const row = document.getElementById(`row-${alunoId}-${tbId}`); if (row) row.remove();
    $('#cnt').textContent = Math.max(0, Number($('#cnt').textContent)-1);
    if (!$('#tbody').children.length) carregarPendentes();
  } else vtAlert('Erro ao marcar entrega.');
};

window.naoRecebe = async function(alunoId, tbId, nome) {
  if (!(await vtConfirm(`Marcar que <b>${nome}</b> NÃO vai receber este brinde? Ele sai da lista de pendentes.`, {title:'Não receberá', okText:'Confirmar'}))) return;
  const r = await fetch(apiUrl(`/api/aluno/${alunoId}/brindes/${tbId}/entrega`), {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({dispensado:true})
  });
  if (r.ok) {
    const row = document.getElementById(`row-${alunoId}-${tbId}`); if (row) row.remove();
    $('#cnt').textContent = Math.max(0, Number($('#cnt').textContent)-1);
    if (typeof showToast==='function') showToast(`${nome} marcado como "não receberá".`);
    if (!$('#tbody').children.length) carregarPendentes();
  } else vtAlert('Erro ao dispensar o aluno.');
};

$('#fil-turma').onchange = e => { TURMA = e.target.value; carregar(); };
$('#fil-brinde').onchange = e => { BRINDE = e.target.value; carregar(); };

// Pré-carrega a lista de brindes (vem da resposta de /entregues) para o filtro funcionar já na aba Pendentes
fetch(apiUrl('/api/brindes/entregues')).then(r => r.json()).then(d => popularBrindes(d.brindes)).catch(()=>{});
carregar();
</script>
</body>
</html>
