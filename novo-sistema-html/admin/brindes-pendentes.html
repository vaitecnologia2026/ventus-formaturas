<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/png" href="/assets/img/icon.png">
<link rel="apple-touch-icon" href="/assets/img/icon-app.png">
<meta name="theme-color" content="#0A2540">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brindes pendentes — Ventus</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('ventus-theme')||'light')}catch(e){}</script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../assets/js/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
  .page-head { display:flex; align-items:center; gap:16px; margin-bottom:22px; }
  .page-head .chip { width:52px; height:52px; border-radius:15px; flex:none; display:grid; place-items:center;
    background:linear-gradient(140deg,var(--primary-500),var(--primary-700)); color:#fff; box-shadow:0 8px 20px -8px rgba(37,99,235,.6); }
  .page-head h1 { font-size:24px; font-weight:800; letter-spacing:-.02em; margin:0; color:var(--gray-900); }
  .page-head p { margin:3px 0 0; color:var(--gray-500); font-size:13.5px; }
  .filtros { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:18px; }
  .filtros .f { display:flex; flex-direction:column; gap:5px; }
  .filtros label { font-size:12px; font-weight:600; color:var(--gray-600); }
  .filtros select { padding:9px 12px; border:1px solid var(--gray-300); border-radius:10px; font-size:14px; font-family:inherit; min-width:220px; background:var(--surface); color:var(--gray-900); }
  .panel { background:var(--surface); border:1px solid var(--gray-200); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); overflow:hidden; }
  .panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 22px; border-bottom:1px solid var(--gray-100); }
  .panel-head h2 { font-size:15px; font-weight:700; color:var(--gray-900); margin:0; }
  .count { font-size:12px; font-weight:700; color:#B45309; background:#FEF3C7; padding:3px 11px; border-radius:999px; }
  table.tbl { width:100%; border-collapse:collapse; font-size:14px; }
  table.tbl th { text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--gray-400);
    font-weight:700; padding:13px 22px; background:var(--gray-50); border-bottom:1px solid var(--gray-100); white-space:nowrap; }
  table.tbl td { padding:13px 22px; border-bottom:1px solid var(--gray-100); color:var(--gray-700); }
  table.tbl td.nome { font-weight:600; color:var(--gray-900); }
  .badge { font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; }
  .badge.todos { background:var(--primary-50); color:var(--primary-700); }
  .badge.comissao { background:#EDE9FE; color:#6D28D9; }
  .empty { text-align:center; color:var(--gray-500); padding:52px 20px; }
  .empty svg { width:34px; height:34px; color:var(--gray-300); margin:0 auto 10px; display:block; }
</style>
</head>
<body>
<aside id="admin-sidebar" class="sidebar"></aside>
<div class="app-shell">
  <header class="topbar">
    <div class="topbar-search"><i data-lucide="search" class="w-4 h-4"></i><input type="text" placeholder="Buscar…"></div>
  </header>
  <main class="app-content">
    <div class="page-head">
      <div class="chip"><i data-lucide="gift"></i></div>
      <div><h1>Brindes pendentes</h1><p>Entregas de brindes ainda não realizadas, de todas as turmas. Respeita o escopo (comissão só conta para a comissão).</p></div>
    </div>
    <div class="filtros">
      <div class="f"><label>Turma</label><select id="fil-turma"><option value="">Todas as turmas</option></select></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Pendentes</h2><span class="count" id="cnt">0</span></div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Turma</th><th>Aluno</th><th>Brinde</th><th>Escopo</th><th style="text-align:right;">Ação</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table></div>
    </div>
  </main>
</div>
<script src="../assets/js/app.js"></script>
<script>
lucide.createIcons();
const $ = s => document.querySelector(s);
let TURMA = '';

async function carregar() {
  const q = TURMA ? ('?turma_id=' + TURMA) : '';
  const r = await fetch(apiUrl('/api/brindes/pendentes' + q));
  const { itens, total } = await r.json();
  $('#cnt').textContent = total;
  if (!itens.length) { $('#tbody').innerHTML = `<tr><td colspan="5"><div class="empty"><i data-lucide="check-circle-2"></i>Nenhum brinde pendente. Tudo entregue! 🎉</div></td></tr>`; lucide.createIcons(); popularTurmas(itens); return; }
  $('#tbody').innerHTML = itens.map(it => `<tr id="row-${it.aluno_id}-${it.turma_brinde_id}">
    <td>${it.turma}</td><td class="nome">${it.aluno}</td><td>${it.brinde}</td>
    <td><span class="badge ${it.escopo==='Comissão'?'comissao':'todos'}">${it.escopo}</span></td>
    <td style="text-align:right;"><button class="btn btn-primary btn-sm" onclick="entregar(${it.aluno_id},${it.turma_brinde_id})"><i data-lucide="check" class="w-4 h-4"></i> Marcar entregue</button></td>
  </tr>`).join('');
  lucide.createIcons();
  popularTurmas(itens);
}

let turmasPop = false;
function popularTurmas(itens) {
  if (turmasPop) return;
  const map = new Map();
  itens.forEach(i => map.set(i.turma_id, i.turma));
  const sel = $('#fil-turma');
  for (const [tid, tn] of map) { const o = document.createElement('option'); o.value = tid; o.textContent = tn; sel.appendChild(o); }
  turmasPop = true;
}

window.entregar = async function(alunoId, tbId) {
  const r = await fetch(apiUrl(`/api/aluno/${alunoId}/brindes/${tbId}/entrega`), {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({entregue:true})});
  if (r.ok) { const row = document.getElementById(`row-${alunoId}-${tbId}`); if (row) row.remove(); $('#cnt').textContent = Math.max(0, Number($('#cnt').textContent)-1); }
  else alert('Erro ao marcar entrega.');
};

$('#fil-turma').onchange = e => { TURMA = e.target.value; carregar(); };
carregar();
</script>
</body>
</html>
