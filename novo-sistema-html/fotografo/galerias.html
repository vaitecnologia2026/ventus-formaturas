<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/png" href="/assets/img/icon.png">
<link rel="apple-touch-icon" href="/assets/img/icon-app.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A2540">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Minhas galerias — Ventus Fotógrafo</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
<script src="../assets/js/config.js"></script>
<script src="../assets/js/app.js" defer></script>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-brand"><div class="sidebar-brand-mark" style="background:transparent;"><img src="/assets/img/icon-branco.png" alt="Ventus" style="width:100%;height:100%;object-fit:contain;display:block;"></div><div><div>Ventus</div><div style="font-size:11px;font-weight:400;opacity:.6;">Fotógrafo</div></div></div>
  <a href="upload.html" class="sidebar-link" data-nav><i data-lucide="upload"></i>Upload em massa</a>
  <a href="galerias.html" class="sidebar-link active" data-nav><i data-lucide="folder"></i>Minhas galerias</a>
  <a href="historico.html" class="sidebar-link" data-nav><i data-lucide="bar-chart-2"></i>Histórico</a>
  <div class="sidebar-footer"><div class="avatar" id="prestadorAvatar">FT</div><div style="flex:1;"><div style="font-size:13px;font-weight:600;" id="prestadorNome">Fotógrafo</div><div style="font-size:11px;opacity:.6;" id="prestadorFuncao">Fotógrafo · Ventus</div></div><a href="../index.html" style="color:rgba(255,255,255,.6);"><i data-lucide="home" class="w-4 h-4"></i></a></div>
</aside>

<div class="app-shell">
  <header class="topbar">
    <div class="topbar-search"><i data-lucide="search" class="w-4 h-4"></i><input type="text" id="busca" placeholder="Buscar galeria…" autocomplete="off"></div>
  </header>

  <main class="app-content">
    <div class="text-sm" style="color:var(--gray-500);">Fotógrafo / Minhas galerias</div>
    <div class="flex items-center justify-between mt-1 mb-6">
      <h1 class="text-2xl font-bold" style="color:var(--gray-900);">Minhas galerias</h1>
      <a href="upload.html" class="btn btn-primary" id="btnNovo"><i data-lucide="upload" class="w-4 h-4"></i> Novo upload</a>
    </div>

    <!-- resumo -->
    <div class="grid gap-4 mb-6" style="grid-template-columns:repeat(4,1fr);" id="cards-resumo">
      <div class="card"><div class="card-body" style="padding:16px;"><div style="font-size:12px;color:var(--gray-500);">Galerias</div><div style="font-size:24px;font-weight:800;color:var(--gray-900);" id="stGalerias">—</div></div></div>
      <div class="card"><div class="card-body" style="padding:16px;"><div style="font-size:12px;color:var(--gray-500);">Fotos enviadas</div><div style="font-size:24px;font-weight:800;color:var(--gray-900);" id="stFotos">—</div></div></div>
      <div class="card"><div class="card-body" style="padding:16px;"><div style="font-size:12px;color:var(--gray-500);">Em edição</div><div style="font-size:24px;font-weight:800;color:var(--gray-900);" id="stEdicao">—</div></div></div>
      <div class="card"><div class="card-body" style="padding:16px;"><div style="font-size:12px;color:var(--gray-500);">Entregues</div><div style="font-size:24px;font-weight:800;color:var(--gray-900);" id="stEntregue">—</div></div></div>
    </div>

    <div id="avisoGlobal" style="display:none;margin-bottom:16px;padding:12px 14px;border-radius:10px;font-size:13px;"></div>

    <div id="grade" class="grid gap-4" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));"></div>
    <div id="estado" style="text-align:center;color:var(--gray-500);font-size:14px;padding:48px 8px;">Carregando galerias…</div>
  </main>
</div>
<script>lucide.createIcons();</script>

<script>
(function () {
  "use strict";

  var STATUS_LABEL = { aberta:"Aberta", em_andamento:"Em edição", concluida:"Concluída", entregue:"Entregue" };
  var STATUS_BADGE = { aberta:"badge-warning", em_andamento:"badge-info", concluida:"badge-success", entregue:"badge-purple" };

  var fotografoNome = "";
  var GALERIAS = [];       // agrupadas
  var grade = document.getElementById("grade");
  var estado = document.getElementById("estado");
  var busca = document.getElementById("busca");
  var avisoGlobal = document.getElementById("avisoGlobal");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function iniciais(nome) {
    var p = String(nome || "").trim().split(/\s+/).filter(Boolean);
    if (!p.length) return "FT";
    return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase();
  }
  function aviso(msg, tipo) {
    if (!msg) { avisoGlobal.style.display = "none"; return; }
    var cor = tipo === "erro" ? "background:#FEE2E2;color:#991B1B;" : "background:#FEF3C7;color:#92400E;";
    avisoGlobal.setAttribute("style", "margin-bottom:16px;padding:12px 14px;border-radius:10px;font-size:13px;" + cor);
    avisoGlobal.textContent = msg;
  }

  // nº de fotos: do título "(N fotos)" ou contando URLs nas observações
  function nFotos(o) {
    var m = /\((\d+)\s*fotos?\)/i.exec(o.titulo || "");
    if (m) return parseInt(m[1], 10);
    var m2 = /Fotos enviadas \((\d+)\)/i.exec(o.observacoes || "");
    if (m2) return parseInt(m2[1], 10);
    var urls = (o.observacoes || "").match(/https?:\/\//g);
    return urls ? urls.length : 0;
  }
  function daFotografo(o) {
    if (!fotografoNome) return true; // sem ?p: mostra todas as galerias de edição
    return new RegExp("Fot[oó]grafo:\\s*" + fotografoNome.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i").test(o.observacoes || "");
  }

  // carrega prestador (via ?p=) só para rótulo + filtro
  function identificarPrestador(cb) {
    var pid = new URLSearchParams(location.search).get("p");
    if (!pid) { cb(); return; }
    function aplicar(p) {
      if (p && p.nome) {
        fotografoNome = p.nome;
        var n = document.getElementById("prestadorNome"), f = document.getElementById("prestadorFuncao"), a = document.getElementById("prestadorAvatar");
        if (n) n.textContent = p.nome;
        if (f) f.textContent = (p.funcao || "Fotógrafo") + " · Ventus";
        if (a) a.textContent = iniciais(p.nome);
      }
      cb();
    }
    fetch(apiUrl("/api/cadastro/prestador/" + encodeURIComponent(pid)))
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(aplicar)
      .catch(function () { cb(); });
  }

  function agrupar(itens) {
    var mapa = {};
    itens.filter(function (o) { return o.tipo === "edicao" && daFotografo(o); }).forEach(function (o) {
      var chave = (o.turma_id || "?") + "|" + (o.evento_id || "?");
      if (!mapa[chave]) {
        mapa[chave] = {
          turma: o.turma || "Turma", evento: o.evento || "Evento fotográfico",
          fotos: 0, envios: 0, ultimoId: 0, statusUltimo: o.status, os: []
        };
      }
      var g = mapa[chave];
      g.fotos += nFotos(o);
      g.envios += 1;
      g.os.push(o);
      if (o.id > g.ultimoId) { g.ultimoId = o.id; g.statusUltimo = o.status; }
    });
    return Object.keys(mapa).map(function (k) { return mapa[k]; })
      .sort(function (a, b) { return b.ultimoId - a.ultimoId; });
  }

  function pintarResumo() {
    document.getElementById("stGalerias").textContent = GALERIAS.length;
    document.getElementById("stFotos").textContent = GALERIAS.reduce(function (s, g) { return s + g.fotos; }, 0);
    var emEdicao = 0, entregues = 0;
    GALERIAS.forEach(function (g) {
      if (g.statusUltimo === "aberta" || g.statusUltimo === "em_andamento") emEdicao++;
      if (g.statusUltimo === "entregue") entregues++;
    });
    document.getElementById("stEdicao").textContent = emEdicao;
    document.getElementById("stEntregue").textContent = entregues;
  }

  function render(filtro) {
    var termo = (filtro || "").trim().toLowerCase();
    var lista = GALERIAS.filter(function (g) {
      if (!termo) return true;
      return (g.turma + " " + g.evento).toLowerCase().indexOf(termo) !== -1;
    });
    if (!GALERIAS.length) {
      grade.innerHTML = "";
      estado.style.display = "";
      estado.innerHTML = '<div style="display:inline-flex;width:56px;height:56px;border-radius:16px;background:var(--gray-100);color:var(--gray-400);align-items:center;justify-content:center;margin-bottom:12px;"><i data-lucide="folder-open" class="w-7 h-7"></i></div>' +
        '<div style="font-weight:600;color:var(--gray-700);">Nenhuma galeria ainda</div>' +
        '<div style="margin-top:4px;">Faça um <a href="upload.html" style="color:var(--primary-700);font-weight:600;">upload em massa</a> para criar sua primeira galeria.</div>';
      if (window.lucide) lucide.createIcons();
      return;
    }
    estado.style.display = "none";
    if (!lista.length) { grade.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--gray-500);padding:32px;">Nenhuma galeria corresponde a “' + esc(filtro) + '”.</div>'; return; }
    grade.innerHTML = lista.map(function (g) {
      var badge = STATUS_BADGE[g.statusUltimo] || "badge-info";
      var label = STATUS_LABEL[g.statusUltimo] || g.statusUltimo;
      return '' +
        '<div class="card">' +
          '<div style="height:96px;border-radius:12px 12px 0 0;background:linear-gradient(135deg,#0A2540,#2563EB);position:relative;display:grid;place-items:center;">' +
            '<i data-lucide="images" class="w-8 h-8" style="color:rgba(255,255,255,.85);"></i>' +
            '<span class="badge ' + badge + '" style="position:absolute;top:10px;right:10px;">' + esc(label) + '</span>' +
          '</div>' +
          '<div class="card-body" style="padding:16px;">' +
            '<div style="font-weight:700;font-size:15px;color:var(--gray-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="' + esc(g.turma) + '">' + esc(g.turma) + '</div>' +
            '<div style="font-size:13px;color:var(--gray-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(g.evento) + '</div>' +
            '<div class="flex items-center gap-4 mt-3" style="font-size:13px;color:var(--gray-600);">' +
              '<span style="display:inline-flex;align-items:center;gap:5px;"><i data-lucide="image" class="w-4 h-4"></i> ' + g.fotos + ' fotos</span>' +
              '<span style="display:inline-flex;align-items:center;gap:5px;"><i data-lucide="send" class="w-4 h-4"></i> ' + g.envios + ' envio' + (g.envios === 1 ? "" : "s") + '</span>' +
            '</div>' +
          '</div>' +
        '</div>';
    }).join("");
    if (window.lucide) lucide.createIcons();
  }

  function carregar() {
    fetch(apiUrl("/api/os"))
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (d) {
        GALERIAS = agrupar(d.itens || []);
        pintarResumo();
        render("");
      })
      .catch(function () {
        estado.style.display = "none";
        aviso("Não foi possível carregar suas galerias. Verifique se o servidor está no ar.", "erro");
      });
  }

  // preserva ?p= na navegação lateral
  (function () {
    var qs = location.search || "";
    if (!qs) return;
    document.querySelectorAll("[data-nav]").forEach(function (a) {
      var href = a.getAttribute("href");
      if (href && href.indexOf("?") === -1) a.setAttribute("href", href + qs);
    });
  })();

  busca.addEventListener("input", function () { render(busca.value); });

  identificarPrestador(carregar);
})();
</script>
</body>
</html>
